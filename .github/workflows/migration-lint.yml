name: Migration Lint — SELECT-1 placeholder guard

# Phase E.2: block PRs that introduce a no-op SELECT-1 migration body.
# Files can opt out with a top-of-file `-- lint:allow-placeholder` marker
# (see scripts/lint-migrations.js).
#
# This workflow ALWAYS runs — no `paths:` filter.
#
# Status as of 2026-08-12 (verified against the live `main-protection` ruleset,
# id 20528052, updated 2026-08-07): "Lint migrations" is NOT currently a
# required status check. The ruleset requires exactly four contexts:
# "Secret Scanning", "Lint, Type-check & Test", "Production Build" and
# "CodeQL Analysis". An earlier version of this comment asserted this job WAS
# required; that is no longer true, so do not rely on it as a merge gate.
#
# The historical reason to be careful still stands: a required check that is
# paths-filtered never reports on PRs outside those paths, leaving them
# permanently unmergeable ("Required status check '...' is expected"; rulesets
# ignore admin bypass). PR #1298 (UI-only) hit exactly this, which is why the
# paths filter was removed 2026-07-16. The job costs ~14s (checkout + node +
# lint of the migrations dir in the tree) and passes when the tree is clean, so
# unconditional runs stay cheap — and they keep this job safe to promote back
# into the ruleset at any time without re-introducing the #1298 deadlock.

on:
  pull_request:
  push:
    branches: [main]
  # Added 2026-08-19 with the merge queue. Not a required context today, but a
  # merge queue is exactly where a placeholder migration would otherwise slip
  # through: the queue validates the MERGED commit, and two PRs that are each
  # individually clean can land a bad migration pair. ~14s, so it is free.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true

      - name: Lint migrations
        run: npm run lint:migrations
