name: Mesh Autonomous Cron

# HARD-SUSPENDED IN PHASE 0. The prior manual path combined write permission,
# staging service-role/Anthropic secrets, and shell-evaluated operator input.
# Restoring it requires a protected environment, main-only source enforcement,
# least-privilege token scope, and a reviewed non-eval argument contract.
#
# Required secrets — WHERE EACH ONE ACTUALLY LIVES (measured 2026-08-31 via
# `gh api`, superseding an earlier "Settings → Secrets and variables → Actions"
# claim that was true for only two of the three):
#   STAGING_SUPABASE_URL              — REPO-level secret. Resolves anywhere.
#   STAGING_SUPABASE_SERVICE_ROLE_KEY — REPO-level secret. Resolves anywhere.
#   ANTHROPIC_API_KEY                 — NOT repo-level. It exists only inside a
#                                       GitHub Environment that is literally
#                                       NAMED "ANTHROPIC_API_KEY" (the secret
#                                       name was pasted into the environment
#                                       name field; ~9 of this repo's 21
#                                       environments are that same mistake).
#                                       It is NOT in `agent-mesh-break-glass`,
#                                       which holds no secrets at all — see the
#                                       block on the `tick` job below.
#
# Cost ceiling: ~one cycle/day. At Sonnet+Opus rates a no-op cycle costs
# roughly $0.20–$0.50. Real cycles that touch code cost more. The job
# refuses to run if mesh-automation.enabled is missing — delete that
# file to disable.

on:
  # Phase 0: scheduled execution is suspended because the root workspace no
  # longer exposes the mesh:tick command used below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-cron
  cancel-in-progress: false

jobs:
  gate:
    name: Phase 0 Mesh Suspension Gate
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.suspend.outputs.enabled }}
    steps:
      - name: Refuse autonomous mesh execution
        id: suspend
        run: |
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::error::Agent mesh execution is suspended in Phase 0; a reviewed workflow change is required to restore it."
          exit 1

  tick:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    permissions:
      contents: write
      pull-requests: write
    # ─────────────────────────────────────────────────────────────────────────
    # READ THIS BEFORE CHANGING THE `environment:` BELOW.
    #
    # The comment that used to sit here was WRONG, and its wrongness spread:
    # it claimed that declaring `agent-mesh-break-glass` is what makes
    # `${{ secrets.ANTHROPIC_API_KEY }}` resolve. It does not. That sentence was
    # written for PR #713, which set `environment: ANTHROPIC_API_KEY` and was
    # true of THAT value; commit b66c25c3 ("ci: contain production delivery
    # paths") later changed the value to `agent-mesh-break-glass` and left the
    # sentence behind. model-id-canary.yml and docs/runbooks/model-id-canary.md
    # both went on to cite this file as evidence for how the secret resolves.
    #
    # MEASURED 2026-08-31 (`gh api`): `agent-mesh-break-glass` contains NO
    # SECRETS AT ALL. `ANTHROPIC_API_KEY` exists only in the environment of the
    # same name. So `secrets.ANTHROPIC_API_KEY` resolves EMPTY in this job and
    # the Required-env check below (`test -n "$ANTHROPIC_API_KEY"`) fails it.
    # Latent, not currently firing: `needs: gate` + `if: enabled == 'true'`
    # means `tick` is unreachable in Phase 0 and has not actually run.
    #
    # THE ENVIRONMENT IS NOT LEFT-OVER SLOPPINESS — DO NOT JUST REPOINT IT.
    # b66c25c3 introduced `agent-mesh-break-glass` as a deliberate containment
    # control, alongside the Phase-0 suspension gate, `permissions: contents:
    # read` at workflow level, and the removal of the `eval`-ed goal_override.
    # The file header states the restore conditions verbatim: "Restoring it
    # requires a PROTECTED ENVIRONMENT, main-only source enforcement,
    # least-privilege token scope, and a reviewed non-eval argument contract."
    # This environment IS that protected-environment requirement. This job runs
    # with `contents: write` + `pull-requests: write`, a staging service-role
    # credential and an Anthropic key, and it commits and opens PRs. Swapping
    # to `environment: ANTHROPIC_API_KEY` would make the secret resolve and
    # would ALSO delete the approval gate standing between an autonomous agent
    # and this repo's git history. That trade is not ops' to make silently.
    #
    # THE CORRECT FIX IS AN OPERATOR ACTION, NOT A WORKFLOW EDIT — put the
    # secret inside the break-glass environment so both properties hold:
    #     gh secret set ANTHROPIC_API_KEY --env agent-mesh-break-glass
    #     gh api repos/:owner/:repo/environments/agent-mesh-break-glass \
    #       --jq '{reviewers: .protection_rules}'   # confirm the gate survives
    # Then the required-env check passes AND break-glass approval still applies.
    # Do that before Phase 0 is ever lifted; until then this is latent.
    # Full context and the durable secret-layout fix: docs/runbooks/model-id-canary.md §11.
    # ─────────────────────────────────────────────────────────────────────────
    environment: agent-mesh-break-glass
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      MESH_GIT_AUTHOR: 'Alfanumrik Agent Mesh <mesh@alfanumrik.com>'
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # mesh needs full history for worktree baselines

      - name: Kill-switch check
        run: |
          if [ ! -f mesh-automation.enabled ]; then
            echo "::warning::mesh-automation.enabled is missing — automation is disabled. Exiting."
            exit 0
          fi
          echo "mesh-automation.enabled present — proceeding"

      - name: Required-env check
        run: |
          # Known cause if this fires: `agent-mesh-break-glass` holds no secrets
          # (measured 2026-08-31). Fix by putting the secret IN that environment
          # — `gh secret set ANTHROPIC_API_KEY --env agent-mesh-break-glass` —
          # not by repointing `environment:`, which would drop the break-glass
          # approval gate. See the block above the `environment:` key.
          test -n "$ANTHROPIC_API_KEY"           || { echo "::error::ANTHROPIC_API_KEY secret missing — it is NOT in the agent-mesh-break-glass environment this job declares. Do NOT repoint the environment; add the secret to it. See the comment above 'environment:' in this file."; exit 1; }
          test -n "$SUPABASE_URL"                || { echo "::error::STAGING_SUPABASE_URL secret missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY"   || { echo "::error::STAGING_SUPABASE_SERVICE_ROLE_KEY secret missing"; exit 1; }
          echo "All required env present"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Set up git author (mesh runtime needs to commit)
        run: |
          git config user.email "mesh@alfanumrik.com"
          git config user.name "Alfanumrik Agent Mesh"

      - name: Mesh tick (real L1+L2+L4+L6+L7 against staging)
        env:
          # gh CLI auto-picks GH_TOKEN for `gh pr create` etc.; the
          # actions/checkout step already configured the local git remote
          # with this token, so `git push` from the worktree also works.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run mesh:tick -- --commit --real-l1 --real-l2 --real-l4 --real-l6 --real-l7

      - name: Upload run logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-cron-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .mesh-worktrees/
            *.log
          if-no-files-found: ignore
          retention-days: 14
