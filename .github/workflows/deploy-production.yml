name: Deploy Production — Alfanumrik

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Pin Supabase CLI in CI so production deploys do not depend on unauthenticated
  # GitHub release lookups for "latest", which can rate-limit before deploy.
  SUPABASE_CLI_VERSION: '2.109.1'
  # Rollback syntax and JSON inspection are policy-checked against this version.
  VERCEL_CLI_VERSION: '55.0.0'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Canonical production domain — already aliased to the latest deployment after
  # `vercel deploy --prod`, and bypasses Vercel deployment-protection auth that
  # blocks the deployment-specific *.vercel.app URLs.
  PRODUCTION_DOMAIN: 'https://alfanumrik.com'

jobs:
  production-verification-gate:
    name: Prove Vercel Bypass Reaches App
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    outputs:
      rollback_baseline_valid: ${{ steps.baseline.outputs.rollback_baseline_valid }}
      rollback_baseline_deployment_id: ${{ steps.baseline.outputs.rollback_baseline_deployment_id }}
      rollback_baseline_git_sha: ${{ steps.baseline.outputs.rollback_baseline_git_sha }}
      rollback_baseline_project_id: ${{ steps.baseline.outputs.rollback_baseline_project_id }}
      rollback_baseline_owner_id: ${{ steps.baseline.outputs.rollback_baseline_owner_id }}
    steps:
      - name: Resolve canonical deployment before preflight
        id: baseline-before
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "identity_valid=false" >> "$GITHUB_OUTPUT"
          echo "deployment_id=" >> "$GITHUB_OUTPUT"
          echo "git_sha=" >> "$GITHUB_OUTPUT"
          echo "project_id=" >> "$GITHUB_OUTPUT"
          echo "owner_id=" >> "$GITHUB_OUTPUT"
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN is unavailable; automatic rollback baseline capture is disabled."
            exit 0
          fi
          CANONICAL_HOST="${PRODUCTION_DOMAIN#https://}"
          if [ "$CANONICAL_HOST" != "alfanumrik.com" ]; then
            echo "::warning::Canonical host is not the pinned production host; rollback baseline capture is disabled."
            exit 0
          fi
          DEPLOYMENT_FILE=$(mktemp)
          trap 'rm -f "$DEPLOYMENT_FILE"' EXIT
          if ! curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v13/deployments/${CANONICAL_HOST}" \
            -o "$DEPLOYMENT_FILE"; then
            echo "::warning::Could not resolve the canonical Vercel deployment; automatic rollback is disabled."
            exit 0
          fi
          mapfile -t IDENTITY < <(node - "$DEPLOYMENT_FILE" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require('fs');
          try {
            const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const [org, repo] = process.argv[3].split('/');
            const sha = d.gitSource?.sha || d.meta?.githubCommitSha || '';
            const valid = /^dpl_[A-Za-z0-9]+$/.test(d.id || '')
              && /^prj_[A-Za-z0-9]+$/.test(d.projectId || '')
              && /^(team|user)_[A-Za-z0-9]+$/.test(d.ownerId || '')
              && /^[0-9a-f]{40}$/.test(sha)
              && d.target === 'production'
              && d.readyState === 'READY'
              && d.gitSource?.type === 'github'
              && d.gitSource?.ref === 'main'
              && d.meta?.githubCommitOrg === org
              && d.meta?.githubCommitRepo === repo;
            console.log(valid ? 'true' : 'false');
            console.log(valid ? d.id : '');
            console.log(valid ? sha : '');
            console.log(valid ? d.projectId : '');
            console.log(valid ? d.ownerId : '');
          } catch {
            console.log('false\n\n\n\n');
          }
          NODE
          )
          if [ "${IDENTITY[0]:-false}" != "true" ]; then
            echo "::warning::Canonical deployment metadata is incomplete or unexpected; automatic rollback is disabled."
            exit 0
          fi
          echo "identity_valid=true" >> "$GITHUB_OUTPUT"
          echo "deployment_id=${IDENTITY[1]}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${IDENTITY[2]}" >> "$GITHUB_OUTPUT"
          echo "project_id=${IDENTITY[3]}" >> "$GITHUB_OUTPUT"
          echo "owner_id=${IDENTITY[4]}" >> "$GITHUB_OUTPUT"

      - name: Prove semantic application health JSON
        id: preflight
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "app_healthy=false" >> "$GITHUB_OUTPUT"
          echo "app_sha=" >> "$GITHUB_OUTPUT"
          echo "app_timestamp_fresh=false" >> "$GITHUB_OUTPUT"
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is required."
            exit 1
          fi
          TARGET_URL="${PRODUCTION_DOMAIN}/api/v1/health"
          set +e
          for attempt in 1 2 3; do
            BODY_FILE=$(mktemp)
            STATUS=$(curl -sS --max-time 10 -o "$BODY_FILE" -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "x-health-probe: github-actions-pre-deploy" \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$TARGET_URL" 2>/dev/null)
            CURL_EXIT=$?
            APP_RESPONSE=false
            if [ "$CURL_EXIT" = "0" ] && [ "$STATUS" = "200" ]; then
              APP_RESPONSE=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const known=['healthy','degraded','unhealthy'].includes(b.status);const valid=typeof b.ok==='boolean'&&known&&typeof b.timestamp==='string'&&b.timestamp.length>0&&typeof b.version?.git_sha==='string'&&b.version.git_sha.length>0;process.stdout.write(String(valid))}catch{process.stdout.write('false')}" "$BODY_FILE")
            fi
            if [ "$APP_RESPONSE" = "true" ]; then
              mapfile -t APP_IDENTITY < <(node - "$BODY_FILE" <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const sha = b.version.git_sha;
          const timestamp = Date.parse(b.timestamp);
          console.log(b.ok === true && b.status === 'healthy' ? 'true' : 'false');
          console.log(/^[0-9a-f]{7,40}$/.test(sha) ? sha : '');
          console.log(Number.isFinite(timestamp) && Math.abs(Date.now() - timestamp) <= 300000 ? 'true' : 'false');
          NODE
              )
              rm -f "$BODY_FILE"
              echo "app_healthy=${APP_IDENTITY[0]:-false}" >> "$GITHUB_OUTPUT"
              echo "app_sha=${APP_IDENTITY[1]:-}" >> "$GITHUB_OUTPUT"
              echo "app_timestamp_fresh=${APP_IDENTITY[2]:-false}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -f "$BODY_FILE"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::Refusing production mutations: bypass did not reach semantic app health JSON."
          exit 1

      - name: Bind a known-good rollback baseline
        id: baseline
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BEFORE_VALID: ${{ steps.baseline-before.outputs.identity_valid }}
          BEFORE_DEPLOYMENT_ID: ${{ steps.baseline-before.outputs.deployment_id }}
          BEFORE_GIT_SHA: ${{ steps.baseline-before.outputs.git_sha }}
          BEFORE_PROJECT_ID: ${{ steps.baseline-before.outputs.project_id }}
          BEFORE_OWNER_ID: ${{ steps.baseline-before.outputs.owner_id }}
          APP_HEALTHY: ${{ steps.preflight.outputs.app_healthy }}
          APP_SHA: ${{ steps.preflight.outputs.app_sha }}
          APP_TIMESTAMP_FRESH: ${{ steps.preflight.outputs.app_timestamp_fresh }}
        run: |
          echo "rollback_baseline_valid=false" >> "$GITHUB_OUTPUT"
          echo "rollback_baseline_deployment_id=" >> "$GITHUB_OUTPUT"
          echo "rollback_baseline_git_sha=" >> "$GITHUB_OUTPUT"
          echo "rollback_baseline_project_id=" >> "$GITHUB_OUTPUT"
          echo "rollback_baseline_owner_id=" >> "$GITHUB_OUTPUT"
          if [ "$BEFORE_VALID" != "true" ] || [ "$APP_HEALTHY" != "true" ] || [ "$APP_TIMESTAMP_FRESH" != "true" ] \
            || ! [[ "$APP_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::warning::No fresh, semantically healthy pre-deploy identity was captured; automatic rollback is disabled."
            exit 0
          fi
          if [ "$BEFORE_GIT_SHA" = "$GITHUB_SHA" ] || [ "${BEFORE_GIT_SHA:0:${#APP_SHA}}" != "$APP_SHA" ]; then
            echo "::warning::Preflight app SHA is raced or is already the incoming release; automatic rollback is disabled."
            exit 0
          fi
          CANONICAL_HOST="${PRODUCTION_DOMAIN#https://}"
          DEPLOYMENT_FILE=$(mktemp)
          trap 'rm -f "$DEPLOYMENT_FILE"' EXIT
          if ! curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v13/deployments/${CANONICAL_HOST}" \
            -o "$DEPLOYMENT_FILE"; then
            echo "::warning::Canonical deployment changed or became unreadable; automatic rollback is disabled."
            exit 0
          fi
          BOUND=$(node - "$DEPLOYMENT_FILE" "$GITHUB_REPOSITORY" "$BEFORE_DEPLOYMENT_ID" "$BEFORE_GIT_SHA" "$BEFORE_PROJECT_ID" "$BEFORE_OWNER_ID" <<'NODE'
          const fs = require('fs');
          try {
            const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const [org, repo] = process.argv[3].split('/');
            const valid = d.id === process.argv[4]
              && (d.gitSource?.sha || d.meta?.githubCommitSha) === process.argv[5]
              && d.projectId === process.argv[6]
              && d.ownerId === process.argv[7]
              && d.target === 'production'
              && d.readyState === 'READY'
              && d.gitSource?.type === 'github'
              && d.gitSource?.ref === 'main'
              && d.meta?.githubCommitOrg === org
              && d.meta?.githubCommitRepo === repo;
            process.stdout.write(String(valid));
          } catch { process.stdout.write('false'); }
          NODE
          )
          if [ "$BOUND" != "true" ]; then
            echo "::warning::Canonical deployment identity changed during preflight; automatic rollback is disabled."
            exit 0
          fi
          echo "rollback_baseline_valid=true" >> "$GITHUB_OUTPUT"
          echo "rollback_baseline_deployment_id=$BEFORE_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "rollback_baseline_git_sha=$BEFORE_GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "rollback_baseline_project_id=$BEFORE_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "rollback_baseline_owner_id=$BEFORE_OWNER_ID" >> "$GITHUB_OUTPUT"

  # ── Step 1: Quality Gate — proven-green CI for this exact SHA ──
  # 2026-07-20 de-duplication (user-approved): this job previously re-ran
  # npm ci + lint + type-check + unit tests + build here, duplicating the
  # "CI — Alfanumrik" workflow that the SAME push to main triggers on the
  # SAME commit (~15 runner-minutes of duplicate work per merge, doubling
  # runner contention). It now waits, FAIL-CLOSED, for that CI run's
  # "CI Gate" fan-in job to conclude success for the exact head SHA being
  # deployed. "CI Gate" is a strict superset of what this job used to run:
  # secret scan + RLS-on-CREATE-TABLE gate, lint + type-check + Auth &
  # Identity gate, all 4 unit-test shards + merged coverage thresholds,
  # Edge Function Deno tests, live-DB integration tests, and the production
  # build with the P10 bundle budgets.
  #
  # Fail-closed semantics:
  #   - Polls the Actions API every 30s, bounded at 20 min (CI's post-#1349
  #     critical path is ~5-8 min; the bound absorbs the simultaneous-start
  #     race on push to main plus runner-queue delays).
  #   - No ci.yml run found for this SHA, a "CI Gate" job that concludes
  #     anything other than success (failure / cancelled / skipped /
  #     timed_out), or the 20-min bound expiring → this job FAILS and
  #     nothing downstream (checklist, migrations, deploys) runs.
  #   - A push superseded by a newer push fails here BY DESIGN: ci.yml's
  #     concurrency cancels the in-progress CI run per ref, the cancelled
  #     gate is treated as failure, and only the newest SHA (with its own
  #     green CI Gate) deploys.
  #   - Keys on the "CI Gate" JOB rather than the whole-run conclusion so
  #     the quality verdict stays decoupled from the deploy plane: "CI Gate"
  #     aggregates every pre-merge quality job and nothing deploy-coupled,
  #     and job-level keying keeps that property even if ci.yml later grows
  #     advisory or deploy-coupled jobs. (Historically this also avoided a
  #     deadlock with ci.yml's push-to-main health-check job, which waited
  #     on the production deploy itself; that job is deleted — the
  #     post-deploy health check now lives in THIS workflow's health-check
  #     job below.)
  #
  # Build note: nothing downstream consumes a build artifact from this job.
  # The web deploy builds for itself (Vercel GitHub App remote build in
  # default operation, or the optional CLI `deploy` job's own `vercel
  # build`), so the build removed here was verification-only — and is still
  # enforced by CI Gate's required `build` job on the same SHA.
  #
  # NOTE: the poll script below is intentionally duplicated in
  # deploy-staging.yml (develop-push path). Keep both copies in sync.
  quality:
    name: Quality Gate (verify CI green for exact SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
    steps:
      - name: Wait for "CI — Alfanumrik" CI Gate success on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_NAME: 'CI — Alfanumrik'
          GATE_JOB_NAME: 'CI Gate'
          POLL_INTERVAL_SECONDS: '30'
          POLL_WINDOW_SECONDS: '1200'
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + POLL_WINDOW_SECONDS))
          RUNS_FILE=$(mktemp)
          JOBS_FILE=$(mktemp)
          trap 'rm -f "$RUNS_FILE" "$JOBS_FILE"' EXIT
          echo "Gating deploy on '${EXPECTED_WORKFLOW_NAME}' / '${GATE_JOB_NAME}' == success for ${GITHUB_SHA} (bound ${POLL_WINDOW_SECONDS}s, interval ${POLL_INTERVAL_SECONDS}s)."
          while :; do
            RUN_ID=""
            RUN_STATUS=""
            RUN_CONCLUSION=""
            if gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=10" > "$RUNS_FILE" 2>/dev/null; then
              mapfile -t RUN_FIELDS < <(jq -r --arg wf "$EXPECTED_WORKFLOW_NAME" --arg sha "$GITHUB_SHA" '
                ([.workflow_runs[]? | select(.name == $wf and .head_sha == $sha)] | sort_by(.id) | last) as $r
                | if $r == null then "", "", "" else ($r.id | tostring), $r.status, ($r.conclusion // "") end
              ' "$RUNS_FILE")
              RUN_ID="${RUN_FIELDS[0]:-}"
              RUN_STATUS="${RUN_FIELDS[1]:-}"
              RUN_CONCLUSION="${RUN_FIELDS[2]:-}"
            else
              echo "::warning::Could not list CI runs (transient API error); retrying."
            fi
            if [ -n "$RUN_ID" ]; then
              GATE_FOUND="false"
              GATE_STATUS=""
              GATE_CONCLUSION=""
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" > "$JOBS_FILE" 2>/dev/null; then
                mapfile -t GATE_FIELDS < <(jq -r --arg j "$GATE_JOB_NAME" '
                  ([.jobs[]? | select(.name == $j)] | last) as $g
                  | if $g == null then "false", "", "" else "true", $g.status, ($g.conclusion // "") end
                ' "$JOBS_FILE")
                GATE_FOUND="${GATE_FIELDS[0]:-false}"
                GATE_STATUS="${GATE_FIELDS[1]:-}"
                GATE_CONCLUSION="${GATE_FIELDS[2]:-}"
              else
                echo "::warning::Could not list jobs for CI run ${RUN_ID}; retrying."
              fi
              if [ "$GATE_FOUND" = "true" ] && [ "$GATE_STATUS" = "completed" ]; then
                if [ "$GATE_CONCLUSION" = "success" ]; then
                  echo "'${GATE_JOB_NAME}' succeeded for ${GITHUB_SHA} (CI run ${RUN_ID})."
                  exit 0
                fi
                echo "::error::'${GATE_JOB_NAME}' concluded '${GATE_CONCLUSION}' on CI run ${RUN_ID} for ${GITHUB_SHA}; refusing to deploy (cancelled/skipped/failed all fail this gate)."
                exit 1
              fi
              if [ "$RUN_STATUS" = "completed" ] && [ "$GATE_FOUND" != "true" ]; then
                echo "::error::CI run ${RUN_ID} completed ('${RUN_CONCLUSION}') without a '${GATE_JOB_NAME}' job; refusing to deploy."
                exit 1
              fi
              echo "CI run ${RUN_ID}: run status=${RUN_STATUS:-unknown}, gate status=${GATE_STATUS:-pending}; waiting."
            else
              echo "No '${EXPECTED_WORKFLOW_NAME}' push run found yet for ${GITHUB_SHA}; waiting."
            fi
            REMAINING=$((DEADLINE - SECONDS))
            if [ "$REMAINING" -le 0 ]; then
              echo "::error::Timed out after ${POLL_WINDOW_SECONDS}s without a successful '${GATE_JOB_NAME}' for ${GITHUB_SHA}; refusing to deploy."
              exit 1
            fi
            SLEEP_SECONDS="$POLL_INTERVAL_SECONDS"
            if [ "$REMAINING" -lt "$SLEEP_SECONDS" ]; then SLEEP_SECONDS="$REMAINING"; fi
            sleep "$SLEEP_SECONDS"
          done

  # ── Step 1b: Pre-Deployment Checklist ──
  pre-deploy-checklist:
    name: Pre-Deployment Checklist
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Check for pending migrations
        run: |
          echo "## Pre-Deployment Checklist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if any migrations were added in the last 10 commits
          MIGRATION_FILES=$(git diff --name-only HEAD~10..HEAD -- 'supabase/migrations/' 2>/dev/null || true)
          if [ -n "$MIGRATION_FILES" ]; then
            echo "### Migrations Detected" >> $GITHUB_STEP_SUMMARY
            echo "The following migrations are included in this deploy:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$MIGRATION_FILES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "**Ensure migrations have been applied to the production database before this deploy completes.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Migrations | None detected in recent commits |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for destructive changes
        run: |
          # Scan recent commits for DROP TABLE/COLUMN in migrations
          DESTRUCTIVE=$(git diff HEAD~10..HEAD -- 'supabase/migrations/' 2>/dev/null | grep -iE '^\+.*(DROP TABLE|DROP COLUMN|TRUNCATE)' || true)
          if [ -n "$DESTRUCTIVE" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### DESTRUCTIVE CHANGES DETECTED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$DESTRUCTIVE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "**Verify these were approved and compensating migration exists.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Scan for secrets in diff
        run: |
          # Final secret scan on what is being deployed.
          # Strategy: only flag added lines that look like an actual secret
          # ASSIGNMENT or live token. Skip comments (//, #, *, JSDoc) so
          # docstrings that *mention* env-var names don't false-positive.
          ADDED=$(git diff HEAD~1..HEAD 2>/dev/null | grep -E '^\+[^+]' || true)
          # Drop comment-only additions before scanning.
          NON_COMMENT=$(echo "$ADDED" | grep -vE '^\+[[:space:]]*(//|#|\*|<!--)' || true)
          # Patterns:
          #   - Stripe live secret: sk_live_<24+ chars>
          #   - Razorpay live key:  rzp_live_<14+ chars>
          #   - Supabase service role JWT (real key starts eyJ + long base64)
          #   - Any *SERVICE_ROLE_KEY* assignment with a non-placeholder value
          SECRETS_FOUND=$(echo "$NON_COMMENT" | grep -iE 'sk_live_[A-Za-z0-9]{24,}|rzp_live_[A-Za-z0-9]{14,}|eyJ[A-Za-z0-9_\-]{40,}\.[A-Za-z0-9_\-]{40,}|SERVICE_ROLE_KEY[[:space:]]*[=:][[:space:]]*[A-Za-z0-9._\-]{20,}' || true)
          if [ -n "$SECRETS_FOUND" ]; then
            echo ""
            echo "BLOCKED: Potential secrets in deployment diff."
            echo "$SECRETS_FOUND"
            exit 1
          fi
          echo "| Secret scan | Passed |" >> $GITHUB_STEP_SUMMARY

      - name: Verify environment requirements
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Node version | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | main |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | bom1 (Mumbai) |" >> $GITHUB_STEP_SUMMARY

  # ── Step 1c: Apply Database Migrations ──
  # Pushes changed SQL migrations in `supabase/migrations/` to the production
  # database BEFORE the Vercel deploy goes live, so the new web build never hits
  # a DB without the schema/seed it expects.
  #
  # WHY `--include-all` EXISTS: production can contain operator-applied
  # emergency migration versions that reached the remote ledger out of band.
  # Without `--include-all` the CLI refuses to apply committed files that sort
  # BEFORE the newest remote version. Note what that flag does and does not do:
  # it makes out-of-order LOCAL files applicable; it does NOT reconcile
  # REMOTE-only versions, which still abort the push outright.
  #
  # WHY BOTH PATHS NOW TOUCH THE DATABASE (Wave 1, 2026-08-09): this job used to
  # skip `supabase db push` entirely when a push carried no SQL, print
  # "skipped", and report success. A "frontend-only" release could therefore
  # ship application code against a database whose state nobody had verified,
  # and remote-ledger drift stayed invisible until the next migration-bearing
  # deploy — exactly the failure mode behind the out-of-band versions
  # 20260808085345 / 20260808085349 / 20260808085419, which sat undetected while
  # deploys reported green. Both paths now end in the SAME read-only
  # migration-history parity check, so out-of-band drift is surfaced HERE, on
  # the release that follows it, instead of being silently tolerated.
  migrations:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    needs: [production-verification-gate, quality, pre-deploy-checklist]
    environment: production
    outputs:
      production_migrations_changed: ${{ steps.migration-diff.outputs.changed }}
      production_migration_versions: ${{ steps.migration-diff.outputs.versions }}
      migration_parity: ${{ steps.parity.outputs.migration_parity }}
      migration_target_environment: ${{ steps.parity.outputs.target_environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect migration changes
        id: migration-diff
        run: |
          MIGRATION_FILES=$(git diff --name-only HEAD~1 HEAD -- 'supabase/migrations/' || true)
          # 14-digit versions carried by THIS release, used to bind the release
          # record to the migration set. Top-level only — `_legacy/` is out of
          # scope for `supabase db push`, mirroring how scripts/lint-migrations.js
          # scopes the chain.
          VERSIONS=$(printf '%s\n' "$MIGRATION_FILES" \
            | sed -nE 's#^supabase/migrations/([0-9]{14})_[^/]*\.sql$#\1#p' \
            | sort -u | paste -sd, -)
          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"
          if [ -n "$MIGRATION_FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Production migrations detected" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$MIGRATION_FILES" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "| Production migrations | None in this push; db push skipped, migration-history parity still verified below |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Unconditional: the parity check below runs on BOTH the changed and the
      # unchanged path, so the CLI must always be present.
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Push migrations to production
        if: steps.migration-diff.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all

      # ── Migration-history parity check (runs on BOTH paths) ──
      # READ-ONLY. Compares the committed migration set against the remote
      # `supabase_migrations.schema_migrations` ledger, read through the
      # Supabase CLI's own view of it (`supabase migration list --linked`), so
      # this check sees exactly what `supabase db push` would see. No new
      # secret: it reuses SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD /
      # SUPABASE_PROJECT_REF, which the push step above already uses.
      #
      # On the changed==true path it runs AFTER the push, so a green push must
      # leave the two ledgers in parity. On the changed==false path it is the
      # only database interaction, and it is what stops a frontend-only release
      # from bypassing database-state verification.
      - name: Verify migration-history parity
        id: parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          LC_ALL: C
        run: |
          echo "target_environment=production" >> "$GITHUB_OUTPUT"

          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password "$SUPABASE_DB_PASSWORD"

          # LOCAL: committed, top-level supabase/migrations/*.sql only.
          # -maxdepth 1 is what excludes `_legacy/`, matching both the Supabase
          # CLI's own scope and scripts/lint-migrations.js.
          LOCAL_VERSIONS=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -nE 's#^([0-9]{14})_.*\.sql$#\1#p' \
            | sort -u)

          # REMOTE: the "Remote" column of the CLI ledger view. Parsed
          # positionally (field 2 of a pipe-delimited row) and filtered to
          # 14-digit versions, so header/separator/progress lines drop out.
          if ! REMOTE_RAW=$(supabase migration list --linked 2>&1); then
            echo "::error::Could not read remote migration history — cannot prove database state for this release."
            printf '%s\n' "$REMOTE_RAW"
            echo "migration_parity=drift" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          REMOTE_VERSIONS=$(printf '%s\n' "$REMOTE_RAW" \
            | awk -F'|' 'NF>=2 { v=$2; gsub(/[^0-9]/, "", v); if (length(v) == 14) print v }' \
            | sort -u)

          LOCAL_COUNT=$(printf '%s\n' "$LOCAL_VERSIONS" | sed '/^$/d' | wc -l)
          REMOTE_COUNT=$(printf '%s\n' "$REMOTE_VERSIONS" | sed '/^$/d' | wc -l)
          echo "Committed migration versions: $LOCAL_COUNT"
          echo "Remote ledger versions:       $REMOTE_COUNT"

          # Non-vacuity: an empty side means the scan or the parse broke, not
          # that the ledgers agree. Fail rather than pass for the wrong reason.
          if [ "$LOCAL_COUNT" -eq 0 ]; then
            echo "::error::Found 0 committed migration versions under supabase/migrations/ — the parity scan is broken, not clean."
            echo "migration_parity=drift" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$REMOTE_COUNT" -eq 0 ]; then
            echo "::error::Parsed 0 remote migration versions from 'supabase migration list --linked' — the ledger read is broken, not clean."
            printf '%s\n' "$REMOTE_RAW"
            echo "migration_parity=drift" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          COMMITTED_NOT_REMOTE=$(comm -23 <(printf '%s\n' "$LOCAL_VERSIONS" | sed '/^$/d') <(printf '%s\n' "$REMOTE_VERSIONS" | sed '/^$/d'))
          REMOTE_NOT_COMMITTED=$(comm -13 <(printf '%s\n' "$LOCAL_VERSIONS" | sed '/^$/d') <(printf '%s\n' "$REMOTE_VERSIONS" | sed '/^$/d'))

          if [ -n "$COMMITTED_NOT_REMOTE" ] || [ -n "$REMOTE_NOT_COMMITTED" ]; then
            {
              echo ""
              echo "### Migration history parity: DRIFT"
              echo ""
              echo "Target environment: \`production\` (linked Supabase project)."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$COMMITTED_NOT_REMOTE" ]; then
              {
                echo "**Committed but NOT applied on remote** — this release would ship application code ahead of its schema:"
                echo '```'
                printf '%s\n' "$COMMITTED_NOT_REMOTE"
                echo '```'
                echo "Remediation: re-run this job after fixing whatever blocked the push, or apply the pending versions deliberately with \`supabase db push --linked --include-all\`."
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$REMOTE_NOT_COMMITTED" ]; then
              {
                echo "**Applied on remote but NOT committed** — out-of-band drift. This is exactly what aborts \`supabase db push --include-all\`, and surfacing it here is the point of this check:"
                echo '```'
                printf '%s\n' "$REMOTE_NOT_COMMITTED"
                echo '```'
                echo "Remediation: recover each version into a committed, idempotent migration file that reproduces what the operator applied — the same recovery performed for 20260808085345 / 20260808085349 / 20260808085419 (see \`docs/runbooks/production-release-gating.md\`). If a remote row is genuinely bogus, clear it deliberately with \`supabase migration repair --status reverted <version>\`; never hand-edit the ledger."
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::error::Migration history parity FAILED — committed migrations and the production ledger disagree. See the job summary for the offending versions."
            echo "migration_parity=drift" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "migration_parity=verified" >> "$GITHUB_OUTPUT"
          echo "| Migration history parity | verified ($LOCAL_COUNT committed == $REMOTE_COUNT remote) |" >> "$GITHUB_STEP_SUMMARY"
          echo "Migration history parity verified against production."

  # ── Step 2: Deploy to Vercel Production (requires approval) ──
  # NOTE: Vercel's native GitHub App handles auto-deploys on push to main.
  # This CLI-based job is OPTIONAL and only runs when VERCEL_TOKEN secret
  # is configured. If the token is missing, the job is skipped (not failed)
  # to avoid blocking CI, since Vercel App deploy is the canonical path.
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: [quality, pre-deploy-checklist, migrations]
    environment: production
    # Only run the CLI deploy if a deploy token is configured.
    # When missing, Vercel's GitHub App integration handles the deploy.
    if: ${{ vars.USE_CLI_DEPLOY == 'true' }}
    outputs:
      deploy-url: ${{ steps.deploy.outputs.deploy_url }}
      app-version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/host/package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Could not resolve apps/host package version for production release"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Install Vercel CLI
        run: npm install --global --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Reject placeholder env values from Vercel
        # Defensive guard added 2026-04-27 after a build shipped with
        # NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co baked into
        # the client bundle, breaking all browser-side Supabase calls.
        # If Vercel project env is misconfigured, fail the build immediately
        # rather than silently shipping a broken client to users.
        run: |
          if [ -f .vercel/.env.production.local ]; then
            ENVFILE=.vercel/.env.production.local
          elif [ -f .vercel/.env.preview.local ]; then
            ENVFILE=.vercel/.env.preview.local
          else
            echo "::error::No Vercel env file found after 'vercel pull'"
            exit 1
          fi
          BAD=0
          if grep -q "placeholder.supabase.co" "$ENVFILE" 2>/dev/null; then
            echo "::error::Vercel project has placeholder NEXT_PUBLIC_SUPABASE_URL — set the real Supabase project URL in Vercel Dashboard → Settings → Environment Variables → Production"
            BAD=1
          fi
          if grep -q "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder" "$ENVFILE" 2>/dev/null; then
            echo "::error::Vercel project has placeholder NEXT_PUBLIC_SUPABASE_ANON_KEY — set the real anon JWT in Vercel Dashboard → Settings → Environment Variables → Production"
            BAD=1
          fi
          if [ "$BAD" = "1" ]; then
            echo "Refusing to build with placeholder Supabase credentials. Fix Vercel env vars and redeploy."
            exit 1
          fi
          echo "Vercel env values look real (no placeholder markers detected)."

      # vercel build internally calls `npm run build`. Default Node 22 heap
      # is ~2 GB and the bundle has outgrown it — observed OOM on Deploy
      # Production run 25990539824 (commit 42eb0076 after #824). #819 fixed
      # the quality.Build step; this fixes the third site we'd missed.
      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"

  # ── Step 3: Health Check ──
  # Probes the canonical production domain (PRODUCTION_DOMAIN), NOT the
  # deployment-specific *.vercel.app URL, because:
  #   1. After `vercel deploy --prod`, the production alias already points
  #      at the new deployment, so the domain check covers the just-deployed
  #      build.
  #   2. Deployment-specific URLs are guarded by Vercel deployment-protection
  #      auth and return non-200 to unauthenticated curls — that was
  #      auto-rolling-back every deploy.
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 22
    needs: [production-verification-gate, migrations, deploy-functions, deploy]
    if: >-
      ${{ always()
      && needs.production-verification-gate.result == 'success'
      && needs.migrations.result == 'success'
      && needs.deploy-functions.result == 'success'
      && ((vars.USE_CLI_DEPLOY == 'true' && needs.deploy.result == 'success')
      || (vars.USE_CLI_DEPLOY != 'true' && needs.deploy.result == 'skipped')) }}
    outputs:
      exact_sha_verified: ${{ steps.health.outputs.exact_sha_verified }}
      verified_github_sha: ${{ steps.health.outputs.verified_github_sha }}
      content_verified_noop: ${{ steps.health.outputs.content_verified_noop }}
      verified_noop_base_sha: ${{ steps.health.outputs.verified_noop_base_sha }}
      build_intentionally_skipped: ${{ steps.health.outputs.build_intentionally_skipped }}
      verified_skip_base_sha: ${{ steps.health.outputs.verified_skip_base_sha }}
    steps:
      # Full history (not the repo default shallow clone) is required so the
      # no-op-deploy escape hatch below can resolve an arbitrary short SHA
      # reported by production and walk ancestry/diff it against $GITHUB_SHA.
      # Scoped to this job only — unrelated jobs keep their shallow/no
      # checkout and are unaffected.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Poll canonical production for healthy exact SHA
        id: health
        # Fail closed unless canonical production reports healthy exact SHA
        # OR a verified content-identical no-op (see verify-noop-deploy.sh).
        # Protection/network/stale-SHA evidence never authorizes rollback.
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          TARGET_URL="${PRODUCTION_DOMAIN}/api/v1/health"
          EXPECTED_SHA="${GITHUB_SHA:0:7}"
          POLL_WINDOW_SECONDS=600
          DEADLINE=$((SECONDS + POLL_WINDOW_SECONDS))
          ATTEMPT=0
          LAST_STATUS=""
          ALL_PROTECTION=1
          CURRENT_SHA_SEEN=0
          CURRENT_SHA_UNHEALTHY=0
          LAST_DEPLOYED_SHA=""
          LAST_SKIP_VERDICT="not-evaluated"
          echo "exact_sha_verified=false" >> "$GITHUB_OUTPUT"
          echo "verified_github_sha=" >> "$GITHUB_OUTPUT"
          echo "content_verified_noop=false" >> "$GITHUB_OUTPUT"
          echo "verified_noop_base_sha=" >> "$GITHUB_OUTPUT"
          echo "build_intentionally_skipped=false" >> "$GITHUB_OUTPUT"
          echo "verified_skip_base_sha=" >> "$GITHUB_OUTPUT"
          echo "rollback_authorized=false" >> "$GITHUB_OUTPUT"
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Bypass secret is unavailable; release is unverified."
            exit 1
          fi
          BYPASS_HEADER=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          set +e
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            BODY_FILE=$(mktemp)
            STATUS=$(curl -sS --max-time 10 -o "$BODY_FILE" -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "x-health-probe: github-actions" \
              "${BYPASS_HEADER[@]}" "$TARGET_URL" 2>/dev/null)
            CURL_EXIT=$?
            if [ "$CURL_EXIT" = "0" ]; then
              LAST_STATUS="$STATUS"
              case "$STATUS" in 401|403|429) ;; *) ALL_PROTECTION=0 ;; esac
              if [ "$STATUS" = "200" ]; then
                HEALTHY=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(b.ok===true&&b.status==='healthy'))}catch{process.stdout.write('false')}" "$BODY_FILE")
                SEMANTIC_UNHEALTHY=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(b.ok===false&&['degraded','unhealthy'].includes(b.status)))}catch{process.stdout.write('false')}" "$BODY_FILE")
                DEPLOYED_SHA=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(b.version?.git_sha||''))}catch{process.stdout.write('')}" "$BODY_FILE")
                LAST_DEPLOYED_SHA="$DEPLOYED_SHA"
                if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
                  CURRENT_SHA_SEEN=1
                  if [ "$SEMANTIC_UNHEALTHY" = "true" ]; then CURRENT_SHA_UNHEALTHY=1; fi
                fi
                if [ "$HEALTHY" = "true" ] && [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
                  rm -f "$BODY_FILE"
                  echo "exact_sha_verified=true" >> "$GITHUB_OUTPUT"
                  echo "verified_github_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                # No-op-deploy escape hatch. Production is demonstrably
                # healthy right now, just reporting a DIFFERENT sha than
                # ours. If that sha is a real git ancestor of ours with a
                # byte-identical tree, this is a genuine no-op release
                # (e.g. a follow-up push re-merging an already-integrated
                # branch) and there is nothing new for production to ever
                # converge on — polling for the literal sha would time out
                # even though production is correct. See
                # .github/scripts/verify-noop-deploy.sh for the ancestor +
                # empty-diff guard that keeps this from being a loophole
                # for a genuinely different/broken deploy.
                if [ "$HEALTHY" = "true" ] && [ -n "$DEPLOYED_SHA" ] && [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
                  NOOP_CHECK=$(bash .github/scripts/verify-noop-deploy.sh "$DEPLOYED_SHA" "$GITHUB_SHA" 2>/dev/null || true)
                  NOOP_OK=$(echo "$NOOP_CHECK" | awk '{print $1}')
                  if [ "$NOOP_OK" = "true" ]; then
                    NOOP_BASE_SHA=$(echo "$NOOP_CHECK" | cut -d' ' -f2-)
                    rm -f "$BODY_FILE"
                    echo "::notice::No-op deploy detected — $GITHUB_SHA has identical tree to already-healthy $NOOP_BASE_SHA. Skipping literal-SHA wait."
                    echo "exact_sha_verified=true" >> "$GITHUB_OUTPUT"
                    echo "verified_github_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
                    echo "content_verified_noop=true" >> "$GITHUB_OUTPUT"
                    echo "verified_noop_base_sha=$NOOP_BASE_SHA" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  # Intentionally-skipped-build escape hatch (2026-08-11).
                  # apps/host/vercel.json runs scripts/ignore-build.cjs as
                  # Vercel's ignoreCommand: a commit touching only ignored
                  # prefixes (docs/, .claude/, .github/, mobile/, ...)
                  # correctly produces NO new deployment, so no new sha will
                  # EVER appear on production. Polling the full 10 minutes and
                  # then failing with "Exact healthy SHA was not observed" is a
                  # guaranteed false red — that is exactly how commit b5bcd8277
                  # (docs-only) failed Deploy Production.
                  #
                  # Liveness is NOT relaxed: we are inside the
                  # HEALTHY=true branch, so production has already proven a 200
                  # + semantically healthy /api/v1/health on this very probe.
                  # Only the exact-SHA assertion is answered differently, and
                  # only when .github/scripts/verify-skipped-build.sh confirms
                  # (a) the reported sha resolves, (b) it is a true ancestor of
                  # ours, and (c) the ENTIRE range between it and us contains
                  # zero deployable files — delegated to the same
                  # ignore-build.cjs Vercel itself runs, so the ignored-prefix
                  # list is never duplicated here. Any deployable file in the
                  # gap reports false and the fail-closed path below stands.
                  SKIP_CHECK=$(bash .github/scripts/verify-skipped-build.sh "$DEPLOYED_SHA" "$GITHUB_SHA" 2>/dev/null || true)
                  SKIP_OK=$(echo "$SKIP_CHECK" | awk '{print $1}')
                  LAST_SKIP_VERDICT="$SKIP_CHECK"
                  if [ "$SKIP_OK" = "true" ]; then
                    SKIP_BASE_SHA=$(echo "$SKIP_CHECK" | cut -d' ' -f2-)
                    rm -f "$BODY_FILE"
                    echo "::notice::Vercel build intentionally skipped for $GITHUB_SHA (no deployable change since already-healthy $SKIP_BASE_SHA, per apps/host/scripts/ignore-build.cjs). Production verified live; skipping literal-SHA wait."
                    echo "exact_sha_verified=true" >> "$GITHUB_OUTPUT"
                    echo "verified_github_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
                    echo "build_intentionally_skipped=true" >> "$GITHUB_OUTPUT"
                    echo "verified_skip_base_sha=$SKIP_BASE_SHA" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                fi
              fi
            else
              LAST_STATUS="curl-exit-$CURL_EXIT"
              ALL_PROTECTION=0
            fi
            rm -f "$BODY_FILE"
            REMAINING=$((DEADLINE - SECONDS))
            if [ "$REMAINING" -le 0 ]; then break; fi
            SLEEP_SECONDS=20
            if [ "$REMAINING" -lt "$SLEEP_SECONDS" ]; then SLEEP_SECONDS="$REMAINING"; fi
            sleep "$SLEEP_SECONDS"
          done
          if [ "$ALL_PROTECTION" = "1" ] && [ "$ATTEMPT" -gt 0 ]; then
            echo "::error::All probes were blocked by Vercel protection; rollback suppressed."
            exit 1
          fi
          if [ "$CURRENT_SHA_SEEN" = "1" ] && [ "$CURRENT_SHA_UNHEALTHY" = "1" ]; then
            echo "rollback_authorized=true" >> "$GITHUB_OUTPUT"
            echo "::error::Expected SHA reached production but reported unhealthy."
            exit 1
          fi
          # Diagnostic (2026-08-11): this message used to say only "not
          # observed", which reads identically for two very different
          # situations — (a) a commit Vercel intentionally did not build, and
          # (b) a deploy that genuinely never landed and left production behind.
          # The skipped-build verdict below is what separates them, so print it.
          # "has-deployable-change:<a>..<b>" means case (b): production is
          # REALLY stale and this red is correct — go find the missing deploy.
          echo "::error::Exact healthy SHA was not observed (expected=$EXPECTED_SHA, production reported=${LAST_DEPLOYED_SHA:-<none>}, current_sha_seen=$CURRENT_SHA_SEEN, last=$LAST_STATUS); rollback suppressed."
          echo "::error::Intentionally-skipped-build check verdict: ${LAST_SKIP_VERDICT}"
          exit 1

      - name: Flag posture canary check (protected-flag drift gate)
        # Phase 0 flag-governance hardening (master action plan item 0.8).
        # Architect-owned guardrail: calls the already-deployed
        # /api/cron/flag-posture-canary route SYNCHRONOUSLY right after the
        # health check above, so a drifted protected feature flag (the
        # 2026-07-20 console bulk-enable incident's failure mode) fails THIS
        # deploy job the same way an unhealthy app does — instead of waiting
        # for the flag's own nightly Vercel cron slot (03:25 UTC).
        #
        # Deliberately does NOT feed rollback_authorized: a flag-posture drift
        # is a DATA/CONFIG problem (someone/something changed feature_flags),
        # not a CODE regression from this release, so an automatic Vercel
        # code-rollback would not fix it and could mask the real issue. Failing
        # the job still blocks post-deploy-verify/release/CI-Gate from reading
        # this deploy as healthy and pages the on-call the same way any other
        # failed health-check step does.
        #
        # Uses the CRON_SECRET GH secret (the SAME secret value the Vercel
        # cron sends as a Bearer token) against the just-verified canonical
        # production domain.
        #
        # Retry note (ops review, 2026-07-22): a single curl attempt could not
        # distinguish "the route returned a real, non-zero drift count" from
        # "a one-off network blip / cold start against a domain we JUST proved
        # healthy in the step above" — both failed this job identically. Only
        # a NON-200 / unreachable response is now retried (3 attempts, 10s
        # backoff, mirrors the app-health-check step's resilience posture in
        # this same job); a 200 response with a non-zero DRIFT_COUNT is a
        # real signal and fails immediately on the first attempt, no retry.
        #
        # Secret prerequisite (architect note, 2026-07-22): this canary is
        # defense-in-depth and requires its OWN `CRON_SECRET` GitHub Actions
        # secret — configured at the repo level or scoped to the `Production`
        # environment, the same pattern already used for
        # SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_REF
        # above — whose value matches the Vercel production `CRON_SECRET` env
        # var. That secret does not exist yet in this repo. Until it is added,
        # this step cannot authenticate to the route at all, so a missing
        # secret is treated as "could not verify" (warn and continue), NOT as
        # a detected drift ("could not verify" must never be conflated with
        # "verified clean" OR "verified drifted" — it fails open only because
        # we have no evidence either way). The primary release gate remains
        # the "Poll canonical production for healthy exact SHA" step above,
        # which already ran and passed for this SHA. Once the secret is
        # configured, any REAL non-200 response (after retries) or a nonzero
        # DRIFT_COUNT below still hard-fails this step exactly as before —
        # only the "secret is absent" branch fails open.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is unavailable; flag-posture canary skipped (this defense-in-depth check requires a CRON_SECRET GitHub Actions secret matching the Vercel production env var — add one at the repo or Production-environment level to enable it)."
            exit 0
          fi
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          STATUS=""
          BODY=""
          for attempt in 1 2 3; do
            set +e
            STATUS=$(curl -sS --max-time 15 -o "$RESPONSE_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Accept: application/json" \
              "${PRODUCTION_DOMAIN}/api/cron/flag-posture-canary" 2>/dev/null)
            CURL_EXIT=$?
            set -e
            if [ "$CURL_EXIT" = "0" ] && [ "$STATUS" = "200" ]; then
              break
            fi
            BODY=$(cat "$RESPONSE_FILE" 2>/dev/null || true)
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::flag-posture-canary attempt $attempt/3 did not reach a healthy 200 (curl_exit=$CURL_EXIT status=${STATUS:-none}); retrying in 10s."
              sleep 10
            fi
          done
          BODY=$(cat "$RESPONSE_FILE" 2>/dev/null || true)
          if [ "$STATUS" != "200" ]; then
            echo "::error::flag-posture-canary did not return a healthy 200 after 3 attempts (last status=${STATUS:-none}): $BODY"
            exit 1
          fi
          DRIFT_COUNT=$(node -e "try{const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.count ?? -1))}catch{process.stdout.write('-1')}" "$BODY")
          if [ "$DRIFT_COUNT" != "0" ]; then
            echo "::error::Feature-flag posture drift detected ($DRIFT_COUNT flag(s)): $BODY"
            exit 1
          fi
          echo "Flag posture canary: clean (0 drift)."

      - name: Auto-rollback on health check failure
        if: failure() && steps.health.outputs.rollback_authorized == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ROLLBACK_BASELINE_VALID: ${{ needs.production-verification-gate.outputs.rollback_baseline_valid }}
          ROLLBACK_BASELINE_DEPLOYMENT_ID: ${{ needs.production-verification-gate.outputs.rollback_baseline_deployment_id }}
          ROLLBACK_BASELINE_GIT_SHA: ${{ needs.production-verification-gate.outputs.rollback_baseline_git_sha }}
          ROLLBACK_BASELINE_PROJECT_ID: ${{ needs.production-verification-gate.outputs.rollback_baseline_project_id }}
          ROLLBACK_BASELINE_OWNER_ID: ${{ needs.production-verification-gate.outputs.rollback_baseline_owner_id }}
          PRODUCTION_MIGRATIONS_CHANGED: ${{ needs.migrations.outputs.production_migrations_changed }}
          EDGE_FUNCTIONS_CHANGED: ${{ needs.deploy-functions.outputs.edge_functions_changed }}
        run: |
          EXPECTED_SHA="${GITHUB_SHA:0:7}"
          ROLLBACK_EXPECTED_SHA="${ROLLBACK_BASELINE_GIT_SHA:0:7}"
          if [ "$ROLLBACK_BASELINE_VALID" != "true" ]; then
            echo "::warning::No verified pre-deploy baseline is available; automatic rollback suppressed."
            exit 0
          fi
          if [ "$PRODUCTION_MIGRATIONS_CHANGED" = "true" ] || [ "$EDGE_FUNCTIONS_CHANGED" = "true" ]; then
            echo "::warning::This release changed another deployment plane; automatic web-only rollback suppressed."
            exit 0
          fi
          if ! [[ "$ROLLBACK_BASELINE_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]] \
            || ! [[ "$ROLLBACK_BASELINE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || ! [[ "$ROLLBACK_BASELINE_PROJECT_ID" =~ ^prj_[A-Za-z0-9]+$ ]] \
            || ! [[ "$ROLLBACK_BASELINE_OWNER_ID" =~ ^(team|user)_[A-Za-z0-9]+$ ]] \
            || [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Rollback identity or Vercel credential is invalid; automatic rollback suppressed."
            exit 0
          fi
          CANONICAL_HOST="${PRODUCTION_DOMAIN#https://}"
          if [ "$CANONICAL_HOST" != "alfanumrik.com" ]; then
            echo "::warning::Canonical host is not pinned; automatic rollback suppressed."
            exit 0
          fi

          CANDIDATE_FILE=$(mktemp)
          CURRENT_BEFORE_FILE=$(mktemp)
          CURRENT_AFTER_FILE=$(mktemp)
          BODY_FILE=$(mktemp)
          trap 'rm -f "$CANDIDATE_FILE" "$CURRENT_BEFORE_FILE" "$CURRENT_AFTER_FILE" "$BODY_FILE"' EXIT
          fetch_deployment() {
            local identity="$1"
            local output="$2"
            curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Accept: application/json" \
              "https://api.vercel.com/v13/deployments/${identity}" \
              -o "$output"
          }

          if ! fetch_deployment "$ROLLBACK_BASELINE_DEPLOYMENT_ID" "$CANDIDATE_FILE"; then
            echo "::warning::Known-good rollback deployment is no longer readable; automatic rollback suppressed."
            exit 0
          fi
          CANDIDATE_VALID=$(node -e "const fs=require('fs');try{const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const [org,repo]=process.argv[6].split('/');const valid=d.id===process.argv[2]&&(d.gitSource?.sha||d.meta?.githubCommitSha)===process.argv[3]&&d.projectId===process.argv[4]&&d.ownerId===process.argv[5]&&d.target==='production'&&d.readyState==='READY'&&d.gitSource?.type==='github'&&d.gitSource?.ref==='main'&&d.meta?.githubCommitOrg===org&&d.meta?.githubCommitRepo===repo;process.stdout.write(String(valid))}catch{process.stdout.write('false')}" "$CANDIDATE_FILE" "$ROLLBACK_BASELINE_DEPLOYMENT_ID" "$ROLLBACK_BASELINE_GIT_SHA" "$ROLLBACK_BASELINE_PROJECT_ID" "$ROLLBACK_BASELINE_OWNER_ID" "$GITHUB_REPOSITORY")
          if [ "$CANDIDATE_VALID" != "true" ]; then
            echo "::warning::Known-good rollback metadata no longer matches the captured identity; automatic rollback suppressed."
            exit 0
          fi

          # Immediate rollback revalidation binds the canonical alias and its
          # semantic response to the exact failing GitHub SHA on both sides.
          if ! fetch_deployment "$CANONICAL_HOST" "$CURRENT_BEFORE_FILE"; then
            echo "::warning::Immediate rollback revalidation was inconclusive; automatic rollback suppressed."
            exit 0
          fi
          mapfile -t CURRENT_BEFORE < <(node -e "const fs=require('fs');try{const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const [org,repo]=process.argv[5].split('/');const sha=d.gitSource?.sha||d.meta?.githubCommitSha||'';const valid=/^dpl_[A-Za-z0-9]+$/.test(d.id||'')&&sha===process.argv[2]&&d.projectId===process.argv[3]&&d.ownerId===process.argv[4]&&d.target==='production'&&d.readyState==='READY'&&d.gitSource?.ref==='main'&&d.meta?.githubCommitOrg===org&&d.meta?.githubCommitRepo===repo;console.log(valid?'true':'false');console.log(valid?d.id:'');console.log(valid?sha:'')}catch{console.log('false\n\n')}" "$CURRENT_BEFORE_FILE" "$GITHUB_SHA" "$ROLLBACK_BASELINE_PROJECT_ID" "$ROLLBACK_BASELINE_OWNER_ID" "$GITHUB_REPOSITORY")
          if [ "${CURRENT_BEFORE[0]:-false}" != "true" ] || [ "${CURRENT_BEFORE[1]:-}" = "$ROLLBACK_BASELINE_DEPLOYMENT_ID" ]; then
            echo "::warning::Canonical deployment identity is raced or already equals the baseline; automatic rollback suppressed."
            exit 0
          fi

          set +e
          STATUS=$(curl -sS --max-time 15 -o "$BODY_FILE" -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "${PRODUCTION_DOMAIN}/api/v1/health" 2>/dev/null)
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" != "0" ] || [ "$STATUS" != "200" ]; then
            rm -f "$BODY_FILE"
            echo "::warning::Immediate rollback revalidation was inconclusive; automatic rollback suppressed."
            exit 0
          fi
          SEMANTIC_UNHEALTHY=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(b.ok===false&&['degraded','unhealthy'].includes(b.status)))}catch{process.stdout.write('false')}" "$BODY_FILE")
          DEPLOYED_SHA=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(b.version?.git_sha||''))}catch{process.stdout.write('')}" "$BODY_FILE")
          rm -f "$BODY_FILE"
          if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ] || [ "$SEMANTIC_UNHEALTHY" != "true" ]; then
            echo "::warning::Canonical state changed or lacks semantic unhealthy evidence (sha=$DEPLOYED_SHA semantic_unhealthy=$SEMANTIC_UNHEALTHY); automatic rollback suppressed."
            exit 0
          fi
          if ! fetch_deployment "$CANONICAL_HOST" "$CURRENT_AFTER_FILE"; then
            echo "::warning::Canonical identity could not be re-read; automatic rollback suppressed."
            exit 0
          fi
          mapfile -t CURRENT_AFTER < <(node -e "const fs=require('fs');try{const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const sha=d.gitSource?.sha||d.meta?.githubCommitSha||'';console.log(d.id===process.argv[2]&&sha===process.argv[3]?'true':'false');console.log(d.id||'');console.log(sha)}catch{console.log('false\n\n')}" "$CURRENT_AFTER_FILE" "${CURRENT_BEFORE[1]}" "$GITHUB_SHA")
          if [ "${CURRENT_AFTER[0]:-false}" != "true" ]; then
            echo "::warning::Canonical identity changed during immediate revalidation; automatic rollback suppressed."
            exit 0
          fi
          echo "Health check failed; rolling back to captured known-good deployment."
          npm install --global --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"
          vercel rollback "$ROLLBACK_BASELINE_DEPLOYMENT_ID" \
            --token="$VERCEL_TOKEN" --yes --timeout=3m

          ROLLBACK_VERIFY_WINDOW_SECONDS=300
          ROLLBACK_DEADLINE=$((SECONDS + ROLLBACK_VERIFY_WINDOW_SECONDS))
          while [ "$SECONDS" -lt "$ROLLBACK_DEADLINE" ]; do
            if fetch_deployment "$CANONICAL_HOST" "$CURRENT_BEFORE_FILE"; then
              mapfile -t ROLLBACK_ALIAS_BEFORE < <(node -e "const fs=require('fs');try{const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const sha=d.gitSource?.sha||d.meta?.githubCommitSha||'';console.log(d.id===process.argv[2]&&sha===process.argv[3]&&d.projectId===process.argv[4]&&d.ownerId===process.argv[5]&&d.target==='production'&&d.readyState==='READY'?'true':'false');console.log(d.id||'');console.log(sha)}catch{console.log('false\n\n')}" "$CURRENT_BEFORE_FILE" "$ROLLBACK_BASELINE_DEPLOYMENT_ID" "$ROLLBACK_BASELINE_GIT_SHA" "$ROLLBACK_BASELINE_PROJECT_ID" "$ROLLBACK_BASELINE_OWNER_ID")
              ROLLBACK_ALIAS_BEFORE_ID="${ROLLBACK_ALIAS_BEFORE[1]:-}"
              if [ "${ROLLBACK_ALIAS_BEFORE[0]:-false}" = "true" ]; then
                set +e
                STATUS=$(curl -sS --max-time 15 -o "$BODY_FILE" -w "%{http_code}" \
                  -H "Accept: application/json" \
                  -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                  "${PRODUCTION_DOMAIN}/api/v1/health" 2>/dev/null)
                CURL_EXIT=$?
                set -e
                if [ "$CURL_EXIT" = "0" ] && [ "$STATUS" = "200" ] \
                  && fetch_deployment "$CANONICAL_HOST" "$CURRENT_AFTER_FILE"; then
                  HEALTHY=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(b.ok===true&&b.status==='healthy'))}catch{process.stdout.write('false')}" "$BODY_FILE")
                  DEPLOYED_SHA=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(b.version?.git_sha||''))}catch{process.stdout.write('')}" "$BODY_FILE")
                  mapfile -t ROLLBACK_ALIAS_AFTER < <(node -e "const fs=require('fs');try{const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const sha=d.gitSource?.sha||d.meta?.githubCommitSha||'';console.log(d.id===process.argv[2]&&sha===process.argv[3]?'true':'false');console.log(d.id||'')}catch{console.log('false\n')}" "$CURRENT_AFTER_FILE" "$ROLLBACK_BASELINE_DEPLOYMENT_ID" "$ROLLBACK_BASELINE_GIT_SHA")
                  if [ "$HEALTHY" = "true" ] && [ "$DEPLOYED_SHA" = "$ROLLBACK_EXPECTED_SHA" ] \
                    && [ "${ROLLBACK_ALIAS_AFTER[0]:-false}" = "true" ] \
                    && [ "${ROLLBACK_ALIAS_AFTER[1]:-}" = "$ROLLBACK_ALIAS_BEFORE_ID" ]; then
                    echo "::notice::Rollback verified: canonical production is healthy at exact SHA $ROLLBACK_EXPECTED_SHA."
                    exit 0
                  fi
                fi
              fi
            fi
            REMAINING=$((ROLLBACK_DEADLINE - SECONDS))
            if [ "$REMAINING" -le 0 ]; then break; fi
            SLEEP_SECONDS=15
            if [ "$REMAINING" -lt "$SLEEP_SECONDS" ]; then SLEEP_SECONDS="$REMAINING"; fi
            sleep "$SLEEP_SECONDS"
          done
          echo "::error::Rollback command completed, but canonical identity and healthy exact-SHA proof were not observed within ${ROLLBACK_VERIFY_WINDOW_SECONDS}s."
          exit 1

  # ── Step 3a: Deploy Changed Edge Functions ──
  # Detects which Supabase Edge Functions changed in the merged commit and
  # redeploys only those (or all active functions if `_shared/` changed).
  # Runs after migrations so any new schema/RPC the function depends on is
  # already in the DB.
  #
  # NOTE: this job intentionally does NOT depend on `deploy` because the
  # canonical web deploy path is Vercel's GitHub App (the `deploy` job above
  # is gated on `vars.USE_CLI_DEPLOY == 'true'` and is skipped in default
  # operation). Edge Functions must redeploy on every push to main
  # regardless of which web-deploy path is active.
  deploy-functions:
    name: Deploy Changed Edge Functions
    runs-on: ubuntu-latest
    needs: [quality, pre-deploy-checklist, migrations]
    environment: production
    outputs:
      edge_functions_changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed Edge Functions
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'supabase/functions/' \
            | grep -vE '(_archive|_shared|__tests__)' \
            | awk -F/ 'NF>=3 {print $3}' | sort -u | grep -v '^$' || true)
          # If _shared/ changed, redeploy ALL active functions (consumers depend on it)
          if git diff --name-only HEAD~1 HEAD -- 'supabase/functions/_shared/' | grep -q .; then
            CHANGED=$(ls -d supabase/functions/*/ | grep -vE '(_archive|_shared)' | xargs -n1 basename | sort -u)
            echo "_shared changed → deploying ALL active functions"
          fi
          echo "Changed functions:"
          echo "$CHANGED"
          {
            echo 'functions<<EOF'
            echo "$CHANGED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v2
        if: steps.changed.outputs.functions != ''
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Deploy each changed function
        if: steps.changed.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          done <<< "${{ steps.changed.outputs.functions }}"

  # ── Step 3b: Post-Deploy Verification ──
  # Probes the canonical production domain (PRODUCTION_DOMAIN) for the same
  # reasons as the Health Check job above (deployment-protection auth wall).
  # The deploy URL is still captured in the summary for traceability.
  #
  # Independently re-proves semantic health and exact release identity.
  post-deploy-verify:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: [health-check]
    if: >-
      ${{ !cancelled()
      && needs.health-check.result == 'success'
      && needs.health-check.outputs.exact_sha_verified == 'true'
      && needs.health-check.outputs.verified_github_sha == github.sha }}
    outputs:
      exact_sha_verified: ${{ steps.verify.outputs.exact_sha_verified }}
      verified_github_sha: ${{ steps.verify.outputs.verified_github_sha }}
      content_verified_noop: ${{ steps.verify.outputs.content_verified_noop }}
      verified_noop_base_sha: ${{ steps.verify.outputs.verified_noop_base_sha }}
      build_intentionally_skipped: ${{ steps.verify.outputs.build_intentionally_skipped }}
      verified_skip_base_sha: ${{ steps.verify.outputs.verified_skip_base_sha }}
    steps:
      # Full history required for the no-op-deploy escape hatch in the health
      # probe below (mirrors health-check job). Scoped to this job only.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify critical endpoints
        id: verify
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          TARGET_URL="${PRODUCTION_DOMAIN}"
          EXPECTED_SHA="${GITHUB_SHA:0:7}"
          echo "exact_sha_verified=false" >> "$GITHUB_OUTPUT"
          echo "verified_github_sha=" >> "$GITHUB_OUTPUT"
          echo "content_verified_noop=false" >> "$GITHUB_OUTPUT"
          echo "verified_noop_base_sha=" >> "$GITHUB_OUTPUT"
          echo "build_intentionally_skipped=false" >> "$GITHUB_OUTPUT"
          echo "verified_skip_base_sha=" >> "$GITHUB_OUTPUT"
          echo "## Post-Deploy Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Probed domain: \`$TARGET_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

          BYPASS_HEADER=()
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Bypass secret is required for post-deploy verification."
            exit 1
          fi
          BYPASS_HEADER=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")

          # ── Post-deploy health probe ────────────────────────────────────────
          # CI-gate forensic audit, 2026-07-28 — two repairs in this block.
          #
          # (1) DIAGNOSTIC WAS DELETED BEFORE IT WAS READ.
          #     The old code did `rm -f "$HEALTH_BODY"` immediately after
          #     extracting `healthy` and `git_sha`, and only THEN evaluated the
          #     failure branch. The /api/v1/health payload carries
          #     `unhealthy_components: string[]` plus per-check status/latency —
          #     the only information that says WHICH subsystem is down — and it
          #     was destroyed before the ::error:: line ran. The operator paged at
          #     3am got `healthy=false` and nothing else. The body is now parsed
          #     for component detail and echoed BEFORE any cleanup, and cleanup
          #     happens once, at the end.
          #
          # (2) SINGLE-SHOT PROBE CAUSED A FALSE PAGE.
          #     This job had no retry. During the audit, two jobs 9 SECONDS APART
          #     disagreed about production health and this one paged — production
          #     was fine. The health-check job above already polls for 10 minutes;
          #     this job re-probes the SAME domain moments later and must be at
          #     least as resilient. Bounded retry: VERIFY_ATTEMPTS attempts with
          #     linear backoff, short-circuiting on the first healthy exact-SHA
          #     response. This does NOT weaken the gate — it still fails if every
          #     attempt fails; it only refuses to page on a single transient flap.
          VERIFY_ATTEMPTS=4
          VERIFY_BACKOFF_SECONDS=10
          HEALTH_BODY=$(mktemp)
          HEALTH_STATUS=""
          HEALTHY="false"
          DEPLOYED_SHA=""
          UNHEALTHY_COMPONENTS=""
          COMPONENT_DETAIL=""
          NOOP_VERIFIED="false"
          NOOP_BASE_SHA=""
          SKIP_VERIFIED="false"
          SKIP_BASE_SHA=""

          for attempt in $(seq 1 "$VERIFY_ATTEMPTS"); do
            : > "$HEALTH_BODY"
            HEALTH_STATUS=$(curl -sS --max-time 15 -o "$HEALTH_BODY" -w "%{http_code}" \
              "${BYPASS_HEADER[@]}" "${TARGET_URL}/api/v1/health" 2>/dev/null || true)
            HEALTHY=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(b.ok===true&&b.status==='healthy'))}catch{process.stdout.write('false')}" "$HEALTH_BODY")
            DEPLOYED_SHA=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(b.version?.git_sha||''))}catch{process.stdout.write('')}" "$HEALTH_BODY")
            # Component detail — extracted BEFORE any cleanup, every attempt, so
            # the LAST failing attempt still has its diagnostic available below.
            UNHEALTHY_COMPONENTS=$(node -e "const fs=require('fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(Array.isArray(b.unhealthy_components)?b.unhealthy_components.join(','):'')}catch{process.stdout.write('')}" "$HEALTH_BODY")
            COMPONENT_DETAIL=$(node -e "
              const fs=require('fs');
              try{
                const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));
                const c=b.checks||b.components||{};
                const rows=Object.entries(c).map(([k,v])=>
                  typeof v==='object'&&v?\`\${k}=\${v.status||'?'}\${v.detail?' ('+String(v.detail).slice(0,120)+')':''}\${v.error?' ('+String(v.error).slice(0,120)+')':''}\`:\`\${k}=\${v}\`);
                process.stdout.write(rows.join(' | '));
              }catch{process.stdout.write('')}
            " "$HEALTH_BODY")

            echo "attempt $attempt/$VERIFY_ATTEMPTS: http=$HEALTH_STATUS healthy=$HEALTHY sha=$DEPLOYED_SHA expected=$EXPECTED_SHA"
            if [ -n "$UNHEALTHY_COMPONENTS" ]; then
              echo "  unhealthy_components: $UNHEALTHY_COMPONENTS"
            fi

            if [ "$HEALTH_STATUS" = "200" ] && [ "$HEALTHY" = "true" ] && [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              break
            fi

            # No-op-deploy escape hatch (mirrors the health-check job's
            # identical guard — see .github/scripts/verify-noop-deploy.sh).
            # Production is healthy right now but reporting a different sha;
            # only treat this as verified if that sha is a real ancestor of
            # ours with a byte-identical tree. Never trust an unresolved,
            # unrelated, or content-different sha.
            if [ "$HEALTH_STATUS" = "200" ] && [ "$HEALTHY" = "true" ] && [ -n "$DEPLOYED_SHA" ] && [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
              NOOP_CHECK=$(bash .github/scripts/verify-noop-deploy.sh "$DEPLOYED_SHA" "$GITHUB_SHA" 2>/dev/null || true)
              NOOP_OK=$(echo "$NOOP_CHECK" | awk '{print $1}')
              if [ "$NOOP_OK" = "true" ]; then
                NOOP_VERIFIED="true"
                NOOP_BASE_SHA=$(echo "$NOOP_CHECK" | cut -d' ' -f2-)
                echo "::notice::No-op deploy detected — $GITHUB_SHA has identical tree to already-healthy $NOOP_BASE_SHA. Treating post-deploy exact-SHA check as satisfied."
                break
              fi

              # Intentionally-skipped-build escape hatch — mirrors the
              # health-check job's identical guard. See
              # .github/scripts/verify-skipped-build.sh: production is proven
              # healthy on this very probe; only the exact-SHA assertion is
              # relaxed, and only when the reported sha is a real ancestor and
              # the whole gap contains zero deployable files according to the
              # same apps/host/scripts/ignore-build.cjs Vercel runs as its
              # ignoreCommand. Without this, every docs-only / .github-only /
              # mobile-only commit to main fails this job by construction.
              SKIP_CHECK=$(bash .github/scripts/verify-skipped-build.sh "$DEPLOYED_SHA" "$GITHUB_SHA" 2>/dev/null || true)
              SKIP_OK=$(echo "$SKIP_CHECK" | awk '{print $1}')
              if [ "$SKIP_OK" = "true" ]; then
                SKIP_VERIFIED="true"
                SKIP_BASE_SHA=$(echo "$SKIP_CHECK" | cut -d' ' -f2-)
                echo "::notice::Vercel build intentionally skipped for $GITHUB_SHA (no deployable change since already-healthy $SKIP_BASE_SHA). Treating post-deploy exact-SHA check as satisfied."
                break
              fi
            fi

            if [ "$attempt" -lt "$VERIFY_ATTEMPTS" ]; then
              SLEEP_FOR=$((VERIFY_BACKOFF_SECONDS * attempt))
              echo "  transient? retrying in ${SLEEP_FOR}s"
              sleep "$SLEEP_FOR"
            fi
          done

          if [ "$HEALTH_STATUS" != "200" ] || [ "$HEALTHY" != "true" ] || { [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ] && [ "$NOOP_VERIFIED" != "true" ] && [ "$SKIP_VERIFIED" != "true" ]; }; then
            # Echo the diagnostic BEFORE deleting the body. This is the fix for
            # the "operator gets no detail" defect.
            echo "::error::Post-deploy health did not prove healthy exact SHA after $VERIFY_ATTEMPTS attempt(s) (http=$HEALTH_STATUS healthy=$HEALTHY sha=$DEPLOYED_SHA expected=$EXPECTED_SHA)."
            echo "::error::unhealthy_components: ${UNHEALTHY_COMPONENTS:-<none reported>}"
            echo "::error::component detail: ${COMPONENT_DETAIL:-<none parsed>}"
            echo "---- /api/v1/health response body (first 2000 bytes) ----"
            head -c 2000 "$HEALTH_BODY" || true
            echo ""
            echo "---- end body ----"
            {
              echo "### Post-deploy health FAILED"
              echo ""
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| http | $HEALTH_STATUS |"
              echo "| healthy | $HEALTHY |"
              echo "| deployed sha | ${DEPLOYED_SHA:-<none>} |"
              echo "| expected sha | $EXPECTED_SHA |"
              echo "| unhealthy_components | ${UNHEALTHY_COMPONENTS:-<none reported>} |"
              echo "| component detail | ${COMPONENT_DETAIL:-<none parsed>} |"
              echo "| attempts | $VERIFY_ATTEMPTS |"
            } >> $GITHUB_STEP_SUMMARY
            rm -f "$HEALTH_BODY"
            exit 1
          fi
          if [ -n "$UNHEALTHY_COMPONENTS" ]; then
            echo "::warning::Health reported healthy overall but listed components: $UNHEALTHY_COMPONENTS"
          fi
          rm -f "$HEALTH_BODY"

          # Track application failures separately from checkpoint responses.
          # Every required endpoint must be verified through the bypass; even
          # one checkpoint response leaves the release unverified.
          REAL_FAIL=0
          BYPASS_BLOCKED=0
          PROBES=0

          check() {
            local label="$1"
            local path="$2"
            shift 2
            # Remaining args are the list of accepted status codes.
            local accepted=("$@")
            PROBES=$((PROBES + 1))
            local status
            local curl_exit
            local headers_file
            local body_file
            headers_file=$(mktemp)
            body_file=$(mktemp)
            status=$(curl -sS -D "$headers_file" -o "$body_file" -w "%{http_code}" \
              -A "Alfanumrik-CI-PostDeploy/1.0 (+https://alfanumrik.com)" \
              "${BYPASS_HEADER[@]}" \
              "${TARGET_URL}${path}" 2>/dev/null)
            curl_exit=$?
            if [ "$curl_exit" -ne 0 ] && [ "$status" = "000" ]; then
              if grep -qiE 'Vercel Security Checkpoint|x-vercel-mitigated: challenge|x-vercel-challenge-token' "$headers_file" "$body_file" 2>/dev/null; then
                status="429"
              else
                echo "| $label | FAIL (curl-exit-$curl_exit) |" >> "$GITHUB_STEP_SUMMARY"
                REAL_FAIL=$((REAL_FAIL + 1))
                rm -f "$headers_file" "$body_file"
                return 1
              fi
            fi
            for code in "${accepted[@]}"; do
              if [ "$status" = "$code" ]; then
                echo "| $label | $status |" >> $GITHUB_STEP_SUMMARY
                rm -f "$headers_file" "$body_file"
                return 0
              fi
            done
            if [ "$status" = "429" ]; then
              echo "| $label | 429 (Vercel checkpoint) |" >> $GITHUB_STEP_SUMMARY
              BYPASS_BLOCKED=$((BYPASS_BLOCKED + 1))
              rm -f "$headers_file" "$body_file"
              return 0
            fi
            echo "| $label | FAIL ($status) |" >> $GITHUB_STEP_SUMMARY
            REAL_FAIL=$((REAL_FAIL + 1))
            rm -f "$headers_file" "$body_file"
            return 1
          }

          # Aggregate all endpoint failures instead of letting the runner's
          # default `bash -e` stop after the first failed check.
          set +e
          check "/api/v1/health" "/api/v1/health" "200"
          # Homepage: 200 (Next.js render) or 307/308 (redirect to /welcome marketing route).
          check "/ (homepage)"   "/"              "200" "307" "308"
          check "/login"         "/login"         "200" "307"

          # Security headers check — meaningful only if the response is the
          # real app, not the Vercel challenge page. When the challenge is
          # engaged (all probes 429), skip this check; otherwise enforce.
          if [ "$BYPASS_BLOCKED" -lt "$PROBES" ]; then
            HEADERS=$(curl -sI "${BYPASS_HEADER[@]}" "${TARGET_URL}/" 2>/dev/null)
            if echo "$HEADERS" | grep -qi "x-frame-options"; then
              echo "| Security headers | Present |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Security headers | MISSING |" >> $GITHUB_STEP_SUMMARY
              REAL_FAIL=$((REAL_FAIL + 1))
            fi
          else
            echo "| Security headers | skipped (checkpoint engaged) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo ""
          echo "Probes: $PROBES   Real failures: $REAL_FAIL   Checkpoint-blocked: $BYPASS_BLOCKED"

          if [ "$REAL_FAIL" -gt 0 ]; then
            echo "Post-deploy verification found real failures (non-429 / wrong status)."
            echo "Rollback: Vercel Dashboard > Deployments > Promote previous deployment"
            exit 1
          fi

          if [ "$BYPASS_BLOCKED" -gt 0 ]; then
            echo "::error::At least one required probe was blocked by Vercel protection; production is unverified."
            exit 1
          fi

          echo "exact_sha_verified=true" >> "$GITHUB_OUTPUT"
          echo "verified_github_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$NOOP_VERIFIED" = "true" ]; then
            echo "content_verified_noop=true" >> "$GITHUB_OUTPUT"
            echo "verified_noop_base_sha=$NOOP_BASE_SHA" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SKIP_VERIFIED" = "true" ]; then
            echo "build_intentionally_skipped=true" >> "$GITHUB_OUTPUT"
            echo "verified_skip_base_sha=$SKIP_BASE_SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "All post-deploy verifications passed."

  # ── Step 4: Release Tag & Summary ──
  release:
    name: Create Release & Summary
    runs-on: ubuntu-latest
    # `migrations` is in `needs` so the release RECORD can be bound to the
    # migration set it shipped against (app SHA + versions + parity + target
    # environment). It adds no new skip risk: `migrations` is unconditional,
    # and health-check already refuses to run unless it succeeded.
    needs: [health-check, post-deploy-verify, migrations]
    # The optional CLI `deploy` job (gated on vars.USE_CLI_DEPLOY) is intentionally
    # NOT in `needs`: in default operation Vercel's GitHub App handles the web
    # deploy and `deploy` is skipped. A skipped `needs` dependency would cascade
    # and skip this `release` job too — which is why no release tag was being
    # created on normal production deploys. Gate on the two jobs that always run
    # (health-check + post-deploy-verify) instead, and only tag on a real push to
    # main where both passed.
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.health-check.result == 'success'
      && needs.health-check.outputs.exact_sha_verified == 'true'
      && needs.health-check.outputs.verified_github_sha == github.sha
      && needs.post-deploy-verify.result == 'success'
      && needs.post-deploy-verify.outputs.exact_sha_verified == 'true'
      && needs.post-deploy-verify.outputs.verified_github_sha == github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Version no longer comes from the (optionally-skipped) `deploy` job — read
      # it from the host app package so release tagging works on the default
      # Vercel-GitHub-App deploy path.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/host/package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Could not resolve apps/host package version for production release"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Create GitHub release tag
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const sha = context.sha;
            const tagName = `v${version}`;
            const releaseName = `v${version}`;

            // Bind the release record to the database state it shipped against.
            // A release note that names only the app SHA cannot answer "was the
            // schema ahead of, behind, or level with this code?" months later.
            const migrationsChanged = '${{ needs.migrations.outputs.production_migrations_changed }}' || 'unknown';
            const migrationVersions = '${{ needs.migrations.outputs.production_migration_versions }}' || 'none';
            const migrationParity = '${{ needs.migrations.outputs.migration_parity }}' || 'unknown';
            const targetEnvironment = '${{ needs.migrations.outputs.migration_target_environment }}' || 'unknown';
            const migrationNotes = [
              `**App commit:** \`${sha}\``,
              `**Target environment:** ${targetEnvironment}`,
              `**Migrations changed in this release:** ${migrationsChanged}`,
              `**Migration versions applied:** ${migrationVersions}`,
              `**Migration history parity:** ${migrationParity}`,
            ];

            // Check if tag already exists
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`,
              });

              // Tag exists — append short SHA to make it unique
              const uniqueTag = `${tagName}+${sha.substring(0, 7)}`;
              console.log(`Tag ${tagName} already exists. Using ${uniqueTag} instead.`);

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: uniqueTag,
                target_commitish: sha,
                name: `${releaseName} (${sha.substring(0, 7)})`,
                body: [
                  `## Alfanumrik ${uniqueTag}`,
                  '',
                  `**Commit:** \`${sha}\``,
                  `**Deployed to:** ${process.env.PRODUCTION_DOMAIN}`,
                  '',
                  '### Database state',
                  ...migrationNotes,
                  '',
                  '_Automatically released by the production deploy workflow._',
                ].join('\n'),
                draft: false,
                prerelease: false,
              });
            } catch (e) {
              if (e.status === 404) {
                // Tag does not exist — create release normally
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tagName,
                  target_commitish: sha,
                  name: releaseName,
                  body: [
                    `## Alfanumrik ${tagName}`,
                    '',
                    `**Commit:** \`${sha}\``,
                    `**Deployed to:** ${process.env.PRODUCTION_DOMAIN}`,
                    '',
                    '### Database state',
                    ...migrationNotes,
                    '',
                    '_Automatically released by the production deploy workflow._',
                  ].join('\n'),
                  draft: false,
                  prerelease: false,
                });
              } else {
                throw e;
              }
            }

      - name: Post deployment summary
        env:
          # Via env (not direct interpolation) so an empty version list renders
          # as "none" instead of collapsing the table cell.
          MIGRATION_VERSIONS_SUMMARY: ${{ needs.migrations.outputs.production_migration_versions }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Production Deployment Summary

          | Detail | Value |
          |--------|-------|
          | **Version** | \`v${{ steps.version.outputs.version }}\` |
          | **App commit** | \`${GITHUB_SHA}\` |
          | **Branch** | \`main\` |
          | **Deploy URL** | ${{ env.PRODUCTION_DOMAIN }} |
          | **Target environment** | ${{ needs.migrations.outputs.migration_target_environment }} |
          | **Migrations changed** | ${{ needs.migrations.outputs.production_migrations_changed }} |
          | **Migration versions applied** | \`${MIGRATION_VERSIONS_SUMMARY:-none}\` |
          | **Migration history parity** | ${{ needs.migrations.outputs.migration_parity }} |
          | **Health Check** | Passed |
          | **Post-Deploy Verify** | Passed |
          | **Deployed at** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |

          Deployment triggered by push to \`main\`.
          EOF

  # A skipped job reports success to GitHub. Keep a terminal sentinel so an
  # unexpected condition/needs propagation skip cannot leave production green
  # without endpoint verification and release evidence.
  production-release-completion-gate:
    name: Production Release Completion Gate
    runs-on: ubuntu-latest
    needs: [health-check, post-deploy-verify, release, migrations, deploy-functions]
    if: ${{ always() }}
    steps:
      - name: Enforce terminal production release outcomes
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_CHECK_RESULT: ${{ needs.health-check.result }}
          HEALTH_EXACT_SHA_VERIFIED: ${{ needs.health-check.outputs.exact_sha_verified }}
          HEALTH_VERIFIED_GITHUB_SHA: ${{ needs.health-check.outputs.verified_github_sha }}
          POST_DEPLOY_VERIFY_RESULT: ${{ needs.post-deploy-verify.result }}
          POST_EXACT_SHA_VERIFIED: ${{ needs.post-deploy-verify.outputs.exact_sha_verified }}
          POST_VERIFIED_GITHUB_SHA: ${{ needs.post-deploy-verify.outputs.verified_github_sha }}
          RELEASE_RESULT: ${{ needs.release.result }}
          HEALTH_CONTENT_VERIFIED_NOOP: ${{ needs.health-check.outputs.content_verified_noop }}
          HEALTH_VERIFIED_NOOP_BASE_SHA: ${{ needs.health-check.outputs.verified_noop_base_sha }}
          POST_CONTENT_VERIFIED_NOOP: ${{ needs.post-deploy-verify.outputs.content_verified_noop }}
          POST_VERIFIED_NOOP_BASE_SHA: ${{ needs.post-deploy-verify.outputs.verified_noop_base_sha }}
          HEALTH_BUILD_INTENTIONALLY_SKIPPED: ${{ needs.health-check.outputs.build_intentionally_skipped }}
          HEALTH_VERIFIED_SKIP_BASE_SHA: ${{ needs.health-check.outputs.verified_skip_base_sha }}
          POST_BUILD_INTENTIONALLY_SKIPPED: ${{ needs.post-deploy-verify.outputs.build_intentionally_skipped }}
          POST_VERIFIED_SKIP_BASE_SHA: ${{ needs.post-deploy-verify.outputs.verified_skip_base_sha }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          MIGRATION_PARITY: ${{ needs.migrations.outputs.migration_parity }}
          MIGRATION_TARGET_ENVIRONMENT: ${{ needs.migrations.outputs.migration_target_environment }}
          MIGRATIONS_CHANGED: ${{ needs.migrations.outputs.production_migrations_changed }}
          MIGRATION_VERSIONS: ${{ needs.migrations.outputs.production_migration_versions }}
          DEPLOY_FUNCTIONS_RESULT: ${{ needs.deploy-functions.result }}
        run: |
          FAILED=0

          require_equal() {
            local label="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label expected '$expected' but was '${actual:-<empty>}'"
              FAILED=1
            fi
          }

          require_equal "Health check result" "$HEALTH_CHECK_RESULT" "success"
          require_equal "Health exact-SHA proof" "$HEALTH_EXACT_SHA_VERIFIED" "true"
          require_equal "Health verified SHA" "$HEALTH_VERIFIED_GITHUB_SHA" "$EXPECTED_SHA"
          require_equal "Post-deploy verification result" "$POST_DEPLOY_VERIFY_RESULT" "success"
          require_equal "Post-deploy exact-SHA proof" "$POST_EXACT_SHA_VERIFIED" "true"
          require_equal "Post-deploy verified SHA" "$POST_VERIFIED_GITHUB_SHA" "$EXPECTED_SHA"
          require_equal "Release result" "$RELEASE_RESULT" "success"

          # ── Database-state gate (Wave 1, 2026-08-09) ──
          # Database success is a prerequisite for calling a production release
          # complete. `require_equal` is a STRING comparison, which is precisely
          # why the migration lane is asserted as the literal 'success': GitHub
          # reports a skipped job as 'skipped' and a cancelled one as
          # 'cancelled', and both otherwise read as green to a downstream job.
          # Only 'success' passes here.
          require_equal "Migrations job result" "$MIGRATIONS_RESULT" "success"
          # Proves the migration lane actually verified database state rather
          # than short-circuiting: an unrun, crashed, or skipped parity step
          # leaves this output empty, and empty != 'verified'.
          require_equal "Migration history parity" "$MIGRATION_PARITY" "verified"
          require_equal "Migration target environment" "$MIGRATION_TARGET_ENVIRONMENT" "production"
          require_equal "Edge Functions deploy result" "$DEPLOY_FUNCTIONS_RESULT" "success"

          # Audit trail only — informational, never gates this job. The gate
          # above already requires exact_sha_verified/verified_github_sha to
          # equal $EXPECTED_SHA regardless of how health-check/post-deploy-verify
          # arrived at "true" (literal match or verified no-op); this just
          # records WHICH path was taken so a future incident review doesn't
          # have to dig through job logs to know whether the no-op escape
          # hatch fired.
          if [ "$HEALTH_CONTENT_VERIFIED_NOOP" = "true" ] || [ "$POST_CONTENT_VERIFIED_NOOP" = "true" ]; then
            echo "::notice::This release was verified via the no-op-deploy escape hatch (health-check base=${HEALTH_VERIFIED_NOOP_BASE_SHA:-<n/a>}, post-deploy-verify base=${POST_VERIFIED_NOOP_BASE_SHA:-<n/a>}), not a literal exact-SHA match on production."
          fi

          # Audit trail only — same rationale as the no-op notice above. Records
          # that this release carried no deployable change, so Vercel's
          # ignoreCommand correctly built nothing and production kept serving the
          # named ancestor. Liveness was still proven; only the exact-SHA
          # assertion took the skip path.
          if [ "$HEALTH_BUILD_INTENTIONALLY_SKIPPED" = "true" ] || [ "$POST_BUILD_INTENTIONALLY_SKIPPED" = "true" ]; then
            echo "::notice::This release had NO deployable change (apps/host/scripts/ignore-build.cjs); Vercel intentionally skipped the build and production continues to serve the verified ancestor (health-check base=${HEALTH_VERIFIED_SKIP_BASE_SHA:-<n/a>}, post-deploy-verify base=${POST_VERIFIED_SKIP_BASE_SHA:-<n/a>})."
          fi

          # Audit trail only — the gating assertions above already cover this.
          echo "::notice::Database state for $EXPECTED_SHA — migrations changed: ${MIGRATIONS_CHANGED:-<unknown>}; versions in this release: ${MIGRATION_VERSIONS:-none}; history parity: ${MIGRATION_PARITY:-<unknown>}; target environment: ${MIGRATION_TARGET_ENVIRONMENT:-<unknown>}."

          if [ "$FAILED" -ne 0 ]; then
            echo "Production release completion evidence is incomplete."
            exit 1
          fi

          echo "Production release completion evidence is complete for $EXPECTED_SHA."
