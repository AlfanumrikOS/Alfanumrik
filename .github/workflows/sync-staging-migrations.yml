# Sync migrations from main → staging Supabase project.
#
# Why this exists:
#   deploy-staging.yml does NOT apply migrations to the staging Supabase
#   project — it only deploys the Vercel preview. Production migrations land
#   on prod via deploy-production.yml's migrations job, but staging gets no
#   equivalent. Result: staging schema drifts from prod, integration tests
#   on PRs (which use STAGING_SUPABASE_*) fail with "column doesn't exist"
#   or "constraint missing" errors against changes that are live on prod.
#
# What this does:
#   Runs `supabase db push --linked --include-all` against the STAGING
#   project, applying any pending migrations from `supabase/migrations/`.
#   Idempotent — only applies what's missing in
#   `supabase_migrations.schema_migrations`. Does NOT replace baseline,
#   does NOT drop tables, does NOT delete data. Same pattern as the
#   production migrations job in deploy-production.yml.
#
# When this runs:
#   1. push to main: auto, when migrations directory is touched
#   2. workflow_dispatch: manual, for ops re-runs after env-var rotation
#
# Safety:
#   - Uses STAGING credentials only (separate from production). The staging
#     Supabase project lives in a DIFFERENT Supabase org than prod, so it
#     authenticates with the dedicated `SUPABASE_STAGING_ACCESS_TOKEN`
#     (sourced into the CLI's `SUPABASE_ACCESS_TOKEN` env var), paired with
#     `SUPABASE_STAGING_DB_PASSWORD` + `SUPABASE_STAGING_PROJECT_REF`. The
#     prod `SUPABASE_ACCESS_TOKEN` is never used here (it cannot authorize
#     against the staging org and previously caused `Unauthorized`).
#   - --include-all is safe because all migrations in this repo are
#     idempotent per CLAUDE.md product invariants
#   - Failure does NOT block production deploy (this workflow is staging-only),
#     but it DOES block ci.yml's `Integration Tests (live DB)` job (same
#     `staging-db-push` concurrency group, same STAGING project) — which gates
#     the CI Gate every PR needs to merge to main, so a wedged staging ledger
#     transitively blocks getting anything to production.
#
# 2026-08-20 incident — one-time staging ledger repair (2 hardcoded versions):
#   Every run since before 2026-08-20 aborted pre-flight with "Remote
#   migration versions not found in local migrations directory", naming
#   20260814000023 and 20260814000024. Neither file exists on `main` or in
#   `_legacy/`. Root cause (two independent, unrelated abandoned branches that
#   were each applied to staging out-of-band before being rewritten/dropped):
#     - 20260814000023 (keyless_question_serving_and_server_side_p6) came from
#       commit 145eed3e7 on the unmerged branch
#       Alfanumrik/alfanumrik-e2e-fix-d9bca6 (PR #1524). Commit cbd86866
#       (#1529) already recovered 5 of that commit's 6 renumbered files
#       (20260814000018..000022) into `main` as the record of what was
#       already applied to PRODUCTION — but explicitly stopped at 000022;
#       000023 was never recovered, so no file for it exists anywhere on
#       `main`. It reached STAGING's ledger (this project only) via a preview
#       apply of that branch that predates the recovery/abandonment.
#     - 20260814000024 (reconcile_subjects_allowed_with_plan_reality) came
#       from commit 717265e6 ("...three superseded pins", 2026-08-11), whose
#       branch was squash-merged with different final content — the commit's
#       own title says this migration was superseded/dropped during that PR's
#       iteration. Same mechanism: a preview/staging apply ran before the
#       squash, so the version landed in staging's ledger with no surviving
#       file.
#   Neither version is present in PRODUCTION's ledger (cbd86866's recovery
#   scope was 18..22 only, confirmed by that commit's own "ALREADY APPLIED"
#   claim never mentioning 000023 or 000024) — this repair targets STAGING
#   ONLY and intentionally does not touch prod.
#   Remediation: `supabase migration repair --status reverted` for exactly
#   these two hardcoded versions, run before `db push`, per the CLI's own
#   suggested fix and the identical pattern already used for a 2026-06-28
#   PROD ghost-migration incident (see `schema-reproducibility-fix.yml`'s
#   `repair-prod-drift` job / docs/runbooks/schema-reproducibility-fix.md).
#   This is METADATA-ONLY: it deletes the two ledger rows from
#   `supabase_migrations.schema_migrations` (confirmed via the CLI binary's
#   own embedded SQL: `--status reverted` issues
#   `DELETE FROM supabase_migrations.schema_migrations WHERE version = ANY($1)`)
#   — it does not touch any table, column, or data, and it never re-applies
#   the SQL those two ghost versions once ran (there is no local file to
#   apply). It is intentionally NOT a generic auto-healer: only these two
#   hardcoded 2026-08-20-incident versions are named, so a genuine FUTURE
#   drift (an unrelated orphan version) will still abort the push and be
#   visible, not silently swallowed.
#   DECISION: leave this step in permanently — do not schedule its removal.
#   Idempotent by construction — DELETE on an absent row is a no-op
#   (confirmed above via the CLI binary's own embedded SQL) — so once
#   staging's ledger is clean, every future run of this step costs one
#   no-op DELETE and changes nothing. It is also narrowly scoped: only
#   these two hardcoded 2026-08-20-incident versions are named, so it can
#   never mask a genuine FUTURE orphan-ledger drift — an unrelated future
#   ghost version will still name itself in the CLI's pre-flight error and
#   abort the push exactly as it did here, visibly, not silently. A
#   "delete once confirmed clean" alternative was considered and rejected:
#   it trades a permanently-safe no-op for a manual follow-up with no
#   forcing function to ever get done, for a saving of zero risk (the step
#   already can't hide a different incident's drift). If a *future*
#   incident hits this same symptom with different version numbers, add a
#   new dated step for those versions rather than editing the two hardcoded
#   here — don't widen this into a generic auto-healer.

name: Sync Migrations to Staging

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

# Shared group with deploy-staging.yml's `migrations` job: both run
# `supabase db push` against the SAME staging database, and the two workflows
# previously used unrelated groups, so a main-push sync and a develop/staging
# deploy could push migrations concurrently (racing schema_migrations
# bookkeeping and DDL). One serial lane for all staging DB pushes fixes that.
#
# 2026-08-20: ci.yml's `Integration Tests (live DB)` job now also joins this
# SAME group (previously its own job-local `integration-tests-live-staging-db`
# lane). That job reads/writes the same staging DB this workflow pushes DDL
# to; confirmed overlapping wall-clock execution against commit 0b05519 (run
# 32337055976 here vs 32337056137 in ci.yml) coincided with the
# `select_quiz_questions_rag` verification-gate integration pins failing with
# "expected N rows, got 0". See ci.yml's own concurrency comment on that job
# for the full evidence trail.
concurrency:
  group: staging-db-push
  cancel-in-progress: false   # never cancel a migration push mid-flight

env:
  # Pinned, not `latest`: an unpinned CLI silently changing its pre-flight
  # reconciliation behavior between runs is a reproducibility risk independent
  # of the 2026-08-20 incident below (the previous green run of this workflow
  # was #261 on 2026-08-16; nothing in `supabase/migrations/**` changed in a
  # way that should have newly triggered "Remote migration versions not found"
  # between then and now). Matches the version already pinned in `ci.yml` and
  # `deploy-production.yml`'s `SUPABASE_CLI_VERSION` — bump all three together.
  SUPABASE_CLI_VERSION: '2.109.1'

jobs:
  push-migrations:
    name: Apply pending migrations to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: One-time staging ledger repair (2026-08-20 incident — see file header)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_REF }} --password "$SUPABASE_DB_PASSWORD"
          # Hardcoded, exactly these two versions — not a generic orphan-healer.
          # See the file header for the full incident trace. Idempotent:
          # `--status reverted` DELETEs the ledger row(s); deleting an absent
          # row is a no-op, so this is safe to run on every invocation.
          supabase migration repair --status reverted 20260814000023 20260814000024

      - name: Push migrations to staging Supabase
        env:
          # Staging lives in a different Supabase org than prod, so the CLI's
          # SUPABASE_ACCESS_TOKEN env var must be sourced from the dedicated
          # staging token — the prod token returns Unauthorized here.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_REF }} --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all

      - name: Summary
        if: always()
        run: |
          echo "## Staging Migrations Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
