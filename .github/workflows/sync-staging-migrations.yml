# Sync migrations from main → staging Supabase project.
#
# Why this exists:
#   deploy-staging.yml does NOT apply migrations to the staging Supabase
#   project — it only deploys the Vercel preview. Production migrations land
#   on prod via deploy-production.yml's migrations job, but staging gets no
#   equivalent. Result: staging schema drifts from prod, integration tests
#   on PRs (which use STAGING_SUPABASE_*) fail with "column doesn't exist"
#   or "constraint missing" errors against changes that are live on prod.
#
# What this does:
#   Runs `supabase db push --db-url … --include-all` against the STAGING
#   project, applying any pending migrations from `supabase/migrations/`.
#   Idempotent — only applies what's missing in
#   `supabase_migrations.schema_migrations`. Does NOT replace baseline,
#   does NOT drop tables, does NOT delete data. Same pattern as the
#   production migrations job in deploy-production.yml.
#
# When this runs:
#   1. push to main: auto, when migrations directory is touched
#   2. workflow_dispatch: manual, for ops re-runs after env-var rotation
#
# Safety:
#   - Uses STAGING credentials only (separate from production). The staging
#     Supabase project lives in a DIFFERENT Supabase org than prod, so it
#     authenticates with the dedicated `SUPABASE_STAGING_ACCESS_TOKEN`
#     (sourced into the CLI's `SUPABASE_ACCESS_TOKEN` env var), paired with
#     `SUPABASE_STAGING_DB_PASSWORD` + `SUPABASE_STAGING_PROJECT_REF`. The
#     prod `SUPABASE_ACCESS_TOKEN` is never used here (it cannot authorize
#     against the staging org and previously caused `Unauthorized`).
#   - --include-all is safe because all migrations in this repo are
#     idempotent per CLAUDE.md product invariants
#   - Failure does NOT block production deploy (this workflow is staging-only),
#     but it DOES block ci.yml's `Integration Tests (live DB)` job (same
#     `staging-db-push` concurrency group, same STAGING project) — which gates
#     the CI Gate every PR needs to merge to main, so a wedged staging ledger
#     transitively blocks getting anything to production.
#
# 2026-08-20 incident — one-time staging ledger repair (2 hardcoded versions):
#   Every run since before 2026-08-20 aborted pre-flight with "Remote
#   migration versions not found in local migrations directory", naming
#   20260814000023 and 20260814000024. Neither file exists on `main` or in
#   `_legacy/`. Root cause (two independent, unrelated abandoned branches that
#   were each applied to staging out-of-band before being rewritten/dropped):
#     - 20260814000023 (keyless_question_serving_and_server_side_p6) came from
#       commit 145eed3e7 on the unmerged branch
#       Alfanumrik/alfanumrik-e2e-fix-d9bca6 (PR #1524). Commit cbd86866
#       (#1529) already recovered 5 of that commit's 6 renumbered files
#       (20260814000018..000022) into `main` as the record of what was
#       already applied to PRODUCTION — but explicitly stopped at 000022;
#       000023 was never recovered, so no file for it exists anywhere on
#       `main`. It reached STAGING's ledger (this project only) via a preview
#       apply of that branch that predates the recovery/abandonment.
#     - 20260814000024 (reconcile_subjects_allowed_with_plan_reality) came
#       from commit 717265e6 ("...three superseded pins", 2026-08-11), whose
#       branch was squash-merged with different final content — the commit's
#       own title says this migration was superseded/dropped during that PR's
#       iteration. Same mechanism: a preview/staging apply ran before the
#       squash, so the version landed in staging's ledger with no surviving
#       file.
#   Neither version is present in PRODUCTION's ledger (cbd86866's recovery
#   scope was 18..22 only, confirmed by that commit's own "ALREADY APPLIED"
#   claim never mentioning 000023 or 000024) — this repair targets STAGING
#   ONLY and intentionally does not touch prod.
#   Remediation: `supabase migration repair --status reverted` for exactly
#   these two hardcoded versions, run before `db push`, per the CLI's own
#   suggested fix and the identical pattern already used for a 2026-06-28
#   PROD ghost-migration incident (see `schema-reproducibility-fix.yml`'s
#   `repair-prod-drift` job / docs/runbooks/schema-reproducibility-fix.md).
#   This is METADATA-ONLY: it deletes the two ledger rows from
#   `supabase_migrations.schema_migrations` (confirmed via the CLI binary's
#   own embedded SQL: `--status reverted` issues
#   `DELETE FROM supabase_migrations.schema_migrations WHERE version = ANY($1)`)
#   — it does not touch any table, column, or data, and it never re-applies
#   the SQL those two ghost versions once ran (there is no local file to
#   apply). It is intentionally NOT a generic auto-healer: only these two
#   hardcoded 2026-08-20-incident versions are named, so a genuine FUTURE
#   drift (an unrelated orphan version) will still abort the push and be
#   visible, not silently swallowed.
#   DECISION: leave this step in permanently — do not schedule its removal.
#   Idempotent by construction — DELETE on an absent row is a no-op
#   (confirmed above via the CLI binary's own embedded SQL) — so once
#   staging's ledger is clean, every future run of this step costs one
#   no-op DELETE and changes nothing. It is also narrowly scoped: only
#   these two hardcoded 2026-08-20-incident versions are named, so it can
#   never mask a genuine FUTURE orphan-ledger drift — an unrelated future
#   ghost version will still name itself in the CLI's pre-flight error and
#   abort the push exactly as it did here, visibly, not silently. A
#   "delete once confirmed clean" alternative was considered and rejected:
#   it trades a permanently-safe no-op for a manual follow-up with no
#   forcing function to ever get done, for a saving of zero risk (the step
#   already can't hide a different incident's drift). If a *future*
#   incident hits this same symptom with different version numbers, add a
#   new dated step for those versions rather than editing the two hardcoded
#   here — don't widen this into a generic auto-healer.
#
# 2026-08-21 incident — IPv6-only direct host vs IPv4-only runners
# (this is why both DB steps now use `--db-url` against the Supavisor
# pooler instead of `supabase link` + the direct `db.<ref>.supabase.co` host):
#   Symptom: every run since 2026-08-20 05:49Z failed (last green 2026-08-16)
#   with `failed to connect to postgres: effect/sql/SqlError: PgClient:
#   Failed to connect` — AFTER the CLI had already printed "Finished
#   supabase link.". That split is the whole diagnosis: `link` talks to the
#   IPv4 Management API and succeeds; the subsequent direct Postgres dial is
#   a raw TCP connect and is what fails.
#   Root cause (NOT migrations, NOT a repo change, NOT an outage):
#     - The staging direct host `db.<staging-ref>.supabase.co` resolves
#       IPv6-ONLY (AAAA `2406:da1a:6b0:f619:…`; an A query returns only SOA).
#     - GitHub `ubuntu-latest` runners have NO IPv6. There is no route, so
#       the dial dies at the TCP layer with a message that says nothing
#       about address families.
#     - Staging itself was `ACTIVE_HEALTHY` with 114 days uptime throughout.
#     - An upstream Supabase CLI release changed connection routing between
#       08-16 and 08-20 (previously the CLI reached the DB over a path that
#       tolerated this; it now dials the direct host). Nothing in this repo
#       changed to cause it — which is why bisecting `supabase/migrations/**`
#       would have found nothing.
#   Fix: build a Supavisor pooler URL and pass it as `--db-url`. The pooler
#   hostname has A records (IPv4) and therefore works from the runners.
#   Every component below was empirically probed — do NOT "simplify" one:
#     - HOST `aws-1-ap-south-1.pooler.supabase.com`, *not* `aws-0`. Verified
#       by sending a Postgres StartupMessage with
#       `user=postgres.<staging-ref>`: aws-0 rejects with
#       `XX000 (ENOTFOUND) tenant or user not found`, aws-1 advances to a
#       SASL/SCRAM auth challenge. A records 13.200.110.68 / 3.109.171.244 /
#       3.111.225.200; no AAAA. Supabase can re-shard tenants between
#       aws-N hosts — if this starts failing with ENOTFOUND, re-probe both.
#     - USERNAME `postgres.<PROJECT_REF>` (literal `postgres`, a dot, then
#       the bare ref). Supavisor uses this to route to the tenant; a bare
#       `postgres` does not work through the pooler.
#     - PORT 5432 = SESSION mode, *not* 6543 (transaction mode). `db push`
#       and `migration repair` REQUIRE session mode: the CLI's migration
#       mutex is a session-scoped advisory lock, and `SET` session settings,
#       prepared statements and temp tables do not survive between statements
#       in transaction mode. Both ports accept the tenant, so choosing 6543
#       fails later and far less obviously.
#     - `sslmode=require`, *not* `verify-full`: the pooler's certificate
#       fails default chain validation (`SELF_SIGNED_CERT_IN_CHAIN`).
#       `require` still encrypts; it skips CA-chain verification.
#     - The password MUST be percent-encoded before being embedded in the
#       URI (the CLI's own `--db-url` help says so) — an unencoded
#       `@ : / # ?` silently corrupts the URI and misparses the host.
#     - `--db-url` needs neither `supabase link` nor `SUPABASE_ACCESS_TOKEN`.
#       The `SUPABASE_ACCESS_TOKEN` env entries below are left in place
#       deliberately: harmless, and removing them widens the diff.
#     - `--include-all` is retained. Without it, `db push` applies only
#       migrations newer than the last recorded remote version.
#   The composed URL embeds the DB password, so every step masks it with
#   `::add-mask::` BEFORE the URL is used. Never `echo` it unmasked.
#   Each step also fail-closes with a legible `::error::` (naming the two
#   plausible causes: wrong tenant/shard, or network restrictions on the
#   staging project) while preserving the real exit code — the step still
#   fails, it just no longer fails cryptically.
#   OUT OF SCOPE HERE: `deploy-staging.yml` has the identical bug in its
#   `migrations` job and is NOT fixed by this change. It needs the same
#   treatment separately.
#
# 2026-08-21 — the ledger-repair step above is now a VERIFIED NO-OP.
#   Confirmed live against staging: versions 20260814000023 and
#   20260814000024 are already ABSENT from
#   `supabase_migrations.schema_migrations`, so the repair now deletes
#   nothing on every run. This note changes no behavior: the step is kept
#   as-is here purely to keep this connectivity fix a minimal diff. It
#   should be removed in a separate, dedicated change — which supersedes,
#   on this point only, the "leave this step in permanently — do not
#   schedule its removal" DECISION recorded above (that decision was made
#   before the ledger was confirmed clean).

name: Sync Migrations to Staging

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

# Shared group with deploy-staging.yml's `migrations` job: both run
# `supabase db push` against the SAME staging database, and the two workflows
# previously used unrelated groups, so a main-push sync and a develop/staging
# deploy could push migrations concurrently (racing schema_migrations
# bookkeeping and DDL). One serial lane for all staging DB pushes fixes that.
#
# 2026-08-20: ci.yml's `Integration Tests (live DB)` job now also joins this
# SAME group (previously its own job-local `integration-tests-live-staging-db`
# lane). That job reads/writes the same staging DB this workflow pushes DDL
# to; confirmed overlapping wall-clock execution against commit 0b05519 (run
# 32337055976 here vs 32337056137 in ci.yml) coincided with the
# `select_quiz_questions_rag` verification-gate integration pins failing with
# "expected N rows, got 0". See ci.yml's own concurrency comment on that job
# for the full evidence trail.
concurrency:
  group: staging-db-push
  cancel-in-progress: false   # never cancel a migration push mid-flight

env:
  # Pinned, not `latest`: an unpinned CLI silently changing its pre-flight
  # reconciliation behavior between runs is a reproducibility risk independent
  # of the 2026-08-20 incident below (the previous green run of this workflow
  # was #261 on 2026-08-16; nothing in `supabase/migrations/**` changed in a
  # way that should have newly triggered "Remote migration versions not found"
  # between then and now). Matches the version already pinned in `ci.yml` and
  # `deploy-production.yml`'s `SUPABASE_CLI_VERSION` — bump all three together.
  SUPABASE_CLI_VERSION: '2.109.1'

jobs:
  push-migrations:
    name: Apply pending migrations to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # =================================================================
      # TEMPORARY DIAGNOSTIC - DELETE THIS WHOLE BLOCK BEFORE MERGE.
      # Added 2026-08-21 after run 32458097152 failed in 2.3 s with
      # `failed to connect to postgres: effect/sql/SqlError: PgClient:
      # Failed to connect`. 2.3 s is far too fast for a TCP timeout to an
      # unreachable host (~30 s+), so that is a fast REJECTION, not IPv6
      # unreachability. The untested assumption in the 2026-08-21 header
      # block is that SUPABASE_STAGING_PROJECT_REF holds the same ref that
      # was probed by hand: if it holds a DIFFERENT ref, aws-1 answers
      # XX000 "tenant or user not found" in ~2 s and Effect-TS wraps that
      # into the identical generic `PgClient: Failed to connect`.
      # This step re-runs that probe from the runner, against BOTH shards,
      # using the actual secret. It prints ONLY a per-host verdict plus the
      # ref's LENGTH - never the ref, the password, or any assembled URL
      # (length alone leaks nothing, and a length != 20 is itself the
      # answer). It cannot fail the job: `|| true` on the script plus
      # `continue-on-error: true`, so the real steps below still run and we
      # still see their behaviour on the same run.
      # =================================================================
      - name: TEMP DIAGNOSTIC — pooler tenant-shard probe (remove before merge)
        continue-on-error: true
        env:
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          # Belt-and-braces guard: mask the ref before anything can echo it.
          # (Guarded on non-empty: `::add-mask::` with an empty value is a
          # no-op that only produces an annotation.)
          if [ -n "${STAGING_REF:-}" ]; then echo "::add-mask::$STAGING_REF"; fi
          # No `set -euo pipefail` here (unlike the real steps below). Note the
          # runner still injects `-e` via its default shell (`bash -e {0}`), so
          # the `|| true` below is what actually keeps a probe failure from
          # failing the step - and `continue-on-error: true` keeps a failed step
          # from failing the JOB. Two independent guards, deliberately.
          python3 - <<'PY' || true
          import os, socket, ssl, struct

          REF = os.environ.get("STAGING_REF", "")
          PORT = 5432  # session mode, same port the real steps dial
          HOSTS = [
              "aws-0-ap-south-1.pooler.supabase.com",
              "aws-1-ap-south-1.pooler.supabase.com",
          ]

          def redact(value):
              """Strip the ref out of anything we are about to print."""
              text = str(value)
              if REF:
                  text = text.replace(REF, "<redacted>")
              return text

          def a_records(host):
              try:
                  infos = socket.getaddrinfo(host, PORT, socket.AF_INET, socket.SOCK_STREAM)
                  return sorted({info[4][0] for info in infos})
              except Exception as exc:
                  return ["<A lookup failed: %s: %s>" % (type(exc).__name__, redact(exc))]

          def recv_exact(sock, count):
              buf = b""
              while len(buf) < count:
                  chunk = sock.recv(count - len(buf))
                  if not chunk:
                      break
                  buf += chunk
              return buf

          def parse_error(payload):
              fields = {}
              for part in payload.split(b"\x00"):
                  if part:
                      fields[chr(part[0])] = part[1:].decode("utf-8", "replace")
              return fields

          def probe(host):
              """TLS + Postgres StartupMessage. Returns (verdict, detail)."""
              try:
                  raw = socket.create_connection((host, PORT), timeout=10)
              except Exception as exc:
                  return ("ERROR", "tcp connect failed: %s: %s" % (type(exc).__name__, redact(exc)))
              try:
                  raw.settimeout(10)
                  raw.sendall(b"\x00\x00\x00\x08\x04\xd2\x16\x2f")  # SSLRequest
                  reply = raw.recv(1)
                  if reply != b"S":
                      return ("ERROR", "server declined TLS (SSLRequest reply %r)" % reply)
                  ctx = ssl.create_default_context()
                  ctx.check_hostname = False
                  ctx.verify_mode = ssl.CERT_NONE  # mirrors sslmode=require
                  tls = ctx.wrap_socket(raw, server_hostname=host)
                  user = ("postgres." + REF).encode("utf-8")
                  params = b"user\x00" + user + b"\x00database\x00postgres\x00\x00"
                  body = struct.pack("!i", 196608) + params
                  tls.sendall(struct.pack("!i", len(body) + 4) + body)
                  tag = recv_exact(tls, 1)
                  if not tag:
                      return ("ERROR", "server closed the connection without replying")
                  raw_len = recv_exact(tls, 4)
                  if len(raw_len) < 4:
                      return ("ERROR", "truncated reply header after tag %r" % tag)
                  payload = recv_exact(tls, max(struct.unpack("!i", raw_len)[0] - 4, 0))
                  if tag == b"R":
                      kind = struct.unpack("!i", payload[:4])[0] if len(payload) >= 4 else -1
                      return ("TENANT RESOLVED (auth challenge)",
                              "AuthenticationRequest subtype=%d (10=SASL/SCRAM)" % kind)
                  if tag == b"E":
                      fields = parse_error(payload)
                      code = fields.get("C", "?")
                      # NOTE: Supavisor ECHOES the username back in this message
                      # ("tenant/user postgres.<ref> not found"), so redact() is
                      # load-bearing here, not decorative. Verified on the wire.
                      message = redact(fields.get("M", ""))
                      low = message.lower()
                      # The live wire text is "(ENOTFOUND) tenant/user ... not
                      # found" - NOT the "tenant or user not found" phrasing
                      # quoted in this file's 2026-08-21 header. Match both.
                      if "not found" in low and ("tenant" in low or "enotfound" in low):
                          return ("TENANT NOT FOUND", "%s %s" % (code, message))
                      return ("ERROR", "ErrorResponse %s %s" % (code, message))
                  return ("ERROR", "unexpected first reply byte %r" % tag)
              except Exception as exc:
                  return ("ERROR", "%s: %s" % (type(exc).__name__, redact(exc)))
              finally:
                  try:
                      raw.close()
                  except Exception:
                      pass

          print("STAGING_REF length: %d chars (a Supabase project ref is 20)" % len(REF))
          print("Probing user=postgres.<redacted> database=postgres on port %d" % PORT)
          resolved = []
          for host in HOSTS:
              print("")
              print("--- %s ---" % host)
              print("  A records (IPv4): %s" % (", ".join(a_records(host)) or "<none>"))
              verdict, detail = probe(host)
              print("  verdict: %s" % verdict)
              print("  detail : %s" % detail)
              if verdict.startswith("TENANT RESOLVED"):
                  resolved.append(host)
          print("")
          print("SUMMARY: tenant resolved on %s | STAGING_REF length=%d chars" % (
              ", ".join(resolved) if resolved else "NEITHER shard", len(REF)))
          PY
          echo "TEMP DIAGNOSTIC complete - this step never fails the job."

      - name: One-time staging ledger repair (2026-08-20 incident — see file header)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          # IPv4 Supavisor pooler URL — see the 2026-08-21 header block for why
          # aws-1 / port 5432 / sslmode=require / percent-encoded password are
          # each load-bearing. Ref comes from the secret, never hardcoded.
          ENC_PW=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$ENC_PW"
          DB_URL="postgresql://postgres.${STAGING_REF}:${ENC_PW}@aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require"
          echo "::add-mask::$DB_URL"
          # Hardcoded, exactly these two versions — not a generic orphan-healer.
          # See the file header for the full incident trace. Idempotent:
          # `--status reverted` DELETEs the ledger row(s); deleting an absent
          # row is a no-op, so this is safe to run on every invocation.
          # (As of 2026-08-21 both rows are confirmed already absent — this is
          # now a verified no-op, kept only to keep the connectivity fix minimal.)
          rc=0
          supabase migration repair --db-url "$DB_URL" --status reverted 20260814000023 20260814000024 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Staging ledger repair failed to connect or run::Could not reach staging over the IPv4 Supavisor pooler (aws-1-ap-south-1.pooler.supabase.com:5432). Two likely causes: (a) SUPABASE_STAGING_PROJECT_REF is not the tenant on aws-1 — Supabase may have re-sharded this project; re-probe BOTH aws-0- and aws-1-ap-south-1.pooler.supabase.com with a Postgres StartupMessage using user=postgres.<ref> (the wrong shard answers XX000 ENOTFOUND 'tenant or user not found', the right one advances to a SASL/SCRAM challenge). (b) Network restrictions on the staging Supabase project are blocking the GitHub runner egress IP. Do NOT switch to the direct db.<ref>.supabase.co host — it is IPv6-only and the runners have no IPv6."
            exit "$rc"
          fi

      - name: Push migrations to staging Supabase
        env:
          # Staging lives in a different Supabase org than prod, so the CLI's
          # SUPABASE_ACCESS_TOKEN env var must be sourced from the dedicated
          # staging token — the prod token returns Unauthorized here.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          # Same IPv4 Supavisor pooler URL as the repair step above; `--db-url`
          # replaces `supabase link` + `--linked` entirely (no link, no access
          # token needed). `--include-all` is retained deliberately — without it
          # `db push` only applies migrations after the last recorded remote
          # version. See the 2026-08-21 header block.
          ENC_PW=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$ENC_PW"
          DB_URL="postgresql://postgres.${STAGING_REF}:${ENC_PW}@aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require"
          echo "::add-mask::$DB_URL"
          rc=0
          supabase db push --db-url "$DB_URL" --include-all || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Staging migration push failed::supabase db push failed against the IPv4 Supavisor pooler (aws-1-ap-south-1.pooler.supabase.com:5432). If this is a CONNECTION failure, two likely causes: (a) SUPABASE_STAGING_PROJECT_REF is not the tenant on aws-1 — Supabase may have re-sharded this project; re-probe BOTH aws-0- and aws-1-ap-south-1.pooler.supabase.com with a Postgres StartupMessage using user=postgres.<ref> (the wrong shard answers XX000 ENOTFOUND 'tenant or user not found', the right one advances to a SASL/SCRAM challenge). (b) Network restrictions on the staging Supabase project are blocking the GitHub runner egress IP. Do NOT switch to the direct db.<ref>.supabase.co host — it is IPv6-only and the runners have no IPv6. If instead the SQL itself failed, read the CLI output above: that is a real migration error, not a connectivity problem."
            exit "$rc"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Staging Migrations Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
