            END IF;

            IF (
              SELECT s.school_id
              FROM public.students s
              WHERE s.id =
                '30000000-0000-0000-0000-000000000004'::uuid
            ) IS NOT NULL THEN
              RAISE EXCEPTION 'cross-school attach claimed the student';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM public.class_students cs
              WHERE cs.student_id =
                '30000000-0000-0000-0000-000000000004'::uuid
            ) THEN
              RAISE EXCEPTION
                'cross-school attach created a class membership';
            END IF;
          END;
          $negative_mutations$;

          -- Active membership without RBAC permission must still be denied.
          SELECT set_config(
            'request.jwt.claim.sub',
            '20000000-0000-0000-0000-000000000002',
            true
          );
          SELECT set_config(
            'request.jwt.claims',
            '{"sub":"20000000-0000-0000-0000-000000000002","role":"authenticated"}',
            true
          );
          SET LOCAL ROLE authenticated;

          DO $permission_denied$
          DECLARE
            v_result jsonb;
          BEGIN
            v_result := public.school_admin_list_students(
              '10000000-0000-0000-0000-000000000001',
              1,
              20,
              NULL,
              NULL
            );

            IF v_result->>'status' IS DISTINCT FROM '403'
              OR v_result->>'error'
                   IS DISTINCT FROM 'Missing permission for the selected school'
            THEN
              RAISE EXCEPTION
                'membership without permission did not fail closed: %',
                v_result;
            END IF;
          END;
          $permission_denied$;

          RESET ROLE;
          ROLLBACK;
          SQL

          echo "Selected-school RPC catalog and behavioral assertions passed." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Stop isolated local Supabase
        if: ${{ always() && steps.selected_rpc_changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          workdir="$RUNNER_TEMP/selected-school-rpc"
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --workdir "$workdir" --no-backup || \
              echo "::warning::Local Supabase cleanup reported an error; runner teardown will remove remaining containers."
          fi
          rm -rf -- "$workdir"

  # ── Step 0c: Protected feature-flag migration guard ──
  # Phase 0 flag-governance hardening (master action plan item 0.7). Runs
  # UNCONDITIONALLY on every push/PR (job-level `if:` is deliberately absent —
  # see migration-lint.yml's header comment for why a job that might become a
  # REQUIRED status check must never be job-level paths-filtered: a SKIPPED
  # required job blocks merge forever, whereas a job that always runs but
  # step-level-skips its work when nothing relevant changed reports SUCCESS).
  # scripts/check-protected-flag-migrations.mjs scans changed
  # supabase/migrations/*.sql for an is_enabled=true / rollout_percentage>0
  # assignment mentioning a name from packages/lib/src/flags/protected-flags.ts
  # and fails unless the same file carries a
  # `-- CEO-APPROVED-FLAG-FLIP: <flag_name>` marker comment.
  #
  # RUNS ON PRs TOO (restored 2026-08-11 — 409123b5 had made it main-only).
  # A protected-flag flip must be caught BEFORE it merges; catching it on
  # main means the flag is already flipped in a merged commit. Cheap on PRs:
  # the `Detect changed migration files` step below is a step-level diff
  # filter and every subsequent step is gated on
  # `steps.changes.outputs.changed == 'true'`.
  protected-flag-migration-guard:
    name: Protected Flag Migration Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed migration files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual dispatch has no "before" commit. Without one this fell
            # through to the fail-closed branch below, which re-scans EVERY
            # migration in the repo -- including pre-policy ones that predate
            # the CEO-APPROVED-FLAG-FLIP marker -- so NO dispatch run could
            # ever pass this guard. Compare against the merge-base with the
            # default branch instead: that is exactly "what this ref adds",
            # which is what the guard is for. If it cannot be resolved we
            # STILL fall through to fail-closed below; the safety property is
            # unchanged.
            git fetch --no-tags --quiet origin "$DEFAULT_BRANCH" 2>/dev/null || true
            base_sha="$(git merge-base FETCH_HEAD "$HEAD_SHA" 2>/dev/null || true)"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          git cat-file -e "${HEAD_SHA}^{commit}"

          # Comparison base unavailable (initial/force push, etc.) — scan
          # every migration fail-closed rather than silently skip.
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || \
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "::warning::Comparison base unavailable; scanning ALL migrations fail-closed."
            files="$(find supabase/migrations -maxdepth 1 -name '*.sql' | sort)"
          else
            files="$(git diff --name-only --diff-filter=ACMR "$base_sha" "$HEAD_SHA" -- 'supabase/migrations/*.sql' | grep -v '/_legacy/' || true)"
          fi

          if [[ -z "$files" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$files" > "$RUNNER_TEMP/changed-migrations.txt"

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Run protected-flag migration guard
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/changed-migrations.txt"
          node scripts/check-protected-flag-migrations.mjs "${files[@]}"

      - name: No relevant migration changes
        if: steps.changes.outputs.changed != 'true'
        run: echo "No supabase/migrations/*.sql changes in this diff; guard is a no-op."

  # ── Step 0d: Foxy North-Star alignment analyzer (read-only) ──
  # Phase T0 governance gate for the CEO-approved Foxy North-Star plan
  # (2026-08-05; plan §3.2). scripts/foxy-alignment/analyze.mjs runs 10
  # conformance checks against docs/trackers/foxy-north-star/tracker.json and
  # the REAL tree: coverage, artifacts, tests, review chains, flag posture
  # (warn), no-duplicate code/schema, invariant guards (E6/U11/PR3/T1),
  # writerless watch, staleness (warn). Read-only; zero npm dependencies
  # (node:fs/node:path only), so no `npm ci` is needed — the job runs in
  # seconds at t=0 in parallel with the other fast jobs.
  #
  # RUNS ON PRs TOO (restored 2026-08-11). This is the job that proved the
  # cost of the asymmetry: PR #1514 was 100% green, merged, and turned main
  # red on the very next push because this analyzer had never run against
  # it (#1517 was the repair). It costs a checkout + `node` with zero npm
  # dependencies — single-digit seconds — so there was never a runner-cost
  # case for skipping it on PRs.
  foxy-alignment:
    name: Foxy North-Star Alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Run alignment analyzer
        run: npm run foxy:analyze

  # ── Step 0e: MOL generated-matrix drift check ──
  # R3 consolidation (Foxy North-Star Phase 4, 2026-08-05). The Deno-side
  # BASE_MATRIX (supabase/functions/_shared/mol/generated-matrix.ts) is
  # generated from packages/lib/src/ai/gateway/registry.ts via
  # scripts/gen-mol-matrix.mjs. This gate re-runs the generator with
  # --check and fails if the on-disk copy differs — same pattern as
  # foxy:analyze (zero npm deps, node-only, no `npm ci` needed).
  #
  # RUNS ON PRs TOO (restored 2026-08-11 — 409123b5 had made it main-only).
  # Generated-file drift is introduced BY a PR; detecting it only after the
  # merge means main is already carrying the drift. Zero npm deps, node-only,
  # single-digit seconds.
  gen-mol-matrix:
    name: MOL Matrix Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Run gen-mol-matrix --check
        run: npm run gen:mol-matrix:check

  # ── Step 1: Type Check + Lint ──
  # Runs independently of secret-scan so an infra failure in gitleaks
  # (e.g. the v2 action's 403 on individual-account PR commits) can't
  # silently disable test verification. Previously: `needs: secret-scan`
  # caused this job to SKIP on every PR where gitleaks failed, which
  # masked two broken test files (#788 B.2, #798 D.1) until they only
  # surfaced on main when CI finally had time to complete.
  #
  # 2026-07-20 CI speed-up: the full unit-test run moved out of this job into
  # the sharded `unit-tests` matrix below; the `unit-tests-merge` fan-in job
  # carries the old "Lint, Type-check & Test" required-status-check name.
  # Beyond lint + type-check, this job also still contains the BLOCKING
  # Auth & Identity test gate and the (advisory) Supabase type-sync check.
  quality:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # apps/host/vercel.json is the single deploy config (Vercel project root dir = apps/host); a root copy is dead config that silently drifts.
      - name: Root vercel.json drift guard
        run: |
          if [ -f vercel.json ]; then echo "::error::root vercel.json must not exist (apps/host/vercel.json is authoritative)"; exit 1; fi

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      # ADR-006 #4: both Anthropic call paths (Node claude.ts, Deno
      # reliability.ts) must keep exponential-backoff retry on 429/5xx/529.
      # Guards against incident class #4 (500/529 cascades).
      - name: AI retry parity gate
        run: node scripts/check-ai-retry-parity.mjs

      # ── SECURITY GATE (BLOCKING) ────────────────────────────────────────────
      # CI-gate forensic audit, 2026-07-28 — category (ii) repair.
      # WAS: `npm audit --audit-level=critical || echo "::warning::..."`.
      # The `|| echo` neutralised the ONLY exit code that signals a critical
      # vulnerability, so the step's own comment ("critical vulns fail CI") was
      # false: every severity, including critical, degraded to a warning and the
      # step exited 0. Now the audit JSON is PARSED and the critical/high counts
      # decide the exit code explicitly.
      #
      # ANTI-VACUITY: `npm audit` exits non-zero whenever vulnerabilities exist,
      # so its exit code cannot be used to detect "the audit did not run". We
      # therefore assert on the PAYLOAD: both reports must contain a
      # metadata.vulnerabilities object AND a non-zero dependency total. A
      # network failure / empty report now fails the step instead of reading as
      # "no vulnerabilities".
      #
      # SCOPE — stated explicitly so this is not a silent narrowing:
      #   BLOCKING  : critical vulnerabilities in the PRODUCTION tree
      #               (`npm audit --omit=dev`) — this is what ships to students.
      #   LOUD WARN : critical vulnerabilities that exist ONLY in the dev tree
      #               (build tooling). Named in the log and the job summary so
      #               they cannot rot invisibly.
      # As measured 2026-07-28: prod-critical = 0, dev-only-critical = 3
      # (@openapitools/openapi-generator-cli -> concurrently -> shell-quote).
      # Under the OLD `|| echo` step, neither number could ever fail CI.
      # MERGE-QUEUE TIER: npm audit reaches the registry and is the slowest
      # non-tsc step in this job. Still BLOCKING -- it runs on merge_group,
      # push and workflow_dispatch, i.e. before anything can land on main.
      - name: Security audit (production criticals are blocking)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          # `set +e`: Actions runs this under `bash -e`, and `npm audit` exits
          # non-zero simply because vulnerabilities EXIST. We grade the payload,
          # so every exit path below is explicit.
          set +e
          set -u
          ALL_JSON="$(mktemp)"
          PROD_JSON="$(mktemp)"
          # npm audit exits 1 when it FINDS vulnerabilities — that is not an
          # error here, we grade the payload ourselves. A genuine run failure is
          # caught by the payload assertions below, not by these exit codes.
          npm audit --json > "$ALL_JSON" 2>/dev/null
          npm audit --omit=dev --json > "$PROD_JSON" 2>/dev/null

          grade() {
            node -e '
              const fs = require("fs");
              let r;
              try { r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
              catch { process.stdout.write("PARSE_FAIL"); process.exit(0); }
              const v = r && r.metadata && r.metadata.vulnerabilities;
              const d = r && r.metadata && r.metadata.dependencies;
              if (!v || typeof v !== "object") { process.stdout.write("NO_VULN_BLOCK"); process.exit(0); }
              const total = d && (typeof d === "number" ? d : d.total);
              process.stdout.write(["OK", v.critical|0, v.high|0, v.moderate|0, v.low|0, total|0].join(" "));
            ' "$1"
          }

          ALL=$(grade "$ALL_JSON")
          PROD=$(grade "$PROD_JSON")

          echo "## Security Audit" >> $GITHUB_STEP_SUMMARY
          if [ "${ALL%% *}" != "OK" ] || [ "${PROD%% *}" != "OK" ]; then
            echo "::error::npm audit produced no usable report (full=$ALL prod=$PROD). The vulnerability gate could not measure anything — failing CLOSED rather than reporting a vacuous pass."
            echo "| Status | FAILED — audit report unusable |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          set -- $ALL;  A_CRIT=$2; A_HIGH=$3; A_MOD=$4; A_LOW=$5; A_DEPS=$6
          set -- $PROD; P_CRIT=$2; P_HIGH=$3; P_MOD=$4; P_LOW=$5; P_DEPS=$6

          echo "| Scope | Deps | Critical | High | Moderate | Low |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|----------|------|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| production (BLOCKING) | $P_DEPS | $P_CRIT | $P_HIGH | $P_MOD | $P_LOW |" >> $GITHUB_STEP_SUMMARY
          echo "| full incl. dev (advisory) | $A_DEPS | $A_CRIT | $A_HIGH | $A_MOD | $A_LOW |" >> $GITHUB_STEP_SUMMARY
          echo "prod : deps=$P_DEPS critical=$P_CRIT high=$P_HIGH moderate=$P_MOD low=$P_LOW"
          echo "full : deps=$A_DEPS critical=$A_CRIT high=$A_HIGH moderate=$A_MOD low=$A_LOW"

          # Vacuity floor: a real install tree has hundreds of dependencies.
          if [ "$A_DEPS" -lt 50 ] || [ "$P_DEPS" -lt 50 ]; then
            echo "::error::npm audit reported only $A_DEPS/$P_DEPS dependencies. The audit did not see the real dependency tree — failing CLOSED."
            echo "| Status | FAILED — audit saw no dependency tree |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "$P_CRIT" -gt 0 ]; then
            echo "::error::$P_CRIT CRITICAL vulnerability(ies) in the PRODUCTION dependency tree. BLOCKING."
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              for (const [name, v] of Object.entries(r.vulnerabilities || {})) {
                if (v.severity === "critical") console.log("  CRITICAL(prod):", name);
              }
            ' "$PROD_JSON"
            echo "| Status | FAILED ($P_CRIT production critical) |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          DEV_ONLY_CRIT=$((A_CRIT - P_CRIT))
          if [ "$DEV_ONLY_CRIT" -gt 0 ]; then
            echo "::warning::$DEV_ONLY_CRIT critical vulnerability(ies) in DEV-ONLY dependencies (build tooling, not shipped). Advisory — see names below."
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              for (const [name, v] of Object.entries(r.vulnerabilities || {})) {
                if (v.severity === "critical") console.log("  CRITICAL(dev):", name);
              }
            ' "$ALL_JSON"
            echo "| Dev-only criticals | $DEV_ONLY_CRIT (advisory, named in log) |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$P_HIGH" -gt 0 ]; then
            echo "::warning::$P_HIGH high-severity vulnerability(ies) in production deps (advisory — only critical blocks today)."
          fi
          echo "| Status | PASSED |" >> $GITHUB_STEP_SUMMARY

      # ── LICENSE GATE (BLOCKING) ─────────────────────────────────────────────
      # CI-gate forensic audit, 2026-07-28 — category (ii) repair.
      # WAS: `npx license-checker --production --onlyAllow '<allowlist>' 2>/dev/null || {
      #         echo "license-checker not available, falling back to npm ls"
      #         ...
      #         npm ls --all --depth=0 || true    <-- swallows the violation
      #       }`
      # THREE independent defects, any one of which made the gate unable to fail:
      #   1. license-checker exits non-zero for BOTH "could not run" AND "found a
      #      disallowed license". Both landed in the same fallback, and that
      #      fallback ended in `|| true` — so the step exited 0 either way.
      #   2. `2>/dev/null` discarded the message naming the offending package.
      #   3. `--production` finds ZERO packages from this monorepo's workspace
      #      root (root package.json is private, `workspaces`-only, no
      #      `dependencies`). Verified: it prints "Error: No packages found in
      #      this path." and exits 0. Even without the `|| true` the gate was
      #      inspecting an empty set.
      #
      # Now delegated to scripts/check-licenses.mjs, which enumerates the REAL
      # production tree via `npm ls --omit=dev --all --json` (workspace-aware:
      # 477 installed packages vs 0 for the old command), and which carries its
      # own anti-vacuity floors: a minimum package count, an unreadable-license
      # ceiling, and a 10-fixture known-bad/known-good self-test of the
      # allow/deny comparator (AGPL/GPL/LGPL/UNLICENSED must be rejected, MIT and
      # `(MIT OR CC0-1.0)` must be accepted). Exit 1 = violation, 2 = could not
      # verify. Both block; "could not verify" is never reported as clean.
      - name: Dependency license check
        run: |
          set +e
          set -u
          LOG="$(mktemp)"
          node scripts/check-licenses.mjs > "$LOG" 2>&1
          STATUS=$?
          cat "$LOG"
          echo "## Dependency License Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -80 "$LOG" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" -eq 2 ]; then
            echo "::error::License gate could not verify the dependency tree (see output). Failing CLOSED — previously this path exited 0."
            echo "| Status | FAILED — could not verify |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Disallowed dependency license detected (named in the output above)."
            echo "| Status | FAILED — disallowed license |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "| Status | PASSED |" >> $GITHUB_STEP_SUMMARY

      - name: Lint
        run: npm run lint

      # Supabase type-sync check. ADVISORY (continue-on-error: true):
      # this gate compares generated types against the LIVE project, which
      # cannot contain un-applied migrations. Making it blocking breaks every
      # migration PR non-deterministically (2026-08-07 revert; see #1472).
      # - name: Verify Supabase types are up to date
      #   if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
      #   continue-on-error: true
      #   env:
      #     SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      #   run: |
      #     if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
      #       echo "::warning::SUPABASE_PROJECT_ID or SUPABASE_ACCESS_TOKEN not set. Skipping type sync check."
      #       echo "Add these repo secrets to enable schema-drift detection on PRs."
      #       exit 0
      #     fi
      #     if ! command -v supabase >/dev/null 2>&1; then
      #       curl -sL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
      #         | tar -xz -C /tmp \
      #         && sudo mv /tmp/supabase /usr/local/bin/supabase
      #     fi
      #     npm run supabase:check-types || {
      #       echo "::error::Supabase types are out of sync with migrations."
      #       echo "Run \`npm run supabase:gen-types\` locally and commit the result."
      #       exit 1
      #     }

      - name: Type check
        run: npm run type-check
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # R15 fix: Explicit auth/identity test gate.
      # Auth tests MUST pass independently — a failure here blocks the entire CI.
      # This ensures unrelated test changes don't mask auth regressions.
      #
      # FIXED 2026-07-20: this gate had been a SILENT NO-OP. Two independent
      # breaks: (1) the monorepo migration removed the root src/ directory, so
      # `npx vitest run src/__tests__/auth-*.test.ts …` from the repo root had
      # nothing to glob — the unexpanded pattern matched zero test files; and
      # (2) `AUTH_EXIT=$?` captured `tee`'s exit code (always 0), not vitest's,
      # so even vitest's "no test files found" failure was swallowed. Now runs
      # through the apps/host workspace (positional args are vitest filename
      # substring filters matching the auth-*.test.ts* and identity-*.test.ts
      # files under apps/host/src/__tests__/), captures vitest's real exit code
      # via PIPESTATUS[0], and additionally fails if zero tests passed —
      # belt-and-braces against any future silent no-op.
      # MERGE-QUEUE TIER: this is a vitest run, not a lint/type step. On PRs
      # the `unit-tests-changed` job covers auth/identity files when they are
      # touched; the full suite (which includes these specs) runs on
      # merge_group before the commit can land.
      - name: Auth & Identity test gate
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "## Auth & Identity Test Gate" >> $GITHUB_STEP_SUMMARY
          npm test -w apps/host -- src/__tests__/auth- src/__tests__/identity- --reporter=verbose 2>&1 | tee /tmp/auth-test-output.txt
          AUTH_EXIT=${PIPESTATUS[0]}
          PASS_COUNT=$(grep -c '✓' /tmp/auth-test-output.txt || true)
          PASS_COUNT=${PASS_COUNT:-0}
          echo "| Auth tests passed | $PASS_COUNT |" >> $GITHUB_STEP_SUMMARY
          if [ "$AUTH_EXIT" != "0" ]; then
            echo "BLOCKED: Auth/identity tests failed. This is a blocking gate."
            echo "| Status | FAILED |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [ "$PASS_COUNT" -eq 0 ]; then
            echo "BLOCKED: Auth/identity gate ran zero passing tests — silent no-op detected."
            echo "| Status | FAILED (0 tests passed) |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "| Status | PASSED |" >> $GITHUB_STEP_SUMMARY

      # Type-check gate for repo-root `scripts/**` (52 files).
      #
      # Why this is a SEPARATE step from `npm run type-check`: that command is
      # `--workspaces`, and `scripts/` belongs to no workspace.
      # `apps/host/tsconfig.json` explicitly EXCLUDES `scripts`, there is no
      # root tsconfig.json, and `npm run lint` only covers apps/host/src — so
      # until this step existed, nothing in CI type-checked `scripts/` at all.
      #
      # That hole let seven scripts rot: they imported `../src/lib/…`, a
      # pre-monorepo path deleted in the apps/* + packages/* migration. Every
      # one of them died at runtime with MODULE_NOT_FOUND and CI stayed green.
      # One of the seven hid its dead imports inside `await import(...)`, so a
      # grep for static import lines missed it — only a real compile found it.
      #
      # DELIBERATE ORDERING — DO NOT MOVE THIS BACK NEXT TO `Type check`.
      # Steps are serial and fail-stop, so placing this dev-tooling gate before
      # the P15-protecting `Auth & Identity test gate` would let a trivial type
      # error in a maintenance script abort the job before the auth gate emits
      # any signal; it runs last so the onboarding gate always reports first.
      #
      # This step is intentionally BLOCKING with no continue-on-error. A green
      # run means `scripts/` actually compiles.
      - name: Type check (scripts/)
        run: npm run type-check:scripts

      # npm-script path canary — the RUNTIME complement to the compile-time gate
      # immediately above. `type-check:scripts` proves script SOURCES compile;
      # it says nothing about whether the package.json declarations that invoke
      # them point at a file that exists.
      #
      # npm runs a script with cwd = the directory of the package.json declaring
      # it, so `node scripts/foo.js` in apps/host/package.json resolves to
      # apps/host/scripts/foo.js. 22 declarations had rotted this way — each
      # missing a `../../` prefix, each dying with MODULE_NOT_FOUND the moment
      # anyone ran it, none visible to any compiler because package.json is
      # just JSON.
      #
      # DELIBERATE ORDERING — this must stay AFTER `Type check (scripts/)`, and
      # both must stay after the P15-protecting `Auth & Identity test gate`.
      # Steps are serial and fail-stop; dev-tooling gates run last so a trivial
      # maintenance-script failure can never abort the job before the onboarding
      # gate has emitted its signal. See the ordering note above.
      #
      # This step is intentionally BLOCKING with no continue-on-error.
      - name: Check npm script paths
        run: npm run check:script-paths

      # P13 (Data Privacy) guard — static scan of every Supabase Edge Function
      # `index.ts` for PII reaching console.* (email/phone/name/prompt/answer/
      # OCR text) or for whole request payloads being JSON.stringify'd into logs.
      # Escape hatch for reviewed lines: the `PII_LOG_ALLOW` marker comment.
      #
      # WHY THIS IS ONLY NOW WIRED INTO CI. The script existed but was invoked by
      # no workflow, so it was manual-invocation-only. It was also unsafe to wire:
      # its glob resolved against cwd, and `npm run check:edge-logs -w apps/host`
      # runs with cwd = apps/host, where `supabase/functions/*/index.ts` matches
      # NOTHING — the guard reported a green "0 files scanned" pass. Wiring a gate
      # that silently scans nothing is worse than not wiring it: it manufactures
      # false assurance on a privacy invariant.
      #
      # Both halves of that are now fixed. The script anchors its glob to the repo
      # root via import.meta.url, and — the part that makes wiring SAFE — it has a
      # fail-loud zero-match floor: matching 0 files exits 1 with a diagnostic,
      # because a PII guard that inspected nothing has not passed, it has failed to
      # run. So any future repo-layout change or path refactor that breaks this
      # gate FAILS CI loudly instead of sailing through green.
      #
      # Invoked directly from the repo root (NOT `-w apps/host`) so the cwd is
      # unambiguous; the script is cwd-independent either way.
      #
      # This step is intentionally BLOCKING with no continue-on-error.
      - name: Edge Function log PII guard (P13)
        run: node scripts/security/check-edge-logs.mjs

      # P2-2 (API response-envelope consolidation) — withRoute() adoption
      # ratchet. scripts/check-route-wrapper-ratchet.mjs re-derives from
      # source how many apps/host/src/app/api/**/route.ts files import
      # withRoute() (packages/lib/src/api/v2/with-route.ts) and fails if that
      # count drops below the recorded floor in
      # scripts/route-wrapper-adoption.json — guards against a route
      # silently reverting off the wrapper in an unrelated refactor. Pure
      # node:fs/path/url script, no build or install required. The script
      # existed but no workflow invoked it, so the ratchet was not
      # mechanically enforced; this wires it in alongside the other static
      # check:* gates in this job.
      #
      # This step is intentionally BLOCKING with no continue-on-error.
      - name: withRoute() adoption ratchet (P2-2)
        run: npm run check:route-wrapper-ratchet

  # ── Step 1c: Unit tests (sharded 4×, 2026-07-20 CI speed-up) ──
  # The full-suite `npm test -- --coverage` run (previously a single ~long step
  # inside the quality job) is split across 4 parallel shards. Vitest shards by
  # TEST FILE (--shard=N/4), each shard emits a blob report (test results +
  # raw V8 coverage) into .vitest-reports/, and the `unit-tests-merge` job
  # below merges all blobs and enforces the coverage thresholds from
  # vitest.config.ts against the COMBINED coverage — same tests, same
  # thresholds, same blocking posture as before.
  #
  # Migration & script integration tests (~19 tests under
  # src/__tests__/migrations/** and src/__tests__/scripts/**) are excluded
  # from this default run by vitest.config.ts — they require a live Supabase
  # backend and run in the separate `integration-tests` job below, gated on
  # real env secrets. These shards are therefore a HARD GATE: any failure
  # blocks CI (enforced via the unit-tests-merge fan-in).
  unit-tests:
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # TIER: merge_group / push / workflow_dispatch only. Relocated off the
    # `pull_request` event 2026-08-19 -- see the merge_group note in `on:`.
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      # Vitest 4.1.8 enforces coverage thresholds on EVERY run that reports
      # coverage — including partial shard runs, where the global and per-file
      # floors would fail spuriously (verified against the installed package:
      # BaseCoverageProvider.generateReports → reportThresholds runs
      # unconditionally, with no shard/blob special-casing). So each shard runs
      # with a CI-generated wrapper config that is identical to the root
      # vitest.config.ts except coverage.thresholds is stripped. The
      # unit-tests-merge job runs --merge-reports with the REAL root config,
      # enforcing the identical thresholds exactly once against the combined
      # coverage of all 4 shards. The wrapper exists only on the runner.
      - name: Generate threshold-free shard config
        run: |
          cat > vitest.ci-shard.config.mts <<'EOF'
          // Generated by CI (.github/workflows/ci.yml) — DO NOT COMMIT.
          // Identical to the root vitest.config.ts except coverage thresholds
          // are stripped: per-shard coverage is partial by definition, so
          // floors are only meaningful on MERGED coverage (enforced by the
          // unit-tests-merge job via --merge-reports + the real root config).
          import config from './vitest.config';

          const shardConfig = config as Record<string, any>;
          delete shardConfig.test.coverage.thresholds;
          export default shardConfig;
          EOF

      # Runs through the apps/host workspace (the only workspace with a test
      # script; packages/lib, packages/ui and eslint-plugin-alfanumrik define
      # none). cwd is apps/host, so the blob lands in apps/host/.vitest-reports/
      # (verified empirically with vitest 4.1.8). --coverage puts the raw V8
      # coverage into the blob for the merge job.
      # `--reporter` is repeatable in vitest 4; BOTH reporters run.
      #
      # WHY THE SECOND REPORTER EXISTS (2026-08-11): with `--reporter=blob`
      # ALONE, a failing shard's entire log was the single line
      #   blob report written to .../apps/host/.vitest-reports/blob.json
      # The blob is a binary-ish artifact for the merge job, not human output,
      # so a red shard said WHICH shard failed and nothing else — one failing
      # assertion cost a full local re-run of 5,465 tests to locate. Adding
      # `--reporter=default` prints the failing file, test name, diff and
      # stack directly in the shard log.
      #
      # The blob is STILL produced (verified empirically on vitest 4.1.10:
      # with both flags, `.vitest-reports/blob.json` is written exactly as
      # before AND the default reporter's failure output is printed), so the
      # `unit-tests-merge` fan-in below keeps working via --merge-reports.
      # Do not replace blob with default — remove blob and the merge job,
      # and with it the merged-coverage threshold gate, silently loses its
      # input.
      - name: Run test shard with blob report + coverage
        run: npm test -w apps/host -- --config ../../vitest.ci-shard.config.mts --reporter=blob --reporter=default --coverage --shard=${{ matrix.shard }}/4

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-shard-${{ matrix.shard }}
          path: apps/host/.vitest-reports/
          # The blob dir is dot-prefixed; upload-artifact excludes hidden
          # files by default and would upload nothing without this.
          include-hidden-files: true
          # v4+ artifacts are immutable by name; without this, "Re-run failed
          # jobs" would fail the re-upload with a name-conflict error.
          overwrite: true
          retention-days: 1

  # Fan-in for the 4 unit-test shards + the lint/type-check job. This job
  # deliberately carries the display name of the pre-shard job so the branch
  # ruleset's required status-check context "Lint, Type-check & Test" keeps
  # green-gating merges with identical semantics (lint + type-check + all unit
  # tests + coverage thresholds).
  # ─────────────────────────────────────────────────────────────────────────
  # PR TIER: tests related to the diff, not the whole suite.
  #
  # WHY THIS EXISTS: the 4-shard suite is ~5 min of runner time and the merge
  # step that enforces coverage thresholds adds ~70s more. That is the right
  # amount of work to do ONCE, on the commit that is about to land -- it is the
  # wrong amount of work to do on every `git push` to a feature branch.
  #
  # WHAT IT IS NOT: this is NOT a replacement for the full suite and MUST NOT
  # be treated as one. Vitest's `--changed` walks the module graph from the
  # changed files, so a test reached only through a dynamic import, a string
  # route lookup, or a fixture file it does not import is NOT selected. That
  # residual gap is closed by the merge-queue tier, which runs all 4 shards and
  # the coverage thresholds before the commit can land on main. Coverage
  # thresholds are deliberately NOT enforced here -- a partial run cannot
  # satisfy a whole-repo threshold, and pretending otherwise is how a gate
  # becomes a rubber stamp.
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests-changed:
    name: Unit Tests (changed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: `--changed <sha>` needs the merge base to exist
          # locally, and the default shallow fetch does not contain it.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve merge base with the PR base branch
        id: base
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$BASE_REF"
          merge_base="$(git merge-base FETCH_HEAD HEAD)"
          # FAIL CLOSED: if the merge base cannot be resolved we do NOT quietly
          # fall back to "no tests changed" -- an empty selection that reports
          # green is exactly the vacuous-pass failure mode the auth gate and the
          # bundle-size gate both guard against elsewhere in this file.
          if [[ -z "$merge_base" ]]; then
            echo "::error::Could not resolve merge base against origin/$BASE_REF."
            exit 1
          fi
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"
          echo "Merge base: $merge_base" >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests related to the changed files
        shell: bash
        env:
          MERGE_BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # --passWithNoTests is correct HERE and only here: a docs-only or
          # workflow-only PR legitimately selects zero tests. It is NOT set on
          # the merge-queue shards, where zero collected tests is a bug.
          npm test -w apps/host -- \
            --changed "$MERGE_BASE" \
            --passWithNoTests \
            --reporter=default

      - name: Note the tier boundary in the run summary
        if: always()
        run: |
          {
            echo "### Unit Tests (changed) — PR tier"
            echo ""
            echo "Selected by \`vitest --changed <merge-base>\`. This is a FAST"
            echo "SUBSET, not the full suite. All 4 shards plus the coverage"
            echo "thresholds run in the merge queue before this commit can land."
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests-merge:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `if: always()` so this job is never SKIPPED when a shard or quality
    # fails — a skipped job would otherwise satisfy the required status check.
    # The first step re-asserts success explicitly instead (same node-script
    # pattern as ci-gate).
    # `always()` is preserved so a failed/cancelled upstream still turns this
    # required context RED rather than skipping it. The added event clause is
    # what moves the job to the merge-queue tier.
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [quality, unit-tests]
    steps:
      - name: Enforce upstream lint/type-check and shard success
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON || '{}');
          const failures = ['quality', 'unit-tests'].filter((job) => needs[job]?.result !== 'success');
          if (failures.length) {
            console.error('Unit-test fan-in failed: ' + failures.map((job) => job + '=' + (needs[job]?.result || 'missing')).join(', '));
            process.exit(1);
          }
          console.log('Lint/type-check and all 4 unit-test shards succeeded.');
          NODE

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Download shard blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-shard-*
          path: apps/host/.vitest-reports
          merge-multiple: true

      # Merges the 4 blob reports and regenerates coverage from the combined
      # raw V8 data. Coverage thresholds from vitest.config.ts are enforced
      # HERE, against merged coverage — a drop below any global or per-file
      # floor fails this job (and therefore the required status check).
      # json-summary is added so the Coverage report step below can render the
      # totals into the step summary.
      - name: Merge shard reports and enforce coverage thresholds
        run: npm test -w apps/host -- --merge-reports --coverage --coverage.reporter=text --coverage.reporter=json --coverage.reporter=json-summary

      - name: Coverage report
        if: always()
        run: |
          if [ -f apps/host/coverage/coverage-summary.json ]; then
            echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Extract summary percentages
            node -e "
              const c = require('./apps/host/coverage/coverage-summary.json');
              const t = c.total;
              console.log('Statements: ' + t.statements.pct + '%');
              console.log('Branches:   ' + t.branches.pct + '%');
              console.log('Functions:  ' + t.functions.pct + '%');
              console.log('Lines:      ' + t.lines.pct + '%');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Could not parse coverage JSON" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report not generated (install @vitest/coverage-v8 for coverage)." >> $GITHUB_STEP_SUMMARY
          fi

  # ── Step 1a: Edge Function Deno Tests ──
  # Runs the deterministic, offline-safe Deno test suite for Supabase Edge
  # Functions. Previously these tests existed on disk but were NEVER invoked by
  # CI — they only ran on-demand locally. This job wires them into every PR.
  #
  # SCOPE (deliberately narrow — only hermetic, network-free tests).
  #
  # !! The AUTHORITATIVE target list is the `DENO_TEST_TARGETS` env var on the
  # job below. This block is PROSE *ABOUT* that list, not a second source of
  # truth. If the two ever disagree, DENO_TEST_TARGETS is right and this comment
  # is stale — fix the comment; never "fix" the variable to match the comment.
  # (The 2026-07 HTTP 522 incident documented on that variable was caused by
  # exactly this failure mode: two lists maintained separately, which drifted.)
  #
  #   - parent-portal/__tests__/  — 1 file
  #       contract.test.ts    static-source canary: reads index.ts as text; 401
  #                           before dispatch, guardian_id resolved from the JWT
  #                           (a body-supplied value is overridden), unknown
  #                           action → 400.
  #
  #   - teacher-dashboard/__tests__/  — WHOLE DIRECTORY, 3 files
  #       contract.test.ts    static-source canary, same shape as parent-portal:
  #                           401 before dispatch, teacher_id overridden from the
  #                           JWT, unknown action → 400.
  #       deploy-intervention-contract.test.ts
  #                           static-source canary over handleDeployIntervention:
  #                           it must write the canonical
  #                           teacher_remediation_assignments table and NEVER
  #                           assignments / assignment_submissions, and must keep
  #                           the 23505 dedupe backstop + roster-ownership gate.
  #       metrics.test.ts     BEHAVIORAL unit tests of the pure metrics.ts
  #                           helpers: "no signal" vs a real 0, curriculum-scoped
  #                           mastery averaging, cohort BKT map shaping.
  #
  #   - daily-cron/__tests__/  — WHOLE DIRECTORY, 3 files
  #       contract.test.ts    static-source canary (REG-118): fail-closed cron
  #                           auth gate before ANY step dispatch, Promise
  #                           .allSettled per-step isolation → 207 not a hard
  #                           500, and the flag-gated steps.
  #       actions.contract.test.ts
  #                           BEHAVIORAL: createDailyCronActions preserves action
  #                           names and order, and stamps requiresInternalCronAuth
  #                           + audit/metric labels on every action.
  #       verification-delivery.test.ts
  #                           BEHAVIORAL unit tests of the pure silent-
  #                           verification-failure decision logic (stuck-signup
  #                           and streak thresholds, dedup keys), PLUS a static
  #                           canary over the migration SQL that owns the
  #                           exclusion rules (they live in SQL for P13).
  #
  #   - scan-ocr/__tests__/  — 1 file
  #       contract.test.ts    static-source canary: SUPABASE_URL and
  #                           SUPABASE_SERVICE_KEY are DECLARED and env-bound and
  #                           admitAiRoute() runs — pins the 2026-07-13
  #                           ReferenceError that 500'd every request before auth.
  #
  #   - bulk-jee-neet-curated-import/__tests__/validate.test.ts
  #                           pure P6 question-validation helpers — no I/O.
  #
  #   - send-auth-email/__tests__/always-200.test.ts
  #                           P15 rule 1: every code path returns HTTP 200 so
  #                           Supabase Auth never blocks signup. Offline — a stub
  #                           EmailTransport is injected, so no socket is opened.
  #
  #   - _shared/__tests__/gmail-transport.test.ts
  #                           Gmail API transport — offline, injected fetcher,
  #                           in-process WebCrypto test key. The ONE Deno test in
  #                           _shared/__tests__ (its 4 siblings are Vitest).
  #
  #   - _shared/security/__tests__/internal-cron-auth.test.ts
  #                           BEHAVIORAL: verifyInternalCronRequest rejects
  #                           unauthenticated / stale / invalid-signature
  #                           requests, accepts valid signatures plus the
  #                           approved CRON_SECRET and the get_cron_secret() DB
  #                           fallback, and stays FAIL-CLOSED when that fallback
  #                           errors or mismatches. This is the shared module
  #                           daily-cron's contract 1a delegates its auth to.
  #
  #   - _shared/quiz-oracle.test.ts
  #                           BEHAVIORAL unit tests of the pure quiz-oracle cache
  #                           primitives (REG-54 follow-up): candidate cache-key
  #                           identity includes correct_answer_index, and the LRU
  #                           cap evicts oldest-first. Imports ONLY ./quiz-oracle
  #                           .ts — zero remote imports, zero I/O. Note it lives
  #                           at the _shared ROOT, not in _shared/__tests__/
  #                           (which is Vitest territory — see EXCLUDED below).
  #                           Its own header still says "deno test is NOT yet
  #                           wired into CI"; that TODO is closed by this entry.
  #
  #   - bulk-question-gen/__tests__/actions.contract.test.ts
  #   - quiz-generator/__tests__/actions.contract.test.ts
  #                           BEHAVIORAL action-registry contract tests. Each
  #                           imports ONLY its sibling ../actions.ts, which is a
  #                           dependency-free pure module (literally zero import
  #                           statements). They do NOT import ../index.ts, so the
  #                           Deno.serve() in those index.ts files is never
  #                           reached. No fetch, no Deno.env, no filesystem.
  #
  #   - grounded-answer/__tests__/  — 21 files ENUMERATED INDIVIDUALLY in
  #                           DENO_TEST_TARGETS, NOT the whole directory (26 Deno
  #                           test files live there). Pure helpers only.
  #
  # ── 2026-07-28: the seven-file TODO below was CLOSED BY EXPERIMENT ──────────
  # The previous version of this comment listed seven grounded-answer tests
  # (cache-redis, cache-telemetry, foxy-python-generation, gen-ctx, output-screen,
  # prompt-segments, rag-content-version-bump) as an open TODO — offline tests
  # with no recorded exclusion rationale that "appear to have simply never been
  # added". They are now IN the list, together with three further hermetic tests
  # documented nowhere (_shared/quiz-oracle, bulk-question-gen actions.contract,
  # quiz-generator actions.contract). 20 targets → 30.
  #
  # Be honest about the epistemic status: this was added as a MEASUREMENT, not a
  # confident fix. Deno could not be run locally when this landed, so CI is the
  # instrument. What WAS verified statically before adding, per file, over the
  # full transitive RELATIVE-import closure:
  #   * no Deno.serve / Deno.listen / Deno.connect / std http/server anywhere in
  #     the closure — none of the ten reaches an index.ts;
  #   * no module-level side effects (no top-level await, no module-scope
  #     Deno.env read, no client constructed at import time);
  #   * every network-touching code path is exercised either with globalThis
  #     .fetch stubbed in-process, or with the relevant env pair deliberately
  #     deleted so the client stays unconfigured and no socket is attempted;
  #   * the only filesystem read in any closure is prompts/index.ts's .txt
  #     fallback, which is unreachable in practice (all 9 registered template
  #     ids have INLINE_PROMPTS entries) and is covered by --allow-read anyway;
  #   * permissions required stay exactly --allow-read --allow-env. Deno's
  #     --allow-env covers Deno.env.set/delete, which several of these tests use
  #     to build their fixtures.
  # If CI proves any of them wrong, the correct response is to REMOVE that file
  # from DENO_TEST_TARGETS — never to widen the permission flags on the test step.
  #
  # NEW REMOTE IMPORT: cache-redis.test.ts → ../cache-redis.ts pulls
  # https://esm.sh/@upstash/redis@1, which was not previously in this job's
  # module graph. It is fetched by the RETRIED pre-warm step because both steps
  # read the same variable — this is precisely the property the HTTP 522
  # incident note below demands. Do not "optimize" it back out.
  #
  # EXCLUDED ON PURPOSE — the remaining exclusions are now exactly the
  # Deno.serve set (plus the Vitest files):
  #   2026-08-13: +everyday-examples-directive.test.ts (ff_foxy_everyday_examples_v1).
  #   Same static verification as the ten above, over its full relative-import
  #   closure (../structured-prompt.ts and ../_everyday-flag.ts have ZERO imports;
  #   ../gen-ctx.ts → ./config.ts + type-only ./types.ts — the identical closure
  #   gen-ctx.test.ts already exercises in this job). No index.ts, no Deno.serve,
  #   no fetch, no top-level await, no module-scope env read. The DB-failure cases
  #   use an in-process object stub, not a socket.
  #
  #   - grounded-answer/__tests__/ — 5 of its 26 Deno test files are absent from
  #     DENO_TEST_TARGETS: e2e, pipeline, cache-durable-l3,
  #     foxy-answer-continuation and model-order-cache-fix. All five import
  #     ../index.ts, which calls Deno.serve() (binds a socket → requires
  #     --allow-net + has a server side-effect): flaky/non-deterministic in CI.
  #     There is no longer any "unexplained TODO" residue in this directory.
  #   - alfabot-answer/__tests__/integration.test.ts (statically imports
  #     ../index.ts → Deno.serve) and send-welcome-email/__tests__/
  #     bilingual-welcome.test.ts (DYNAMICALLY imports `../index.ts?cb=…` →
  #     Deno.serve). Same reason. send-pre-debit-notice/__tests__/
  #     audit-evidence.test.ts also stays out; it reads ../index.ts as TEXT
  #     rather than importing it, and its own header documents the esm.sh
  #     cold-cache concern that kept it out — revisit separately, not here.
  #   - alfabot-answer, bulk-jee-neet-import/index.test.ts, _shared/__tests__/*
  #     (EXCEPT gmail-transport.test.ts, a Deno test — see SCOPE above),
  #     _shared/mol/__tests__/* — these are VITEST tests (import from 'vitest'),
  #     already covered by the sharded `unit-tests` job's `npm test`, not `deno test`.
  #
  # Permissions are limited to --allow-read (the static-source canaries
  # readTextFileSync index.ts and, for verification-delivery, a migration .sql)
  # and --allow-env (some helpers read Deno.env). No --allow-net is granted,
  # which guarantees no test can reach the network. `--no-lock` decouples CI from
  # the repo's deno.lock (left untouched). Same BLOCKING posture as the unit-test
  # `quality` job: a failure here fails CI.
  edge-function-tests:
    name: Edge Function Deno Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TIER: merge_group / push / workflow_dispatch only. Relocated off the
    # `pull_request` event 2026-08-19 -- see the merge_group note in `on:`.
    if: ${{ github.event_name != 'pull_request' }}
    env:
      # ════════════════════════════════════════════════════════════════════════
      #  SINGLE SOURCE OF TRUTH for the Deno test target set.
      #  Both the pre-warm ("Cache Deno module dependencies") step and the
      #  offline ("Run Edge Function Deno tests") step read THIS variable.
      #  Never inline a target list into either step again.
      # ────────────────────────────────────────────────────────────────────────
      #  WHY THIS MUST BE ONE LIST — the 2026-07 HTTP 522 incident:
      #
      #  These two lists used to be maintained separately, and they drifted.
      #  The pre-warm list enumerated INDIVIDUAL FILES (e.g. only
      #  daily-cron/__tests__/contract.test.ts) while the test step passed
      #  WHOLE DIRECTORIES (daily-cron/__tests__/) plus at least one path the
      #  pre-warm list never mentioned at all
      #  (_shared/security/__tests__/internal-cron-auth.test.ts).
      #
      #  Five test files therefore RAN but were never PRE-WARMED:
      #    daily-cron/__tests__/actions.contract.test.ts
      #    daily-cron/__tests__/verification-delivery.test.ts
      #    teacher-dashboard/__tests__/deploy-intervention-contract.test.ts
      #    teacher-dashboard/__tests__/metrics.test.ts
      #    _shared/security/__tests__/internal-cron-auth.test.ts
      #
      #  The consequence was not merely "a bit less caching". The pre-warmed
      #  daily-cron/__tests__/contract.test.ts imports ONLY std@0.210.0/assert,
      #  whereas actions.contract.test.ts imports ../actions.ts, whose first
      #  line is `import { createClient } from
      #  'https://esm.sh/@supabase/supabase-js@2'`. That specifier was thus
      #  absent from the pre-warm module graph entirely — CI run 30310350618
      #  downloaded std@0.210.0, std@0.224.0, esm.sh/standardwebhooks@1.0.0,
      #  @stablelib/base64 and fast-sha256 in the cache step, but NEVER
      #  @supabase/supabase-js.
      #
      #  It was fetched for the first time inside the TEST step, which has no
      #  retry loop and is meant to be fully offline. esm.sh answered HTTP 522
      #  (Cloudflare origin timeout) after a 39s hang and the job failed. The
      #  same job passed on the 4 preceding SHAs and on main: this was a latent
      #  flakiness amplifier that turned any transient esm.sh blip into a red
      #  build, at a point in the job where nothing can retry it.
      #
      #  So: every remote import must be fetched inside the RETRIED pre-warm
      #  step. Do NOT "optimize" the pre-warm list back down to a subset, and
      #  do NOT add --allow-net to the test step to paper over a miss. If you
      #  add a target below, both steps pick it up automatically.
      # ════════════════════════════════════════════════════════════════════════
      DENO_TEST_TARGETS: >-
        supabase/functions/parent-portal/__tests__/
        supabase/functions/teacher-dashboard/__tests__/
        supabase/functions/daily-cron/__tests__/
        supabase/functions/scan-ocr/__tests__/
        supabase/functions/bulk-jee-neet-curated-import/__tests__/validate.test.ts
        supabase/functions/send-auth-email/__tests__/always-200.test.ts
        supabase/functions/_shared/__tests__/gmail-transport.test.ts
        supabase/functions/_shared/security/__tests__/internal-cron-auth.test.ts
        supabase/functions/_shared/quiz-oracle.test.ts
        supabase/functions/alert-deliverer/index_test.ts
        supabase/functions/bulk-question-gen/__tests__/actions.contract.test.ts
        supabase/functions/quiz-generator/__tests__/actions.contract.test.ts
        supabase/functions/foxy-tutor/__tests__/
        supabase/functions/grounded-answer/__tests__/cache-redis.test.ts
        supabase/functions/grounded-answer/__tests__/cache-telemetry.test.ts
        supabase/functions/grounded-answer/__tests__/cache.test.ts
        supabase/functions/grounded-answer/__tests__/circuit.test.ts
        supabase/functions/grounded-answer/__tests__/citations.test.ts
        supabase/functions/grounded-answer/__tests__/claude.test.ts
        supabase/functions/grounded-answer/__tests__/confidence.test.ts
        supabase/functions/grounded-answer/__tests__/coverage.test.ts
        supabase/functions/grounded-answer/__tests__/embedding.test.ts
        supabase/functions/grounded-answer/__tests__/everyday-examples-directive.test.ts
        supabase/functions/grounded-answer/__tests__/foxy-python-generation.test.ts
        supabase/functions/grounded-answer/__tests__/gen-ctx.test.ts
        supabase/functions/grounded-answer/__tests__/grounding-check.test.ts
        supabase/functions/grounded-answer/__tests__/model-rollout-flag.test.ts
        supabase/functions/grounded-answer/__tests__/output-screen.test.ts
        supabase/functions/grounded-answer/__tests__/prompt-segments.test.ts
        supabase/functions/grounded-answer/__tests__/rag-content-version-bump.test.ts
        supabase/functions/grounded-answer/__tests__/retrieval.test.ts
        supabase/functions/grounded-answer/__tests__/trace.test.ts
        supabase/functions/grounded-answer/__tests__/validation.test.ts
        supabase/functions/grounded-answer/__tests__/wrap-as-paragraph.test.ts
    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14

      - name: Cache Deno module dependencies
        run: |
          # Pre-warm the Deno module cache so the offline test step doesn't need
          # --allow-net. `deno cache` resolves and downloads every remote import
          # reachable from the given entrypoints (std@0.210.0/assert,
          # esm.sh/@supabase/supabase-js@2, etc.). The test step then runs with
          # only --allow-read --allow-env (no network).
          #
          # Targets come from $DENO_TEST_TARGETS — the SAME variable the test
          # step uses. See the long incident note on that variable for why these
          # two sets must never diverge again.
          #
          # $DENO_TEST_TARGETS contains directories (which `deno test` expands
          # itself) as well as files. `deno cache` takes module specifiers, so we
          # expand directories to individual files HERE, using Deno's documented
          # test-discovery conventions (*_test.*, *.test.*, test.*). This makes
          # the pre-warm correct whether or not `deno cache` accepts a directory
          # argument, so we never depend on that behaviour.
          targets=""
          for t in $DENO_TEST_TARGETS; do
            if [ -d "$t" ]; then
              found=$(find "$t" -type f \( \
                -name '*_test.ts'  -o -name '*_test.tsx'  -o -name '*_test.js'  -o -name '*_test.mjs'  -o -name '*_test.jsx' -o \
                -name '*.test.ts'  -o -name '*.test.tsx'  -o -name '*.test.js'  -o -name '*.test.mjs'  -o -name '*.test.jsx' -o \
                -name 'test.ts'    -o -name 'test.tsx'    -o -name 'test.js'    -o -name 'test.mjs'    -o -name 'test.jsx' \
                \) | sort)
              if [ -z "$found" ]; then
                echo "::error::No Deno test files found under directory target '$t'. Refusing to pre-warm an empty set."
                exit 1
              fi
              targets="$targets $found"
            elif [ -f "$t" ]; then
              targets="$targets $t"
            else
              echo "::error::Deno test target '$t' does not exist (renamed or deleted?). Fix DENO_TEST_TARGETS."
              exit 1
            fi
          done

          echo "Pre-warming the Deno module cache for these entrypoints:"
          printf '  %s\n' $targets

          attempt=1
          while true; do
            if deno cache --no-lock --no-check $targets; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Deno module cache pre-warm failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 5))
            echo "::warning::Deno module download failed on attempt $attempt; retrying in ${delay}s."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Run Edge Function Deno tests (deterministic, offline)
        run: |
          # Targets come from $DENO_TEST_TARGETS — the SAME variable the pre-warm
          # step above uses, so every remote import in this graph was already
          # downloaded inside that step's retry loop. Deliberately no --allow-net.
          echo "Running Deno tests over these targets:"
          printf '  %s\n' $DENO_TEST_TARGETS

          deno test --no-lock --no-check --allow-read --allow-env $DENO_TEST_TARGETS

      # ── ADVISORY MEASUREMENT — NOT A GATE ──────────────────────────────────
      #  WHY THIS STEP EXISTS
      #    Both steps above pass --no-check, deliberately, and that stays: the
      #    test step must be deterministic and offline. The consequence is that
      #    every local .ts file under supabase/functions/ is EXECUTED in CI with
      #    TypeScript checking switched off, and nobody knows how many
      #    diagnostics `deno check` would report against that tree.
      #
      #    That single unknown is the only thing blocking a decision on whether
      #    to wire a real Deno type gate. This step BUYS THAT NUMBER.
      #
      #    It must NEVER fail CI. Turning on a blocking gate before knowing the
      #    size of the debt is exactly the mistake this step exists to prevent,
      #    so `continue-on-error: true` is load-bearing and the body also ends
      #    in an explicit `exit 0`. Do not remove either one before reading the
      #    number this produces. Once the number is known, the decision to gate
      #    (or not) is a separate, deliberate change.
      #
      #  SCOPE — supabase/functions/**/*.ts EXCLUDING supabase/functions/_archive/
      #    _archive/ holds tombstoned functions (export-report, quiz-generator-v2)
      #    that are not deployed and are not maintained. Diagnostics there are
      #    not actionable debt, and any gate we might wire later would exclude
      #    them too — so the measurement matches what a gate would actually
      #    cover. The excluded file count is reported alongside the checked
      #    count, so the delta stays auditable rather than hidden.
      #    __tests__/ files are deliberately INCLUDED: they are compiled and run
      #    in this very job, so their type debt is real debt.
      #
      #  NETWORK — tolerated, never fatal. The retried pre-warm step above
      #    cached module SOURCES under --no-check, which does not fetch the
      #    .d.ts type declarations that type checking needs (esm.sh serves those
      #    via the X-TypeScript-Types header). `deno check` may therefore
      #    download. The deno exit status is CAPTURED rather than propagated,
      #    and a download failure surfaces as "0 diagnostics parsed + non-zero
      #    exit", which the summary labels INCONCLUSIVE instead of reporting a
      #    fake zero.
      #
      #  This step does NOT read the Deno test-target variable and must never
      #  start doing so: that variable has exactly two consumers (the pre-warm
      #  and the test run), an invariant pinned by REG-317.
      - name: Measure Deno type-check debt (advisory)
        # LOAD-BEARING. This is a measurement, not a gate. See the note above.
        continue-on-error: true
        env:
          # BLINDNESS FIX #1 of 2 (the other is the sanitise() strip in the body).
          # Deno colourises its output even when stdout is a pipe, so on runs
          # 30320408084 and 30321212537 the raw capture was full of CSI escapes:
          # the job log shows `ESC[32mDownload ESC[0m`, and deno emits a
          # top-level error as red_bold("error") + a PLAIN ": " -- i.e. the
          # bytes on the wire are `ESC[1;31merror ESC[0m: message`, NOT
          # `error: message`. Every ANCHORED reader in the body below
          # (`grep -cE '^error: '` for NON_TS, the excerpt filter) is then
          # STRUCTURALLY incapable of matching, and the `at file://` attribution
          # frame breaks too because deno paints the location cyan, splitting
          # `at ` from `file://`. That is why both runs reported NON_TS=0 and
          # FILES=0 against 372,905 bytes of output and a non-zero exit: the
          # readers were blind, not the tree clean.
          # NO_COLOR is the documented, deno-honoured kill switch for this.
          NO_COLOR: '1'
        run: |
          set +e

          TMP="${RUNNER_TEMP:-/tmp}"
          RAW="$TMP/deno-check-raw.txt"
          # $RAW is the byte-exact capture (it backs RAW_BYTES); $CLEAN is the
          # ANSI-stripped copy that EVERY reader consumes. Never parse $RAW.
          CLEAN="$TMP/deno-check-clean.txt"
          LIST="$TMP/deno-check-files.txt"
          CODES="$TMP/deno-check-codes.txt"
          TALLY="$TMP/deno-check-filetally.txt"
          STATS="$TMP/deno-check-stats.txt"
          : > "$RAW"
          : > "$CLEAN"

          # ---- scope: the whole Edge Function tree MINUS _archive/ ----------------
          find supabase/functions -type f -name '*.ts' \
            -not -path 'supabase/functions/_archive/*' | sort > "$LIST"
          mapfile -t FILES < "$LIST"
          CHECKED_FILES=${#FILES[@]}

          # Guard an empty set. Without this, every command below that expands
          # "${FILES[@]}" would be invoked with ZERO arguments -- and `cat` with no
          # arguments reads STDIN, which hangs the job until the runner's timeout
          # rather than reporting anything. Same reasoning as the pre-warm step's
          # "Refusing to pre-warm an empty set" check.
          if [ "$CHECKED_FILES" -eq 0 ]; then
            echo "::warning::No .ts files found under supabase/functions (tree moved or renamed?). Nothing to measure."
            echo "## Deno type-check debt (ADVISORY)" >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
            echo "No \`.ts\` files found under \`supabase/functions\` — measurement skipped." >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
            exit 0
          fi

          ARCHIVED=$(find supabase/functions/_archive -type f -name '*.ts' 2>/dev/null | wc -l | tr -d ' ')
          CHECKED_LINES=$(cat "${FILES[@]}" < /dev/null 2>/dev/null | wc -l | tr -d ' ')

          echo "Scope: $CHECKED_FILES files / $CHECKED_LINES lines under supabase/functions (excluded _archive: $ARCHIVED files)"
          deno --version

          # ---- ANSI sanitiser: BLINDNESS FIX #2 of 2 ------------------------------
          # NO_COLOR is set in this step's env:, which SHOULD make everything below
          # a no-op. This exists so the measurement does not DEPEND on deno
          # honouring it -- a regression in deno's colour handling, or a nested
          # tool that forces colour, must not silently zero the number again.
          # Strips CSI sequences (ESC [ params final) and folds CR to LF, because
          # deno's progress bar redraws with `\r` + ESC[K and can otherwise glue a
          # real diagnostic onto the tail of a progress line where an anchored
          # pattern cannot see it. $RAW is left byte-exact for RAW_BYTES.
          ESC=$(printf '\033')
          sanitise() {
            tr '\r' '\n' < "$1" | sed "s/${ESC}\[[0-9;?]*[A-Za-z]//g" > "$2"
          }

          # ---- parse helper: one pass; reused by the primary run and the fallback -
          # Deno prints each diagnostic as `TS#### [ERROR]: message` followed by an
          # `    at file:///abs/path.ts:LINE:COL` frame. A diagnostic can carry extra
          # related-information frames, so only the FIRST frame after a code line is
          # attributed. Deliberately no gawk-only constructs (runners default to mawk):
          # no length(array), no /dev/stderr writes.
          parse_raw() {
            : > "$CODES"; : > "$TALLY"; : > "$STATS"
            awk '
              match($0, /TS[0-9]+ \[ERROR\]/) {
                code = substr($0, RSTART, RLENGTH)
                sub(/ \[ERROR\]/, "", code)
                total++; codes[code]++; pending = 1; next
              }
              pending && /at file:\/\// {
                f = $0
                sub(/^.*at file:\/\//, "", f)
                sub(/:[0-9]+:[0-9]+[^:]*$/, "", f)
                sub(/^.*\/supabase\/functions\//, "supabase/functions/", f)
                files[f]++; attributed++; pending = 0
              }
              END {
                print "TOTAL " total + 0 > STATS_OUT
                print "ATTRIBUTED " attributed + 0 > STATS_OUT
                for (c in codes) print codes[c] "\t" c > CODES_OUT
                for (f in files) print files[f] "\t" f > FILES_OUT
              }
            ' STATS_OUT="$STATS" CODES_OUT="$CODES" FILES_OUT="$TALLY" "$1"

            TOTAL=$(awk '$1=="TOTAL"{print $2}' "$STATS"); TOTAL=${TOTAL:-0}
            ATTRIBUTED=$(awk '$1=="ATTRIBUTED"{print $2}' "$STATS"); ATTRIBUTED=${ATTRIBUTED:-0}
            DISTINCT_FILES=$(wc -l < "$TALLY" | tr -d ' '); DISTINCT_FILES=${DISTINCT_FILES:-0}
            DISTINCT_CODES=$(wc -l < "$CODES" | tr -d ' '); DISTINCT_CODES=${DISTINCT_CODES:-0}
          }

          # ---- primary: one invocation over the whole tree ------------------------
          # NOT --all: plain `deno check` diagnoses LOCAL code only, which is the debt
          # we own; remote-module diagnostics are not actionable here. --no-lock
          # matches the two steps above and leaves the repo deno.lock untouched. The
          # exit status is CAPTURED, never propagated.
          # `>> "$RAW" 2>&1` -- BOTH streams. deno writes type diagnostics and its
          # top-level `error:` lines to STDERR, so dropping stderr here would be a
          # far bigger bug than the colour blindness. Verified present on this
          # invocation and on the per-file fallback below; do not split them.
          # No --quiet: deno documents that flag as "suppress diagnostic output",
          # and the `Download` noise it would remove is already excluded by the
          # filtered excerpt. Silencing 372 KB of noise is not worth any risk of
          # silencing the one number this step exists to obtain.
          timeout 900 deno check --no-lock "${FILES[@]}" >> "$RAW" 2>&1
          STATUS=$?
          echo "deno check exit status: $STATUS"

          sanitise "$RAW" "$CLEAN"
          parse_raw "$CLEAN"
          MODE="single-invocation"

          # ---- fallback: deno bailed out before emitting any diagnostic -----------
          # One unresolvable import, or a failure fetching type declarations, can abort
          # the whole-tree run before anything is type-checked. A per-file sweep still
          # yields a real number for every file that CAN be checked. Bounded by a 600s
          # wall-clock budget so a pathological run cannot stall the job.
          if [ "$TOTAL" -eq 0 ] && [ "$STATUS" -ne 0 ]; then
            echo "::warning::Whole-tree deno check exited $STATUS with 0 parsed diagnostics; falling back to a per-file sweep."
            MODE="per-file-fallback"
            DEADLINE=$(( $(date +%s) + 600 ))
            SWEPT=0
            for f in "${FILES[@]}"; do
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "::warning::Per-file sweep hit its 600s budget after $SWEPT files."
                break
              fi
              timeout 60 deno check --no-lock "$f" >> "$RAW" 2>&1
              SWEPT=$((SWEPT + 1))
            done
            MODE="per-file-fallback ($SWEPT/$CHECKED_FILES files swept)"
            sanitise "$RAW" "$CLEAN"
            parse_raw "$CLEAN"
          fi

          # $CLEAN, not $RAW: this anchored pattern is the exact reader that
          # reported NON_TS=0 twice against a non-zero exit and 372 KB of output.
          # `-a` on every reader below: deno's output is not guaranteed NUL-free,
          # and grep silently degrades to "Binary file matches" (count 1, no
          # lines) the moment it decides a file is binary — another way to get a
          # confidently wrong number out of this step.
          NON_TS=$(grep -acE '^error: ' "$CLEAN"); NON_TS=${NON_TS:-0}
          RAW_BYTES=$(wc -c < "$RAW" | tr -d ' ')
          # How much colour was actually on the wire. 0 means NO_COLOR was
          # honoured and the strip was a no-op; >0 means it was load-bearing.
          # Reported so the next run answers that question without a third
          # round-trip.
          ANSI_SEQS=$(grep -aoE "${ESC}\[[0-9;?]*[A-Za-z]" "$RAW" 2>/dev/null | wc -l | tr -d ' ')
          ANSI_SEQS=${ANSI_SEQS:-0}

          # One word summarising which of the three outcomes we landed on, so the
          # INCONCLUSIVE case is greppable rather than only readable as prose.
          if [ "$STATUS" -eq 0 ]; then
            STATE="CLEAN"
          elif [ "$TOTAL" -eq 0 ]; then
            STATE="INCONCLUSIVE"
          else
            STATE="MEASURED"
          fi

          # ---- report to STDOUT *and* the job summary -----------------------------
          # `tee`, not `>>`. GitHub exposes $GITHUB_STEP_SUMMARY through NO API
          # surface (not get_job_logs, not check-run output, not any /job-summaries
          # endpoint) — a summary-only report is readable exclusively by a human
          # opening the run's Summary tab in a browser, which strands the one number
          # this step exists to produce. Writing the SAME block to stdout puts it in
          # the job log, which IS API-readable. The `:-/dev/null` default keeps this
          # working when the variable is unset (running the body outside Actions).
          # The KEY=VALUE block below is the machine-readable contract: a future
          # automated reader greps `^DENO_TYPE_DEBT_TOTAL=` instead of parsing a
          # markdown table. Fenced so it also renders as a block in the summary.
          {
            echo '```'
            echo "DENO_TYPE_DEBT_STATE=$STATE"
            echo "DENO_TYPE_DEBT_TOTAL=$TOTAL"
            echo "DENO_TYPE_DEBT_FILES=$DISTINCT_FILES"
            echo "DENO_TYPE_DEBT_MODE=$MODE"
            echo "DENO_TYPE_DEBT_CHECKED_FILES=$CHECKED_FILES"
            echo "DENO_TYPE_DEBT_EXCLUDED_FILES=$ARCHIVED"
            echo "DENO_TYPE_DEBT_CHECKED_LINES=$CHECKED_LINES"
            echo "DENO_TYPE_DEBT_CODES=$DISTINCT_CODES"
            echo "DENO_TYPE_DEBT_ATTRIBUTED=$ATTRIBUTED"
            echo "DENO_TYPE_DEBT_NON_TS=$NON_TS"
            echo "DENO_TYPE_DEBT_EXIT=$STATUS"
            echo "DENO_TYPE_DEBT_RAW_BYTES=$RAW_BYTES"
            echo "DENO_TYPE_DEBT_ANSI_SEQS=$ANSI_SEQS"
            echo '```'
            echo
            echo "## Deno type-check debt (ADVISORY — this step never fails CI)"
            echo
            echo "\`deno check --no-lock\` over the Edge Function tree. The cache and test"
            echo "steps above keep \`--no-check\`; this step measures, it does not gate."
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Files checked | \`$CHECKED_FILES\` |"
            echo "| Lines checked | \`$CHECKED_LINES\` |"
            echo "| Files excluded (\`_archive/\`) | \`$ARCHIVED\` |"
            echo "| **Total TS errors** | **\`$TOTAL\`** |"
            echo "| **Distinct files with errors** | **\`$DISTINCT_FILES\`** |"
            echo "| Distinct error codes | \`$DISTINCT_CODES\` |"
            echo "| Errors attributed to a file | \`$ATTRIBUTED\` |"
            echo "| Non-TS \`error:\` lines | \`$NON_TS\` |"
            echo "| deno check exit status | \`$STATUS\` |"
            echo "| Measurement mode | \`$MODE\` |"
            echo "| Raw output size | \`$RAW_BYTES\` bytes |"
            echo "| ANSI escapes stripped | \`$ANSI_SEQS\` |"
            echo
            if [ "$STATUS" -eq 0 ]; then
              echo "> **Clean.** Zero diagnostics. A blocking Deno type gate could be wired"
              echo "> at zero remediation cost."
            elif [ "$TOTAL" -eq 0 ]; then
              echo "> **INCONCLUSIVE — do NOT read this as zero debt.** deno exited"
              echo "> \`$STATUS\` but no \`TS####\` diagnostic was parsed. That normally means a"
              echo "> module-resolution or network failure: the \`--no-check\` pre-warm above"
              echo "> caches module SOURCES but not the \`.d.ts\` type declarations that type"
              echo "> checking needs. Read the **non-TS \`error:\` messages** table below —"
              echo "> that is the actual cause — then the raw excerpt in the step log."
            else
              echo "> **$TOTAL errors across $DISTINCT_FILES of $CHECKED_FILES files.**"
              echo "> Size remediation from the breakdown below before deciding on a gate."
            fi
            echo
            echo "### Top error codes"
            echo
            if [ -s "$CODES" ]; then
              echo "| Count | Code |"
              echo "| --- | --- |"
              sort -rn "$CODES" | head -15 | while IFS="$(printf '\t')" read -r n c; do
                echo "| \`$n\` | \`$c\` |"
              done
            else
              echo "_none parsed_"
            fi
            echo
            echo "### Top files by error count"
            echo
            if [ -s "$TALLY" ]; then
              echo "| Count | File |"
              echo "| --- | --- |"
              sort -rn "$TALLY" | head -10 | while IFS="$(printf '\t')" read -r n f; do
                echo "| \`$n\` | \`$f\` |"
              done
            else
              echo "_none parsed_"
            fi
            echo
            echo "### Top non-TS \`error:\` messages"
            echo
            # THE point of this section: in the INCONCLUSIVE case the TS tables
            # above are both empty by definition, and the one thing that explains
            # WHY lives in deno's top-level `error:` lines. Deduped, because a
            # 244-file sweep repeats the same cause once per file. Absolute paths
            # are folded to repo-relative so identical errors collapse to one row.
            if [ "$NON_TS" -gt 0 ]; then
              echo "| Count | Message |"
              echo "| --- | --- |"
              grep -aE '^error: ' "$CLEAN" \
                | sed -e 's#file:///[^ "]*/supabase/functions/#supabase/functions/#g' \
                      -e 's/[|`]/ /g' \
                | cut -c1-200 | sort | uniq -c | sort -rn | head -10 \
                | while read -r n m; do echo "| \`$n\` | \`$m\` |"; done
            else
              echo "_none_"
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

          # ---- capped raw excerpt so a huge error volume cannot blow up the log ---
          # FILTERED, not a plain head. An aborted whole-tree pass front-loads the
          # raw file with `Download https://esm.sh/...` lines — on run 30320408084
          # the first 100 lines of 372,905 raw bytes contained ZERO `TS####` lines,
          # so the excerpt gave no independent cross-check on the parsed count,
          # which is the only reason an excerpt exists. Match the same diagnostic
          # shapes the parser keys on, and fall back when the filter matches
          # nothing so a FORMAT CHANGE still shows raw evidence instead of an
          # empty block.
          #
          # Reads $CLEAN, not $RAW. The `^error: ` half of this filter is anchored
          # and could never match deno's coloured `ESC[1;31merror ESC[0m: ...` —
          # on the two failed runs this filter therefore emptied out and the
          # fallback dumped 100 lines of `Download` noise, which is why the cause
          # stayed invisible. Tier 2 now drops that noise before the head so a
          # format change still surfaces something legible; tier 3 keeps a truly
          # unfiltered view for the case where the noise IS the whole output.
          FILTERED="$TMP/deno-check-excerpt.txt"
          DENOISED="$TMP/deno-check-denoised.txt"
          grep -aE 'TS[0-9]+ \[ERROR\]|^error: ' "$CLEAN" > "$FILTERED" 2>/dev/null
          FILTERED_LINES=$(wc -l < "$FILTERED" | tr -d ' '); FILTERED_LINES=${FILTERED_LINES:-0}
          grep -avE '^(Download |[[:space:]]*$)' "$CLEAN" > "$DENOISED" 2>/dev/null
          if [ -s "$FILTERED" ]; then
            echo "──────── deno check output: diagnostic lines (first 100 of $FILTERED_LINES) ────────"
            head -100 "$FILTERED"
          elif [ -s "$DENOISED" ]; then
            echo "──────── no diagnostic-shaped line matched; first 100 non-Download lines ────────"
            head -100 "$DENOISED"
          else
            echo "──────── nothing but download noise; unfiltered first 100 lines ────────"
            head -100 "$CLEAN"
          fi
          echo "──────── end excerpt ($RAW_BYTES bytes raw, $ANSI_SEQS ANSI escapes stripped) ────────"

          # Advisory by construction. continue-on-error: true is the belt; this is the
          # braces. Removing either without first reading the number above is the exact
          # mistake this step exists to prevent.
          exit 0

  # ── Step 1b: Integration Tests (live Supabase) ──
  # Runs migration/trigger/view/CHECK-constraint tests that require a real
  # Postgres backend.
  #
  # BEHAVIOUR (corrected 2026-08-12 — the previous comment here described a
  # posture this job has not had since 2026-05-05):
  #   - BLOCKING wherever it runs. The test step carries an explicit
  #     `continue-on-error: false` (see the note on that step), and the job is
  #     in the ci-gate `required` list on push and same-repo PRs.
  #   - It does NOT "skip cleanly" on a missing secret. Where the job runs, a
  #     missing STAGING_SUPABASE_URL / STAGING_SUPABASE_SERVICE_ROLE_KEY is a
  #     hard `::error::` + exit 1 (fail-closed) — a silently-degraded run would
  #     be indistinguishable from a passing one.
  #   - The only "skip" is at the JOB level, via the `if:` below: fork PRs get
  #     no secrets, so the job is never scheduled there. ci-gate then asserts
  #     the job is EXACTLY skipped rather than dropping the check.
  integration-tests:
    name: Integration Tests (live DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on same-repo PRs and pushes only. Fork PRs and workflow_dispatch get
    # no secrets / do not populate github.event.pull_request, so the job would
    # always fail at boot; it is skipped there and ci-gate expects that skip.
    # (Previously also `needs: secret-scan` — removed for the same masking
    # reason documented on the `quality` job above.)
    # Dependabot-authored PRs are same-repo, but GitHub withholds regular
    # Actions secrets from Dependabot-triggered events (they read the separate
    # Dependabot secret store), so STAGING_SUPABASE_URL / _SERVICE_ROLE_KEY are
    # empty and the preflight below hard-fails. Excluded here and RELOCATED to
    # ci-gate's expectedSkips for the same event -- not dropped.
    # 2026-08-19: relocated off `pull_request` to the merge-queue tier. The
    # same-repo/fork clause is gone because forks never reach merge_group --
    # a fork PR is queued only after it is approved, and the queue runs on a
    # branch in THIS repo, so secrets are present by construction.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'merge_group')
    # ── JOB-LEVEL concurrency: serialize live-DB runs across ALL refs ──
    # (added 2026-08-12)
    #
    # THE CONTENDED RESOURCE IS THE SHARED STAGING SUPABASE PROJECT, NOT THE REF.
    # This job is the only one in this workflow that talks to a real, single,
    # shared live database (STAGING_SUPABASE_URL). The workflow-level group is
    # `ci-${{ github.ref }}` — deliberately PER-REF — so runs on different refs
    # execute simultaneously. Every other job is ref-isolated (hermetic runners,
    # placeholder env) and correctly stays parallel; this one is not, because two
    # runners on two refs mutate the SAME rows in the SAME project. Hence a group
    # name with no `github.ref` in it: the lock must be global to the database.
    #
    # OBSERVED COLLISION (2026-08-12): run 31599688759 (push to `main`, started
    # 13:05:50) and run 31599712987 (PR, started 13:07) overlapped in this job and
    # corrupted each other's fixtures. Both failed with state-dependent assertions:
    #   AssertionError: a scope that never had content must read 0: expected 1786540072 to be +0
    #   AssertionError: expected +0 to be 1
    # across curriculum-version-monotonicity.test.ts, error-type-remediate-e2e.test.ts,
    # and state-runtime/{dispatcher.replay,offsets,retry-state}.test.ts. PROOF this
    # is contention and not a code defect: re-running 31599712987's failed jobs with
    # ZERO code changes went fully green, and the same tests passed on `main` at
    # 12:18 (run 31595779888).
    #
    # WHY THIS MATTERS BEYOND A RED CHECK: a failure here turns `CI Gate` red, and
    # deploy-production.yml's "Quality Gate" fail-closed polls `CI Gate` for the
    # exact SHA — so a transient cross-run collision blocks production deploys
    # outright. That is exactly what happened to run 31599688759.
    #
    # WHY `cancel-in-progress: false` IS LOAD-BEARING: a queued run must WAIT, not
    # be cancelled. A cancelled job reports `cancelled` to `ci-gate`, which
    # correctly treats anything other than `success`/expected-skip as a failure.
    # Cancelling would therefore just trade one red gate for another — and on
    # `main` it would re-create the stranded-deploy failure mode the workflow-level
    # `cancel-in-progress` guard already exists to prevent.
    #
    # QUEUEING IS BOUNDED: `timeout-minutes: 20` above starts when the job BEGINS
    # EXECUTING, not while it sits queued behind the lock, so waiting for the lock
    # cannot itself trip the job timeout. (Queue wait is bounded by the workflow
    # run's own overall limit, and each holder releases in ~1 min at current runtime.)
    #
    # THIS SERIALIZES, IT DOES NOT ISOLATE. The durable fix is per-run data
    # isolation inside the tests themselves (unique per-run scope/tenant keys and
    # teardown) — owned by the testing agent. This concurrency guard is the
    # stop-the-bleeding measure and MUST stay until that lands; removing it before
    # then re-opens the deploy-blocking flake. Nothing here weakens a test: the job
    # is still BLOCKING, still in ci-gate's `required` list, and a REAL failure
    # still fails the gate.
    # 2026-08-20: group renamed from the job-local `integration-tests-live-
    # staging-db` to the SAME `staging-db-push` lane already shared by
    # sync-staging-migrations.yml and deploy-staging.yml's `migrations` job
    # (see their concurrency comments — both call this "the contended
    # resource is the shared staging Supabase project", but neither one's
    # group previously included this job). Root-caused via the annotations
    # for run 32337055976 (sync-staging-migrations, commit 0b05519) and
    # 32337056137 (this job, same commit/push): both jobs ran against the
    # staging DB in the SAME wall-clock window (05:49:09-05:49:36 vs
    # 05:49:10-05:52:42) with no coordination between them, because they sat
    # in disjoint concurrency groups. A `supabase db push` running DDL
    # (CREATE OR REPLACE FUNCTION, ALTER TABLE, RLS policy changes) at the
    # same moment this job seeds fixtures and calls affected RPCs is exactly
    # the class of contention the 2026-08-12 fix above (job-level group
    # across refs) was written for — it just didn't cover this cross-workflow
    # case. Folding this job into `staging-db-push` makes ALL THREE writers
    # of the staging DB (this job, sync-staging-migrations.yml,
    # deploy-staging.yml's migrations job) mutually exclusive, closing the
    # gap without changing this job's own required/blocking status.
    concurrency:
      group: staging-db-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      # Secrets are bound through `env:` and tested as shell VARIABLES. Never
      # interpolate `${{ secrets.* }}` directly into a bash line: `${{ }}` is
      # substituted textually BEFORE bash parses the script, so a secret value
      # containing a quote, backtick or $(...) would be spliced into the script
      # itself (command injection / parse break). The steps below already use
      # this convention; this step now matches it. Fail-closed behaviour on a
      # missing secret is unchanged: ::error:: + exit 1.
      - name: Verify integration secrets are present
        id: check-secrets
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$STAGING_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Trusted integration job requires STAGING_SUPABASE_URL and STAGING_SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          echo "secrets_present=true" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: npm run test:integration -- --reporter=verbose
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          # B1 RAG eval-harness (Task 8, 2026-06-13). The retrieval-quality harness
          # (run-eval.integration.test.ts) runs the REAL retrieve() full-path only
          # when VOYAGE_API_KEY is present; without it the harness degrades to
          # FTS-only and emits an INCONCLUSIVE verdict — it does NOT fail the job.
          # NOTE (ops/architect prerequisite #1): the VOYAGE_API_KEY repository
          # secret must be PROVISIONED by ops. Until it is, this resolves to empty
          # and integration runs of the harness stay green via the degrade path.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        # BLOCKING gate restored (2026-05-05). Original audit Gap 5b mandated this
        # be blocking to enforce P8 (RLS boundary) + P9 (RBAC enforcement) against
        # the live staging schema. Was temporarily flipped to continue-on-error: true
        # on 2026-05-05 during PR #534 launch-readiness work while we debugged a
        # staging schema mismatch (rag_chunks_valid_grade CHECK appeared validated
        # but did not enforce on INSERT). Restored to BLOCKING on 2026-05-05 after
        # staging sync proven green on main (12:21 UTC) and PR #534 — Integration
        # Tests (live DB) now pass at ~50s on both. See
        # docs/runbooks/staging-schema-drift-resolution.md for the post-mortem and
        # smoke test to detect the same drift in future.
        continue-on-error: false

  # ── Step 2: Production Build + Bundle Analysis ──
  # 2026-07-20 CI speed-up: `needs: quality` removed. The build consumes
  # nothing from the lint/type-check or test jobs, so serializing it added
  # pure wall-clock time. ci-gate still requires BOTH to be green before merge.
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TIER: merge_group / push / workflow_dispatch only. Relocated off the
    # `pull_request` event 2026-08-19 -- see the merge_group note in `on:`.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      # Next.js incremental build cache (per Next.js CI-caching guidance:
      # https://nextjs.org/docs/app/guides/ci-build-caching#github-actions).
      # Restores apps/host/.next/cache across runs so webpack reuses
      # compilation artifacts instead of building cold every time. Keyed on
      # lockfile + source hash; when sources change, restore-keys falls back
      # to the newest cache for the same lockfile. NOTE: hashFiles() does NOT
      # support {ts,tsx} brace expansion (patterns use @actions/glob), so the
      # ts/tsx globs are listed separately.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/host/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/host/src/**/*.ts', 'apps/host/src/**/*.tsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # Bump Node heap to 6 GB. Default is ~2 GB which the project's bundle
      # has outgrown — surfaced on PR #817 as a deterministic
      # `FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap
      # out of memory` during `next build`. ubuntu-latest runners have 7 GB
      # RAM so 6144 MB leaves comfortable headroom. Vercel-side prod builds
      # already use a higher limit on their own infra; this is just the CI
      # sanity-check gate catching up.
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # PATH FIX 2026-07-20: `next build` runs via the apps/host workspace and
      # emits to apps/host/.next/ — the root .next/ these two bash steps used
      # to scan does not exist in the monorepo, so every check passed
      # VACUOUSLY. All .next/ references below now point at apps/host/.next/.
      # No limit values or gating logic changed.
      - name: Bundle size report
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # --- Overall build stats ---
          echo "### Build Overview" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY

          BUILD_SIZE=$(du -sh apps/host/.next/ 2>/dev/null | cut -f1)
          echo "| Total build | $BUILD_SIZE |" >> $GITHUB_STEP_SUMMARY

          PAGES=$(find apps/host/.next/server -name "*.html" 2>/dev/null | wc -l)
          echo "| Static pages | $PAGES |" >> $GITHUB_STEP_SUMMARY

          CHUNKS=$(find apps/host/.next/static/chunks -name "*.js" 2>/dev/null | wc -l)
          echo "| JS chunks | $CHUNKS |" >> $GITHUB_STEP_SUMMARY

          # --- Shared JS bundle size ---
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Shared JS Chunks (budget: ${SHARED_JS_LIMIT_KB} kB)" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size (kB) |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----------|" >> $GITHUB_STEP_SUMMARY

          SHARED_TOTAL=0
          for f in $(find apps/host/.next/static/chunks -maxdepth 1 -name '*.js' -type f 2>/dev/null | sort); do
            SIZE_BYTES=$(wc -c < "$f")
            SIZE_KB=$((SIZE_BYTES / 1024))
            SHARED_TOTAL=$((SHARED_TOTAL + SIZE_KB))
            BASENAME=$(basename "$f")
            echo "| \`$BASENAME\` | ${SIZE_KB} |" >> $GITHUB_STEP_SUMMARY
          done
          echo "| **Total shared** | **${SHARED_TOTAL}** |" >> $GITHUB_STEP_SUMMARY

          # --- Top page bundles ---
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Largest Page Bundles (budget: ${PAGE_JS_LIMIT_KB} kB per page)" >> $GITHUB_STEP_SUMMARY
          echo "| Directory | Size (kB) |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----------|" >> $GITHUB_STEP_SUMMARY

          PAGE_OVER=0
          if [ -d apps/host/.next/static/chunks/app ]; then
            for dir in $(find apps/host/.next/static/chunks/app -mindepth 1 -maxdepth 2 -type d 2>/dev/null | sort); do
              DIR_SIZE_BYTES=$(find "$dir" -name '*.js' -type f -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}')
              if [ -n "$DIR_SIZE_BYTES" ] && [ "$DIR_SIZE_BYTES" -gt 0 ] 2>/dev/null; then
                DIR_SIZE_KB=$((DIR_SIZE_BYTES / 1024))
                DIR_NAME=$(echo "$dir" | sed "s|apps/host/.next/static/chunks/app/||")
                echo "| /$DIR_NAME | ${DIR_SIZE_KB} |" >> $GITHUB_STEP_SUMMARY
                if [ "$DIR_SIZE_KB" -gt "$PAGE_JS_LIMIT_KB" ]; then
                  PAGE_OVER=1
                fi
              fi
            done
          fi

          # --- Middleware size ---
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Middleware (budget: ${MIDDLEWARE_LIMIT_KB} kB)" >> $GITHUB_STEP_SUMMARY
          if [ -f apps/host/.next/server/middleware.js ]; then
            MW_BYTES=$(wc -c < apps/host/.next/server/middleware.js)
            MW_KB=$((MW_BYTES / 1024))
            echo "| middleware.js | ${MW_KB} kB |" >> $GITHUB_STEP_SUMMARY
          else
            MW_KB=0
            echo "| middleware.js | not found |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Bundle size limit check
        run: |
          # P10 budget check. Rewritten for Next.js 16 / Turbopack output.
          #
          # Previous version summed ALL top-level chunks under .next/static/chunks
          # and compared to a per-page-load budget — a category error that
          # reported ~5 MB (sum of ~250 split chunks) against a 160 kB limit.
          # Turbopack emits fine-grained chunks; summing them measures total
          # codebase size, not what a single page loads.
          #
          # This step now checks ONLY the largest individual chunk (a good
          # proxy for the dominant first-load payload) — the one sub-check
          # NOT covered by the authoritative script step below.
          FAIL=0

          # Largest single shared chunk. P10 budget is gzipped — must compare
          # gzipped against gzipped. Previous version compared raw bytes vs the
          # gzipped budget and emitted false-positive 400+ kB warnings.
          LARGEST_CHUNK_FILE=$(find apps/host/.next/static/chunks -maxdepth 1 -name '*.js' -type f 2>/dev/null | xargs -I {} sh -c 'echo "$(wc -c < "{}") {}"' | sort -nr | head -1 | awk '{print $2}')
          if [ -n "$LARGEST_CHUNK_FILE" ]; then
            LARGEST_RAW_KB=$(($(wc -c < "$LARGEST_CHUNK_FILE") / 1024))
            LARGEST_GZ_KB=$(($(gzip -c "$LARGEST_CHUNK_FILE" | wc -c) / 1024))
            echo "Largest shared chunk: ${LARGEST_GZ_KB} kB gzipped (${LARGEST_RAW_KB} kB raw) — limit: ${SHARED_JS_LIMIT_KB} kB gzipped"
            if [ "$LARGEST_GZ_KB" -gt "$SHARED_JS_LIMIT_KB" ]; then
              echo "::error::Largest shared chunk is ${LARGEST_GZ_KB} kB gzipped (> ${SHARED_JS_LIMIT_KB} kB). P10 invariant breach. Investigate with 'npm run analyze'."
              FAIL=1
            fi
          fi

          # 2026-07-20 — user-approved (Option A, CI speed-up PR #1349):
          # middleware + per-page P10 enforcement is delegated to the BLOCKING
          # "First-load JS budget (authoritative, gzipped per-page)" step below
          # (scripts/check-bundle-size.mjs — gzipped, HTML-scan,
          # CAP_MIDDLEWARE_KB=120, CAP_PAGE_KB=260), which measures the same
          # budgets correctly. The bash sub-checks removed here compared raw
          # bytes / whole-route-group directory sums (e.g. all of /super-admin,
          # or /api server-route chunks) against the gzipped PER-PAGE budgets —
          # a category error documented in the pre-existing comment above the
          # authoritative step — and had been passing vacuously since the
          # monorepo migration anyway. NOT a budget change: P10 limits are
          # unchanged and still blocking.

          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "Bundle size budget exceeded (blocking). See P10 in CLAUDE.md."
            echo "Run 'npm run analyze' locally to investigate."
            exit 1
          fi

          echo "All bundle sizes within budget."

      # Authoritative per-page first-load JS gate.
      # The bash check above measures raw bytes and only inspects the LARGEST
      # single shared chunk — it misses per-page violations and overstates
      # sizes ~3x by comparing raw to a gzipped budget.
      # check-bundle-size.mjs measures gzipped, uses HTML-scan to detect what's
      # actually shared first-paint (catches root-layout chunks the manifest
      # omits), and gates per-page first-load against the 260 kB P10 cap.
      # Caps live in the script (CAP_SHARED_KB, CAP_PAGE_KB=260, CAP_MIDDLEWARE_KB=120).
      #
      # REPAIRED 2026-07-28 (CI-gate forensic audit). The per-page half of this
      # gate had been measuring LITERALLY ZERO: it searched the Next.js 16 RSC
      # manifests for `/_next/static/chunks/`, a string that appears 0 times
      # across all 204 manifests (Next 16 emits bare `static/chunks/...`). Every
      # route reported 0.0 kB, "0 over cap", green. It was hiding 101 of 204
      # routes over the 260 kB budget, worst 307.0 kB. The bash per-page checks
      # that were deleted on 2026-07-20 "because this step supersedes them" had
      # therefore left NO per-page enforcement at all.
      #
      # The cap was NOT raised. Enforcement is a RATCHET against the committed
      # scripts/bundle-baseline.json: existing debt is grandfathered and printed
      # as a loud warning every run, growth beyond baseline fails, and any NEW
      # route over 260 kB fails. Exit 2 means the measurement itself went vacuous
      # (zero routes / zero chunk refs / all-zero sizes / missing baseline) — that
      # also blocks, by design.
      - name: First-load JS budget (authoritative, gzipped per-page)
        run: |
          set +e
          echo "## First-Load JS Budget (gzipped, per-page)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm run check:bundle-size 2>&1 | tee /tmp/bundle-report.txt
          BUNDLE_EXIT=${PIPESTATUS[0]}
          tail -80 /tmp/bundle-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$BUNDLE_EXIT" = "2" ]; then
            echo "::error::P10 bundle gate produced a VACUOUS measurement (exit 2). It is checking nothing — this is a gate failure, not a pass."
            echo "BLOCKED: P10 bundle gate is vacuous (measured nothing). See report above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [ "$BUNDLE_EXIT" != "0" ]; then
            echo "::error::Per-page first-load JS grew past its ratchet baseline, or a new route exceeds the 260 kB cap."
            echo "BLOCKED: Per-page first-load JS exceeds budget. See report above and P10 in CLAUDE.md." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: apps/host/.next/
          # FIX 2026-07-20: upload-artifact excludes hidden files by default,
          # and .next is a dot-directory — every prior run silently uploaded
          # NOTHING ("No files found" warning). Opt hidden files in so the
          # artifact actually contains the build.
          include-hidden-files: true
          retention-days: 7

  # ── Step 2b: E2E Tests (full suite — PR opt-in via `e2e-full` label) ──
  # 2026-07-20 (user-approved): the full ~342-test advisory suite no longer
  # runs on every PR push. It now runs:
  #   * nightly + on-demand against main — e2e-nightly.yml (advisory: false
  #     there, so a red nightly FAILS the run and pipeline-alert.yml opens
  #     the pipeline-failure issue), and
  #   * on a PR ONLY when the PR carries the `e2e-full` label (this job).
  # The suite steps live in the REUSABLE workflow e2e-suite.yml (staging
  # build + standalone server + playwright + report upload + server-log
  # dump) — single source of truth, no step duplication between the PR and
  # nightly callers. The BLOCKING e2e-critical-paths job below is untouched.
  #
  # Trigger mechanics: `labeled` is in the pull_request `types` at the top of
  # this file, so applying the label starts a fresh run of the WHOLE workflow
  # (GitHub has no per-job label trigger — see the cost/mitigation note on
  # the trigger). On subsequent pushes (`synchronize`) the label is still on
  # the PR, so the suite keeps running until the label is removed. Removing
  # the label does not cancel or erase a prior run's result.
  #
  # Same-repo guard unchanged from the inline job: fork PRs receive no
  # secrets, so the staging-env build inside e2e-suite.yml is impossible
  # there. The job stays advisory (advisory: true → continue-on-error on the
  # playwright step) and stays OUT of the ci-gate needs list.
  #
  # Reusable-workflow constraints: a job-level `uses:` cannot carry
  # `steps`/`timeout-minutes`/`runs-on` — those live in e2e-suite.yml.
  # `secrets: inherit` forwards this repo's secrets to the called workflow
  # (same-repo call, ./ ref). The PR check context becomes
  # "E2E Tests / E2E Suite" (caller job / called job) — fine, it is not a
  # ruleset-required context.
  e2e:
    name: E2E Tests
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'e2e-full')
    uses: ./.github/workflows/e2e-suite.yml
    with:
      advisory: true
    secrets: inherit

  # ── Step 2c: Critical-path E2E (BLOCKING) ──
  # Audit finding F9: the legacy `e2e` job above is `continue-on-error: true`
  # because it has known flakes; cleanup is a separate session. This new job
  # runs ONLY the two highest-blast-radius specs (quiz happy path, payment
  # checkout) and IS BLOCKING. A scoring or Razorpay regression must not ship
  # through CI green.
  #
  # Catalog entries: REG-45 (quiz), REG-46 (payment) — see
  # `.claude/regression-catalog.md`.
  # 2026-07-20 CI speed-up: `needs: build` removed — this job targets the
  # deployed https://alfanumrik.com and never consumed the CI build artifact.
  e2e-critical-paths:
    name: E2E Critical Paths (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on PRs targeting main/staging branches. Don't slow down feature
    # branches that haven't proposed a merge yet. Skip on forked PRs (no
    # secrets) — when staging fixtures are wired in, this `if` should also
    # require the same-repo guard used by the integration-tests job.
    # 2026-08-19: relocated off `pull_request` to the merge-queue tier. The
    # base-branch clause is unnecessary here -- a merge_group event only ever
    # exists for a branch that has a merge queue configured (main).
    if: github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx playwright install --with-deps chromium

      - name: Run critical-path E2E specs
        # BLOCKING — no continue-on-error. Tests that need a live test-user
        # fixture are registered with `test.fixme()` so they don't fail the
        # suite while the fixture is being wired (audit F9 follow-up). The
        # spec FILES must parse and any non-fixme tests must pass.
        #
        # TARGET: an in-job server, NOT the deployed domain.
        #
        # Until 2026-07-28 this job set BASE_URL to the production domain
        # "so we don't need to run a dev server in CI". That made a BLOCKING
        # PR gate assert against an artifact the PR does not contain:
        #   - a green run said nothing about the code under review;
        #   - a red run could not distinguish "this PR broke something" from
        #     "production is having a moment";
        #   - and it could never catch a regression BEFORE it shipped, which
        #     is the entire reason this gate exists.
        # It failed on its first armed run for exactly that reason: the
        # mocked session is keyed to the placeholder NEXT_PUBLIC_SUPABASE_URL
        # above, which cannot match a deployed build compiled against the real
        # project ref, so all 12 browser tests timed out logged-out.
        #
        # With BASE_URL unset, playwright.config.ts starts the app itself
        # (webServer block) against the same placeholder env the session shim
        # is keyed to. RPC calls are intercepted by page.route(), so quiz and
        # payment business logic is asserted against deterministic mocked
        # responses (P1/P2/P3/P11 invariant pinning) — no live backend needed.
        #
        # Deploy-drift detection against the real domain is NOT lost: it lives
        # in the post-deploy health check on main and the label-gated `e2e`
        # job. That is where production belongs — after a deploy, not as a
        # pre-merge blocker.
        run: npx playwright test e2e/quiz-happy-path.spec.ts e2e/payment-checkout.spec.ts
        env:
          # BASE_URL deliberately unset — see the note above.
          # Real-auth path: when these secrets are present, the `test.fixme`
          # guards in the specs flip off and the tests drive a live student
          # session. Until then, the specs run their mocked-only assertions
          # and skip the real-auth branches via fixme.
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-critical-paths-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # ── Step 3: CI Gate ──
  # 2026-07-20 CI speed-up: the advisory `e2e` job was removed from this gate.
  # Its TEST verdict was ALREADY ignored (the job's test STEP runs with
  # continue-on-error: true, so a test failure never fails the job). Infra
  # failures (npm ci / playwright install) could still fail the job, but that
  # infra path is exercised BLOCKING by e2e-critical-paths on main-bound PRs.
  # Waiting on `e2e` only delayed the gate by the job's ~35 min runtime.
  # 2026-07-20 follow-up (user-approved): `e2e` is now label opt-in on PRs
  # (`e2e-full`) and the full suite's scheduled safety net moved to
  # e2e-nightly.yml (blocking posture, watched by pipeline-alert.yml). `e2e`
  # MUST stay out of this needs list: a label-gated job is usually SKIPPED,
  # and a skipped need would poison the gate's required/success accounting.
  # The sharded unit-test jobs (unit-tests + unit-tests-merge) are required
  # in its place.
  #
  # 2026-08-11 asymmetry repair: 409123b5 had made this gate main-only
  # (`github.event_name != 'pull_request'`) AND dropped the four governance
  # jobs from its needs/required list. Both halves are restored. The gate now
  # aggregates the SAME job set on a PR and on the push that merges it, which
  # is the only way a green PR is evidence that main will stay green.
  #
  # NOTE FOR THE REPO OWNER: running here makes the failure VISIBLE on the PR;
  # it does not by itself make it BLOCKING. The `main-protection` ruleset
  # currently requires only: "Secret Scanning", "Lint, Type-check & Test",
  # "Production Build", "CodeQL Analysis". Add "CI Gate" to that list to make
  # this aggregate gate merge-blocking (repo setting, not a workflow change).
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - secret-scan
      - selected-school-rpc-integration
      - protected-flag-migration-guard
      - foxy-alignment
      - gen-mol-matrix
      - quality
      - unit-tests
      - unit-tests-changed
      - unit-tests-merge
      - edge-function-tests
      - integration-tests
      - build
      - e2e-critical-paths
    steps:
      - name: Enforce required CI outcomes
        env:
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPOSITORY_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          DEPENDABOT_ACTOR: ${{ github.actor == 'dependabot[bot]' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON || '{}');
          const eventName = process.env.EVENT_NAME;
          const sameRepoPr = process.env.SAME_REPOSITORY_PR === 'true';
          const isDependabot = process.env.DEPENDABOT_ACTOR === 'true';

          // ── EVENT MATRIX (rewritten 2026-08-19: two-tier pipeline) ───────
          // Every job in `needs` lands in exactly one of two lists — `required`
          // (must be 'success') or `expectedSkips` (must be EXACTLY 'skipped').
          // Nothing is ever silently unchecked, and nothing is ever forgiven
          // for failing: a job that RAN and FAILED is never 'skipped', so it
          // fails the gate on every event.
          //
          // The heavy jobs moved from the PR tier to the merge-queue tier on
          // 2026-08-19. They are NOT dropped — on `pull_request` they are
          // asserted to be EXACTLY 'skipped', so an `if:` drift that lets one
          // run (or a rename that makes it 'missing') fails this gate loudly,
          // and on merge_group/push they are asserted 'success' exactly as
          // before.
          //
          //                    | PR tier            | merge_group / push
          //   secret-scan      | required           | required
          //   selected-school  | required           | required
          //   protected-flag   | required           | required
          //   foxy-alignment   | required           | required
          //   gen-mol-matrix   | required           | required
          //   quality          | required           | required
          //   unit-tests-changed| required          | expected skip
          //   unit-tests (x4)  | expected skip      | required
          //   unit-tests-merge | expected skip      | required
          //   edge-function    | expected skip      | required
          //   build            | expected skip      | required
          //   integration-tests| expected skip      | required (push/merge_group,
          //                    |                    |  non-Dependabot); else skip
          //   e2e-critical     | expected skip      | required on merge_group only
          //
          // WHY workflow_dispatch STILL MATTERS: this gate used to be
          // unpassable there because integration-tests sat in `required` on
          // every event while its own `if:` was false outside push/same-repo-PR
          // (runs 31258602448, 31128820645). That class of bug is why every
          // conditional job below is RELOCATED into expectedSkips rather than
          // dropped from the list.
          const isPullRequest = eventName === 'pull_request';
          const heavyTier = ['unit-tests','unit-tests-merge','edge-function-tests','build'];

          const required = ['secret-scan','selected-school-rpc-integration','protected-flag-migration-guard','foxy-alignment','gen-mol-matrix','quality'];
          const expectedSkips = [];

          if (isPullRequest) {
            required.push('unit-tests-changed');
            expectedSkips.push(...heavyTier);
          } else {
            required.push(...heavyTier);
            expectedSkips.push('unit-tests-changed');
          }

          // integration-tests talks to the shared staging Supabase project, so
          // it needs real Actions secrets. Dependabot events read a separate
          // secret store and would hard-fail its preflight, so it is not
          // scheduled there — RELOCATED to expectedSkips, not dropped.
          if (!isPullRequest && !isDependabot && (eventName === 'push' || eventName === 'merge_group')) {
            required.push('integration-tests');
          } else {
            expectedSkips.push('integration-tests');
          }

          // e2e-critical-paths runs ONLY in the merge queue: it is the slowest
          // blocking job and its value is "this exact commit is safe to land".
          if (eventName === 'merge_group') {
            required.push('e2e-critical-paths');
          } else {
            expectedSkips.push('e2e-critical-paths');
          }

          // `sameRepoPr` is retained above as a diagnostic env value; it is no
          // longer part of the matrix because no job is fork-conditional now
          // (forks never produce a merge_group event).

          const failures = required.filter((job) => needs[job]?.result !== 'success');
          failures.push(...expectedSkips.filter((job) => needs[job]?.result !== 'skipped'));
          if (failures.length) {
            // DIAGNOSTIC PARTITION ONLY — the gate still exits 1 in every
            // non-success case. A cancelled upstream is NEVER forgiven: a
            // genuine cancellation (runner loss, job timeout, manual cancel)
            // must keep blocking the merge. All that changes below is the
            // wording, so a human can tell a supersede from a real break
            // without opening the run.
            const describe = (job) => job + '=' + (needs[job]?.result || 'missing');
            const cancelled = failures.filter((job) => needs[job]?.result === 'cancelled');
            const genuine = failures.filter((job) => needs[job]?.result !== 'cancelled');
            if (genuine.length === 0) {
              // Every non-success upstream was cancelled. Overwhelmingly this
              // is concurrency: cancel-in-progress killing an in-flight job
              // after a newer push to the same ref. "build" is the usual
              // victim: its artifact upload runs after ~4.5 min of build work,
              // so it is nearly always the job still running when a new
              // commit lands.
              console.error('CI Gate blocked by CANCELLED upstream(s) only, no genuine failure: ' + cancelled.map(describe).join(', '));
              console.error('LIKELY SUPERSEDE, not a broken build. Confirm before investigating:');
              console.error('  1. This run\'s GitHub run-level conclusion reads "cancelled", not "failure".');
              console.error('  2. A newer CI run exists for this branch (created moments before the cancellation).');
              console.error('If BOTH hold, this run was superseded by a newer push - read the newer run instead.');
              console.error('If EITHER does not hold, this was a real cancellation (runner loss, job timeout, manual cancel) and MUST be investigated.');
              process.exit(1);
            }
            // At least one upstream genuinely failed (or was skipped/missing).
            // Keep the original blunt wording and put the real failures FIRST
            // so a genuine break is never softened or buried by cancel noise.
            console.error('CI Gate failed: ' + genuine.concat(cancelled).map(describe).join(', '));
            if (cancelled.length) {
              console.error('(' + cancelled.length + ' further upstream(s) were cancelled: ' + cancelled.map(describe).join(', ') + '. Cancellation noise does NOT excuse the genuine failure(s) listed first.)');
            }
            process.exit(1);
          }
          console.log('CI Gate passed.');
          NODE
