# Edge Function auth sweep — live unauthenticated probe of every DEPLOYED
# function (including production-only orphans that no static test can see).
# Companion to the static sweep in
# apps/host/src/__tests__/edge-function-auth-guard-sweep.test.ts.
#
# Advisory-first rollout, mirroring rag-eval.yml: keep `continue-on-error`
# true until 5 consecutive clean runs, then flip to false so a regression
# (a function serving unauthenticated traffic) goes red loudly.
#
# The probe sends ONE anonymous `POST {}` per function with a 150ms gap —
# negligible load, no credentials, no mutation intent. Any state change it
# causes is itself the P9 finding.
name: Edge Function auth sweep

on:
  workflow_dispatch:
  schedule:
    # 22:30 UTC = 04:00 IST nightly (offset from rag-eval's 22:00 to avoid
    # overlapping probes against the same project)
    - cron: '30 22 * * *'

concurrency:
  group: edge-auth-sweep
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: Unauthenticated probe (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SECURITY FIX (2026-09-02, P0-4/P1-8 launch audit): this job had no
    # `environment:` key, so it could never see `secrets.SUPABASE_PROJECT_REF`
    # (an environment secret scoped to the `production` GitHub Environment,
    # not a repo secret) or SUPABASE_ACCESS_TOKEN from that scope. Every
    # single nightly run since this workflow was added exited immediately
    # with "CONFIG: SUPABASE_PROJECT_REF is required" (exit 2) — it never
    # once actually sent a probe. `continue-on-error: true` painted every one
    # of those config-error runs green, which is exactly how the previously
    # "5 consecutive clean nightly runs" bar for flipping this flag was
    # already satisfied without a single real probe ever executing. Live-
    # verified via `gh run view --log` on the last 3 scheduled runs before
    # this fix.
    environment: production
    # Advisory-first rollout, mirroring rag-eval.yml: keep `continue-on-error`
    # true until this job has produced 5 consecutive CLEAN runs that actually
    # executed the probe (verify via the step summary / logs, not just the
    # green checkmark — see the comment above for why the checkmark alone is
    # not sufficient evidence). Then flip to `false` so a regression (a
    # function serving unauthenticated traffic) goes red loudly.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true

      - name: Run sweep
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/edge-auth-sweep.mjs
