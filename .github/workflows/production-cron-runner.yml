name: Production Cron Runner - Alfanumrik

# Phase 0: Vercel is the sole scheduler. This manual break-glass path remains
# disabled until its protected environment has required reviewers.
on:
  workflow_dispatch:
    inputs:
      job_path:
        description: 'Exactly one allowlisted production cron route'
        type: choice
        required: true
        options:
          - /api/cron/school-operations
          - /api/cron/daily-cron
          - /api/cron/irt-calibrate
          - /api/cron/reconcile-payments
          - /api/cron/payments-health
          - /api/cron/expired-subscriptions
          - /api/cron/pre-debit-notice
          - /api/cron/board-score
          - /api/cron/reverify-domains
          - /api/cron/streak-guardian
          - /api/cron/flag-posture-canary
          - /api/cron/adaptive-loops-monitor
          - /api/cron/governance-health
          - /api/cron/synthesis-delivery-monitor
          - /api/cron/whatsapp-drain
      reason:
        description: 'Incident/change reference and reason'
        type: string
        required: true
      confirmation:
        description: 'Type RUN_ONE_PRODUCTION_CRON exactly'
        type: string
        required: true

concurrency:
  group: production-cron-runner
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Security boundary: CRON_SECRET is sourced from the CRON_SECRET GitHub Actions
  # secret (repo- or Production-environment-scoped), never a mutable repository
  # variable. AWS Secrets Manager (alfa-prod/app) was retired as the source on
  # 2026-08-03 when the AWS Fargate host was decommissioned — see
  # docs/runbooks/aws-host-decommission.md.
  TARGET_URL: 'https://alfanumrik.com'

jobs:
  gate:
    name: Authorize Production Cron Break-Glass
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail closed unless controls are active
        env:
          ENABLED: ${{ vars.ENABLE_PRODUCTION_CRON_BREAK_GLASS }}
          JOB_PATH: ${{ inputs.job_path }}
          REASON: ${{ inputs.reason }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Break-glass is disabled until production-break-glass has required reviewers."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Break-glass may run only from main."
            exit 1
          fi
          if [ "$CONFIRMATION" != "RUN_ONE_PRODUCTION_CRON" ]; then
            echo "::error::Confirmation must exactly match RUN_ONE_PRODUCTION_CRON."
            exit 1
          fi
          if [ -z "${REASON//[[:space:]]/}" ]; then
            echo "::error::A non-empty incident/change reason is required."
            exit 1
          fi
          case "$JOB_PATH" in
            /api/cron/school-operations|/api/cron/daily-cron|/api/cron/irt-calibrate|/api/cron/reconcile-payments|/api/cron/payments-health|/api/cron/expired-subscriptions|/api/cron/pre-debit-notice|/api/cron/board-score|/api/cron/reverify-domains|/api/cron/streak-guardian|/api/cron/flag-posture-canary|/api/cron/adaptive-loops-monitor|/api/cron/governance-health|/api/cron/synthesis-delivery-monitor|/api/cron/whatsapp-drain) ;;
            *) echo "::error::JOB_PATH is not one allowlisted production cron route."; exit 1 ;;
          esac
  run:
    name: Run One Production Cron
    runs-on: ubuntu-latest
    needs: gate
    environment: production-break-glass
    timeout-minutes: 90
    permissions:
      # id-token: write was only required for AWS OIDC (configure-aws-credentials).
      # Removed with the 2026-08-03 AWS decommission; least privilege restored.
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Run selected production crons
        env:
          JOB_PATH: ${{ inputs.job_path }}
          BREAK_GLASS_REASON: ${{ inputs.reason }}
          # CRON_SECRET now comes directly from the GitHub Actions secret store
          # (was AWS Secrets Manager alfa-prod/app until the 2026-08-03 AWS
          # decommission). GitHub auto-masks secret values in logs. The runner
          # script (scripts/run-production-crons.mjs) fails closed when
          # CRON_SECRET is empty, so a missing/unprovisioned secret aborts the
          # break-glass run rather than hitting production unauthenticated.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/run-production-crons.mjs

      - name: Upload cron run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-cron-runner-summary
          path: artifacts/production-cron-runner-summary.json
          if-no-files-found: ignore
          retention-days: 14
