name: OpenAPI Contract Drift Check

# Wave 2.1 (Phase 2 foundation): the /v2 contract is generated from a single Zod
# source (packages/lib/src/api/v2/contract.ts — canonical; apps/host/src/lib/api/v2/contract.ts
# is a thin re-export stub of it). The committed artifact openapi/v2.json
# MUST stay in lockstep with that source. This workflow regenerates the spec and
# fails if the committed file is stale, so the contract can't silently drift
# (which would desync the mobile Dart client).
#
# Fast + cheap: only runs when the contract source, the generator, the spec
# artifact, or the codegen config change. No Java / no Dart here — this checks
# ONLY the TS → OpenAPI half. The Dart client is regenerated in mobile CI
# (Wave 2.6).

on:
  push:
    branches: [main, master, develop]
    paths:
      # Monorepo paths (2026-07-17 migration): canonical Zod source. The old
      # pre-monorepo 'src/lib/api/v2/contract.ts' matched nothing, so this
      # gate never fired on contract changes. The apps/host re-export stub
      # ('apps/host/src/lib/api/v2/contract.ts') was removed from this list
      # 2026-08-04 — it was deleted from disk in the P2-3 stub-removal
      # cleanup (Phase 2/3b) and a path filter pointing at a deleted file
      # can never fire, same dead-pattern class as the hook self-test guards
      # against.
      - 'packages/lib/src/api/v2/contract.ts'
      - 'scripts/gen-openapi.mjs'
      - 'scripts/gen-openapi.build.mts'
      - 'openapi/v2.json'
      - 'openapitools.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/openapi-contract.yml'
  pull_request:
    branches: [main, master]
    paths:
      # Keep in lockstep with the push paths above (canonical only — see note above).
      - 'packages/lib/src/api/v2/contract.ts'
      - 'scripts/gen-openapi.mjs'
      - 'scripts/gen-openapi.build.mts'
      - 'openapi/v2.json'
      - 'openapitools.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/openapi-contract.yml'

permissions:
  contents: read

concurrency:
  group: openapi-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-drift:
    name: OpenAPI contract is in sync with Zod source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate + verify openapi/v2.json is committed & current
        run: |
          echo "## OpenAPI Contract Drift Check" >> $GITHUB_STEP_SUMMARY
          if npm run gen:openapi:check; then
            echo "| Status | openapi/v2.json is in sync with the Zod contract |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | DRIFT — openapi/v2.json is stale |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`npm run gen:openapi\` locally and commit the updated openapi/v2.json." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
