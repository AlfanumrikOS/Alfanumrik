title = "Alfanumrik gitleaks configuration"

# Extend the default gitleaks ruleset; only ADD path-based allowlists for
# test fixtures that intentionally use PII-shaped sentinel strings to verify
# our redactor catches them.

[extend]
useDefault = true

[allowlist]
description = "PII test sentinels — intentional fake values for redactor verification"
# 2026-07-20 (PR #1352): CI placeholder JWT used in workflow env blocks
# (ci.yml + deploy-staging.yml line 19 as NEXT_PUBLIC_SUPABASE_ANON_KEY;
# deploy-production.yml line 524 references it in a grep guard, and a JSDoc
# in apps/host/src/__tests__/helpers/integration.ts quotes it verbatim).
# It is a JWT *header* segment plus the literal
# ".placeholder" — NOT a credential (a real Supabase key has base64 payload +
# signature segments). generic-api-key flagged it only because a CRLF→LF
# normalization rewrote deploy-staging.yml, making the pre-existing line
# appear newly added. VALUE-scoped (not path-scoped: path-allowlisting
# workflow files could hide future real leaks) and anchored ^…$ so a real
# token that merely shares the standard JWT-header prefix cannot hide behind
# it. A fingerprint ignore was rejected — it would not survive
# squash-merge SHA changes. regexTarget is intentionally unset: the default
# target is the captured SECRET (gitleaks v8.24.3 detect.go).
regexes = [
    '^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.placeholder$',
    # 2026-07-22 (PR #1372): supabase/migrations/20260722101000_adaptive_loops_health_rpc.sql,
    # original commit 267f5ddc. generic-api-key false-positived on the prose
    # "auth_user_id, subject/chapter target" (a P13 comment enumerating the kinds
    # of row-identifying values this aggregate-only RPC does NOT return) — the
    # rule's keyword list matches "auth" in "auth_user_id" preceding a
    # `/`-containing token close enough to trip on entropy, capturing the bare
    # word "subject/chapter" as its Secret (verified locally with gitleaks
    # v8.24.3: Secret = "subject/chapter", entropy 3.51 — no credential shape,
    # no assignment operator, plain English prose). A later commit on this same
    # branch reworded the comment to "a subject or chapter target" so the string
    # no longer appears in HEAD, but gitleaks scans full commit-by-commit history
    # (`git log -p`), and the original commit's diff still contains the flagged
    # line — rewording it afterward does not erase it from history. Rewriting
    # history (rebase/squash) to remove it was out of scope (would require a
    # force-push), so per this file's own precedent for exactly this failure
    # class (see the JWT-placeholder entry immediately above), an allowlist
    # entry is the correct fix. VALUE-scoped (not path-scoped: path-allowlisting
    # a migrations file could hide a future real leak in the same or another
    # migration) and anchored ^…$ against the literal captured secret so
    # nothing broader can hide behind it.
    '^subject/chapter$',
    # 2026-08-21 (PR #1600): docs/audits/2026-08-21-out-of-band-write-incident-logs.md,
    # original commit cc28d775b. These two values are Supabase MANAGEMENT-PLANE
    # ACTOR IDENTIFIERS — a Studio session id and an MCP oauth session id — NOT
    # credentials. They are opaque handles the platform stamps into its own
    # audit trail; they carry no key material, they authenticate nothing, and
    # they cannot be replayed to obtain access. They appeared verbatim in the
    # `-- user:` trailers that Postgres records on every statement, captured as
    # part of a read-only log export documenting the two out-of-band write
    # incidents: 2026-08-18 on production `shktyoxqhundlvkiwguu`
    # (`session:d7881e43-…`) and 2026-08-20 on staging `gzpxqklxwzishrkiaatd`
    # (`oauth:c36bf53d-…`). Publishing them is the POINT of that file — they are
    # the only evidence tying the unauthorised writes to a specific actor
    # session, and the incident analysis cross-references them by value.
    #
    # generic-api-key fired on SHAPE, not substance: `oauth:` contains the rule's
    # `auth` keyword, `session:` its own, each followed by `:` and a
    # high-entropy `[\w-]{10,150}` run — a UUID satisfies that without being a
    # secret. The captured Secret is the bare UUID (default regexTarget), which
    # is what these anchors match.
    #
    # The audit file has SINCE BEEN TRUNCATED to 8-char prefixes
    # (`session:d7881e43-…[REDACTED]`), so the full values no longer appear in
    # HEAD. That is not sufficient on its own: gitleaks-action is DIFF-scoped and
    # on `pull_request` walks the PR's commits via `git log -p`, so the 38 lines
    # carrying the full values in commit cc28d775b are still scanned. Truncating
    # the working tree does not erase a value from the commit range — the same
    # lesson as the `^subject/chapter$` entry above. History rewrite was again
    # out of scope (force-push).
    #
    # VALUE-scoped and anchored ^…$, deliberately. NOT path-scoped: allowlisting
    # docs/audits/** would blind the scanner to a genuine credential pasted into
    # a future incident export — exactly the artefact most likely to contain one.
    # Anchoring means only these two exact identifiers can hide here; any other
    # value on the same lines still fails the gate.
    '^c36bf53d-13ec-492a-8af4-bd5bc1ada902$',
    '^d7881e43-542d-4d55-8221-dce4d638b85d$',
    # 2026-08-23 (PR #1605): scripts/verify-20260814-migrations.mjs — the
    # `MIGRATION_SET` array of migration FILENAMES. Implicated in three in-range
    # commits: b00b9c872 L118, 145eed3e7 L70, aac11f027 L69. No credential is
    # involved — every captured value is a migration filename that also exists
    # on disk under supabase/migrations/.
    #
    # MECHANISM: generic-api-key needs a keyword adjacent to a high-entropy run.
    # The word `access` inside the *filename*
    # `20260814000018_plan_subject_access_restrict.sql` satisfies the keyword
    # half, and the rule's `[\w.=-]{10,150}` capture group then runs past the
    # closing quote, the comma and the NEWLINE to swallow the NEXT array element
    # as its "Secret". The reported secret is therefore never the line that
    # tripped the rule — it is the line after it. Verified locally with gitleaks
    # v8.24.3: Secret = "20260814000019_trim_teacher_subjects_taught.sql",
    # entropy 4.31, no assignment operator, no key material.
    #
    # CLASS-scoped, NOT literal-pinned, deliberately. The captured value is not
    # stable: aac11f027 captured "20260814000013_trim_teacher_subjects_taught.sql"
    # while the two later commits captured "20260814000019_…". Same line —
    # renumbered mid-branch when colliding migrations were re-sequenced
    # (145eed3e7). A literal anchor would already need two entries today and
    # would re-break on the next renumber. The SHAPE is what is safe here, not
    # the value: exactly 14 digits, one underscore, lowercase/digits/underscores,
    # and a `.sql` terminator — a shape no API key, token, JWT, or Razorpay
    # live-mode secret can take.
    #
    # NOT path-scoped: allowlisting scripts/** or supabase/migrations/** would
    # blind the gate to a genuine leak in exactly the two trees where admin
    # scripts and migrations live — the trees most likely to hold a real
    # service-role key. A fingerprint ignore was rejected for the same reason as
    # the entries above: fingerprints embed the finding's commit SHA and do not
    # survive squash-merge. Anchored ^…$ so nothing wider can hide behind it.
    '^[0-9]{14}_[a-z0-9_]+\.sql$',
]
paths = [
    'src/__tests__/ai-prompt-pii\.test\.ts',
    'src/__tests__/sentry-pii-redaction\.test\.ts',
    'src/__tests__/sentry/.*\.test\.ts',
    'apps/host/src/__tests__/audit\.test\.ts',
    # Analytics P13 redactor spec — injects fake JWT / card-number /
    # Razorpay-signature sentinels into a funnel payload to prove the two-pass
    # redactor scrubs the VALUES before either analytics backend sees them.
    # No real credential; the scrub assertions depend on these exact fake
    # strings, so they cannot be changed. Path-scoped, single-file only.
    'apps/host/src/__tests__/analytics/posthog-identity-p13\.test\.ts',
    '\.agents/skills/upstash-qstash-js/fundamentals/local-development\.md',
    '\.agents/skills/upstash/upstash-qstash-js/fundamentals/local-development\.md',
    # Keyless Vercel-OIDC -> Workload Identity Federation invoker-token client.
    # The generic-api-key rule prose-false-positives on the "STS/impersonation"
    # phrase (the word "token" adjacent to a `/`-containing value) in a JSDoc
    # block and an inline comment. This client mints an EPHEMERAL runtime Google
    # ID token against a public Google endpoint — it is keyless by design and
    # contains NO literal secret, so allowlisting the file hides no real credential.
    # Path-scoped (commit-independent) because fingerprint suppression re-breaks
    # whenever the finding's commit SHA moves. Single-file scope only.
    'packages/lib/src/ai/clients/python-mol\.ts',
    # Analytics Wave 2 funnel-completion specs — fake fixtures for the
    # redactor / distinct-id hash-parity tests. These inject secret-shaped
    # sentinels (fake auth UUIDs like 3f2504e0-…, a `phc_test_key` PostHog
    # placeholder, and a precomputed 16-hex SHA-256 truncation anchor) precisely
    # BECAUSE the suites prove our hashing + person-property allowlist scrub the
    # VALUES. No real credential; the assertions depend on these exact fake
    # strings, so they cannot be changed. Path-scoped, single-file each.
    'apps/host/src/__tests__/analytics/wave2-role-person-prop\.test\.ts',
    'apps/host/src/__tests__/analytics/wave2-hash-parity\.test\.ts',
    'apps/host/src/__tests__/lib/identity/complete-signup-email-verified\.test\.ts',
    'apps/host/src/__tests__/lib/quiz/submit-side-effects-quiz-graded-stitch\.test\.ts',
]
